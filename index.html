  async function renderChapter(idx, resetScroll){
    chapterIdx = Math.max(0, Math.min(idx, activeChapters.length-1));
    readInner.innerHTML = activeChapters[chapterIdx].html;
    readInner.querySelectorAll("pre code").forEach(block=>{ try{ hljs.highlightElement(block); }catch(e){} });
    if(resetScroll !== false) readScroll.scrollTop = 0;
    chapterIndicator.textContent = (chapterIdx+1) + " / " + activeChapters.length;
    $("prevBtn").disabled = chapterIdx === 0;
    $("nextBtn").disabled = chapterIdx === activeChapters.length-1;
    Array.from(tocList.children).forEach((el,i)=> el.classList.toggle("active", i===chapterIdx));
    updateProgress();
    saveProgress();
    await loadInkForChapter();
    setupInkCanvas();
  }

  function updateProgress(){
    const el = readScroll;
    const max = el.scrollHeight - el.clientHeight;
    const frac = max > 0 ? el.scrollTop / max : 1;
    const overall = (chapterIdx + frac) / activeChapters.length;
    ribbonFill.style.height = Math.min(100, Math.max(2, overall*100)) + "%";
    progressPct.textContent = Math.round(overall*100) + "%";
    return overall;
  }
  readScroll.addEventListener("scroll", ()=>{
    updateProgress();
    clearTimeout(readScroll._t);
    readScroll._t = setTimeout(saveProgress, 500);
  });

  async function saveProgress(){
    if(!activeFile) return;

    activeFile.progress = {chapterIdx, pct, fontSize, theme};
    activeFile.updatedTs = Date.now();

  }

  function buildTOC(){
    tocList.innerHTML = "";
    const inkChapters = (activeFile && activeFile.inkChapters) || [];
    activeChapters.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "toc-item" + (i===chapterIdx ? " active":"");
      b.innerHTML = '<span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="toc-title">'+escapeHtml(c.title)+'</span>'+
        (inkChapters.includes(i) ? '<span class="toc-ink-dot" aria-label="필기 있음"></span>' : '');
      // phones: the TOC is a full overlay, so picking a chapter should get
      // it out of the way; tablet/desktop: it's a persistent side panel,

  $("backBtn").addEventListener("click", ()=>{
    setPenMode(false);

  $("prevBtn").addEventListener("click", ()=> renderChapter(chapterIdx-1));

  // desktop/laptop: arrow keys flip chapters, same as the prev/next buttons
  document.addEventListener("keydown", (e)=>{
    if(!readerScreenVisible()) return;
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==="Escape"){
      closeDrawer(); closeSettings(); setPenMode(false);
      return;
    }

    // the current chapter instead of jumping chapters unexpectedly

      if(chapterIdx < activeChapters.length-1){ e.preventDefault(); renderChapter(chapterIdx+1); }
    } else if(e.key==="ArrowLeft"){

  let touchX = null, touchY = null;

    if(penMode || touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    // only treat as a page-turn swipe if the drag is clearly horizontal,
    // so normal up/down scrolling on tablets never gets mistaken for it
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0 && chapterIdx < activeChapters.length-1) renderChapter(chapterIdx+1);
      else if(dx > 0 && chapterIdx > 0) renderChapter(chapterIdx-1);
    }
    touchX = null; touchY = null;
  }, {passive:true});

  // At tablet width+ the TOC is an in-flow side panel, not an overlay, so it
  // doesn't need the dimming #overlay (and shouldn't block taps on the reader
  // behind it — there is no "behind" once it's part of the layout).
  function isTabletUp(){ return window.innerWidth >= 720; }
  function openDrawer(){ drawer.classList.add("show"); if(!isTabletUp()) $("overlay").classList.add("show"); }
  function closeDrawer(){ drawer.classList.remove("show"); if(!isTabletUp()) $("overlay").classList.remove("show"); }
  $("tocBtn").addEventListener("click", ()=>{
    buildTOC();
    if(drawer.classList.contains("show")) closeDrawer(); else openDrawer();
  });
  $("overlay").addEventListener("click", ()=>{ closeDrawer(); closeSettings(); closeInkPop(); });

  // Touch-drag for the TOC drawer (phones + tablets): swipe in from the left
  // screen edge to open it, drag it left to close — not just tap-to-toggle.
  // Mobile animates transform (overlay drawer); tablet animates width (in-
  // flow panel) — see the .drawer CSS. Direction is locked from the first
  // real move so this never steals a vertical scroll inside the TOC list,
  // the same disambiguation the chapter page-turn swipe above already uses.
  (function setupDrawerSwipe(){
    const EDGE_ZONE = 24;
    const VERTICAL_TOLERANCE = 1.5;
    let dragging = false, undecided = false, dragMode = null;
    let startX = 0, startY = 0, maxW = 300;

    function drawerMaxWidth(){ return isTabletUp() ? 300 : Math.min(300, window.innerWidth * 0.82); }
    function setDragPx(px){
      const clamped = Math.max(0, Math.min(maxW, px));
      if(isTabletUp()){
        drawer.style.width = clamped + "px";
      } else {
        drawer.style.transform = "translateX(" + (clamped - maxW) + "px)";
        $("overlay").classList.add("show");
        $("overlay").style.opacity = String(clamped / maxW);
      }
    }
    function finishDrag(open, finalPx){
      drawer.style.transition = "none";
      setDragPx(finalPx);
      // force a paint with transition still off before re-enabling it, so
      // the browser has an actual "before" frame to animate away from
      drawer.getBoundingClientRect();
      requestAnimationFrame(()=>{
        drawer.style.transition = "";
        drawer.style.width = "";
        drawer.style.transform = "";
        $("overlay").style.opacity = "";
        if(open){ buildTOC(); openDrawer(); } else { closeDrawer(); }
      });
    }
    function onStart(e){
      if(!readerScreenVisible() || penMode) return;
      const t = e.touches[0];
      const isOpen = drawer.classList.contains("show");
      if(isOpen){
        if(!drawer.contains(e.target)) return;
        dragMode = "close";
      } else {
        if(t.clientX > EDGE_ZONE) return;
        dragMode = "open";
      }
      undecided = true; dragging = false;
      startX = t.clientX; startY = t.clientY;
      maxW = drawerMaxWidth();
    }
    function onMove(e){
      if(!undecided && !dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if(undecided){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return; // not enough movement yet to tell
        undecided = false;
        if(Math.abs(dx) < Math.abs(dy) * VERTICAL_TOLERANCE) return; // vertical — leave it to native scroll
        dragging = true;
        drawer.style.transition = "none";
      }
      if(!dragging) return;
      e.preventDefault();
      const base = dragMode === "close" ? maxW : 0;
      setDragPx(base + dx);
    }
    function onEnd(e){
      undecided = false;
      if(!dragging){ return; }
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const base = dragMode === "close" ? maxW : 0;
      const finalPx = base + dx;
      finishDrag(finalPx > maxW * 0.4, finalPx);
    }
    const body = $("readerBody");
    body.addEventListener("touchstart", onStart, {passive:true});
    body.addEventListener("touchmove", onMove, {passive:false});
    body.addEventListener("touchend", onEnd, {passive:true});
    body.addEventListener("touchcancel", onEnd, {passive:true});

    // Laptops/desktops have no swipe gesture, so the equivalent is dragging
    // the divider on the panel's own right edge (mouse only — touch devices
    // already get the drag above from anywhere in the open drawer).
    const handle = $("drawerResizeHandle");
    function onMouseDown(e){
      if(!readerScreenVisible() || !drawer.classList.contains("show")) return;
      e.preventDefault();
      dragMode = "close";
      dragging = true; undecided = false;
      startX = e.clientX; startY = e.clientY;
      maxW = drawerMaxWidth();
      drawer.style.transition = "none";
      handle.classList.add("dragging");
      document.addEventListener("mousemove", onMouseMoveDoc);
      document.addEventListener("mouseup", onMouseUpDoc);
    }
    function onMouseMoveDoc(e){
      if(!dragging) return;
      setDragPx(maxW + (e.clientX - startX));
    }
    function onMouseUpDoc(e){
      if(!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.removeEventListener("mousemove", onMouseMoveDoc);
      document.removeEventListener("mouseup", onMouseUpDoc);
      const finalPx = maxW + (e.clientX - startX);
      finishDrag(finalPx > maxW * 0.4, finalPx);
    }
    handle.addEventListener("mousedown", onMouseDown);
  })();

  function openSettings(){ settingsPop.classList.add("show"); $("overlay").classList.add("show"); }
  function closeSettings(){ settingsPop.classList.remove("show"); $("overlay").classList.remove("show"); }
  $("settingsBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    settingsPop.classList.contains("show") ? closeSettings() : openSettings();
  });

  function applyFont(){
    fontSize = Math.max(14, Math.min(26, fontSize));
    document.documentElement.style.setProperty("--read-size", fontSize+"px");
    fontVal.textContent = fontSize+"px";
    resizeInkCanvas();
  }
  $("fontMinus").addEventListener("click", ()=>{ fontSize -= 1; applyFont(); saveProgress(); });
  $("fontPlus").addEventListener("click", ()=>{ fontSize += 1; applyFont(); saveProgress(); });

  function applyTheme(){
    readerScreen.setAttribute("data-theme", theme);
    if(theme === "custom"){
      readScroll.style.setProperty("--read-bg", customBg);
      readScroll.style.setProperty("--read-text", customText);
    } else {
      readScroll.style.removeProperty("--read-bg");
      readScroll.style.removeProperty("--read-text");
    }
    $("customThemeSwatch").style.setProperty("--sw-custom-bg", customBg);
    $("customThemeSwatch").style.setProperty("--sw-custom-text", customText);
    document.querySelectorAll(".theme-swatch").forEach(s=> s.classList.toggle("active", s.dataset.themeChoice === theme));
  }
  document.querySelectorAll(".theme-swatch").forEach(s=>{
    s.addEventListener("click", ()=>{ theme = s.dataset.themeChoice; applyTheme(); saveProgress(); });
  });

  // "직접" theme: colors are a global preference (shared across every book),
  // picking either one live-previews and switches the active book to it.
  let customThemeSaveTimer = null;
  function scheduleCustomThemeSave(){
    clearTimeout(customThemeSaveTimer);
    customThemeSaveTimer = setTimeout(()=>{ saveProgress(); persistPrefs(); }, 150);
  }
  $("customBgInput").addEventListener("input", ()=>{
    customBg = $("customBgInput").value;
    theme = "custom";
    applyTheme();
    scheduleCustomThemeSave();
  });
  $("customTextInput").addEventListener("input", ()=>{
    customText = $("customTextInput").value;
    theme = "custom";
    applyTheme();
    scheduleCustomThemeSave();
  });

  /* ---------------- ink (handwriting) layer ----------------
     Two stacked canvases live inside #readInner (so they scroll with the
     chapter's own content): a highlight layer (mix-blend-mode:multiply, so
     marker strokes sit visually behind the text) and an ink layer on top for
     pen/eraser. Strokes are stored per file+chapter, normalized to 0..1 of
     the content box so they rescale when font size / width changes.
     Known limitation: a big font-size change reflows text non-uniformly, so
     ink follows along approximately rather than staying pixel-anchored to a
     specific word. */
  let inkCanvas = null, inkCtx = null;
  let highlightCanvas = null, highlightCtx = null;
  let inkStrokes = [];
  let inkColor = "#3F3A34";
  let inkSize = 4.5;
  let inkTool = "pen"; // 'pen' | 'highlighter' | 'eraser'
  let penMode = false;
  let inkDrawing = null;
  let inkActivePointerId = null;
  let inkActiveStylusId = null;   // palm rejection: pointerId of the stylus currently down
  let inkLastPenActivityTs = 0;   // palm rejection: ignore touch shortly after/around pen use
  let inkRedoStack = [];          // per-chapter; a fresh stroke clears it, like any undo/redo stack

  function inkKey(){ return activeFile ? "ink:"+activeFile.id+":"+chapterIdx : null; }

  async function loadInkForChapter(){
    const key = inkKey();
    inkStrokes = key ? await S.getJSON(key, []) : [];
    inkRedoStack = [];
    updateInkUndoButtons();
  }
  async function saveInkForChapter(){
    const key = inkKey();
    if(!key || !activeFile) return;
    await S.setJSON(key, inkStrokes);
    const set = new Set(activeFile.inkChapters || []);
    if(inkStrokes.length > 0) set.add(chapterIdx); else set.delete(chapterIdx);
    activeFile.inkChapters = Array.from(set).sort((a,b)=>a-b);
    await persistFiles();
  }

  function setupInkCanvas(){
    if(inkCanvas) inkCanvas.remove();
    if(highlightCanvas) highlightCanvas.remove();
    highlightCanvas = document.createElement("canvas");
    highlightCanvas.className = "ink-canvas highlight-layer";
    readInner.appendChild(highlightCanvas);
    highlightCtx = highlightCanvas.getContext("2d");

    inkCanvas = document.createElement("canvas");
    inkCanvas.className = "ink-canvas" + (penMode ? "" : " inactive");
    readInner.appendChild(inkCanvas);
    inkCtx = inkCanvas.getContext("2d");

    wireInkPointerEvents();
    resizeInkCanvas();
  }

  function resizeInkCanvas(){
    if(!inkCanvas || !highlightCanvas) return;
    const w = readInner.clientWidth;
    const h = readInner.scrollHeight;
    const dpr = window.devicePixelRatio || 1;
    [inkCanvas, highlightCanvas].forEach(c=>{
      c.width = Math.max(1, Math.round(w*dpr));
      c.height = Math.max(1, Math.round(h*dpr));
      c.style.width = w+"px";
      c.style.height = h+"px";
    });
    inkCtx.setTransform(dpr,0,0,dpr,0,0);
    highlightCtx.setTransform(dpr,0,0,dpr,0,0);
    redrawInk();
  }

  function ctxForTool(tool){ return tool==="highlighter" ? highlightCtx : inkCtx; }

  function applyStrokeStyle(ctx, tool, color, width){
    ctx.lineJoin = "round";
    if(tool==="eraser"){
      ctx.globalCompositeOperation = "destination-out";
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#000";
      ctx.lineWidth = width;
      ctx.lineCap = "round";
    } else if(tool==="highlighter"){
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "butt";
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
    }
  }

  // Smooths a raw point list into a quadratic-curve path: each real point
  // becomes a curve control point, with the midpoint between consecutive
  // points as the curve's on-path endpoint — the standard freehand-smoothing
  // technique, avoids the faceted look of plain point-to-point lineTo.
  function tracePath(ctx, points, w, h){
    if(points.length === 1){
      const p = points[0];
      ctx.moveTo(p[0]*w, p[1]*h);
      ctx.lineTo(p[0]*w, p[1]*h);
      return;
    }
    ctx.moveTo(points[0][0]*w, points[0][1]*h);
    let i;
    for(i=1;i<points.length-1;i++){
      const cx = (points[i][0]+points[i+1][0])/2*w;
      const cy = (points[i][1]+points[i+1][1])/2*h;
      ctx.quadraticCurveTo(points[i][0]*w, points[i][1]*h, cx, cy);
    }
    const last = points[points.length-1];
    ctx.lineTo(last[0]*w, last[1]*h);
  }

  function paintStroke(stroke, w, h){
    if(stroke.points.length < 1) return;
    const ctx = ctxForTool(stroke.tool);
    ctx.save();
    applyStrokeStyle(ctx, stroke.tool, stroke.color, stroke.width);
    ctx.beginPath();
    tracePath(ctx, stroke.points, w, h);
    ctx.stroke();
    ctx.restore();
  }

  function redrawInk(){
    if(!inkCtx || !highlightCtx) return;
    const w = readInner.clientWidth, h = readInner.scrollHeight;
    inkCtx.clearRect(0,0,w,h);
    highlightCtx.clearRect(0,0,w,h);
    inkStrokes.forEach(s=> paintStroke(s, w, h));
  }

  function pointerToNorm(e){
    const w = readInner.clientWidth, h = readInner.scrollHeight;
    const rect = inkCanvas.getBoundingClientRect();
    return [ (e.clientX-rect.left)/w, (e.clientY-rect.top)/h ];
  }

  function strokeWidthFor(e){
    if(inkTool==="eraser") return inkSize*2.4;
    if(inkTool==="highlighter") return inkSize*3.2;
    const pressure = e.pressure && e.pressure>0 ? e.pressure : 0.5;
    return inkSize*(0.6+pressure*0.8);
  }

  function undoLastStroke(){
    if(inkStrokes.length===0) return;
    inkRedoStack.push(inkStrokes.pop());
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
  }
  function redoLastStroke(){
    if(inkRedoStack.length===0) return;
    inkStrokes.push(inkRedoStack.pop());
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
  }
  function updateInkUndoButtons(){
    const undoBtn = $("inkUndoBtn"), redoBtn = $("inkRedoBtn");
    if(undoBtn) undoBtn.disabled = inkStrokes.length===0;
    if(redoBtn) redoBtn.disabled = inkRedoStack.length===0;
  }

  // Brush-size cursor ring: only for pen/mouse (hover-capable pointers) — a
  // finger already sits exactly where it draws, so a trailing DOM circle
  // would just be visual noise for touch input.
  let inkCursorEl = null;
  function ensureInkCursor(){
    if(!inkCursorEl){
      inkCursorEl = document.createElement("div");
      inkCursorEl.className = "ink-cursor";
      document.body.appendChild(inkCursorEl);
    }
    return inkCursorEl;
  }
  function updateInkCursor(e, width){
    if(e.pointerType === "touch"){ hideInkCursor(); return; }
    const el = ensureInkCursor();
    const w = Math.max(6, width);
    el.style.display = "block";
    el.style.width = w+"px";
    el.style.height = w+"px";
    el.style.left = e.clientX+"px";
    el.style.top = e.clientY+"px";
    if(inkTool==="eraser"){
      el.style.borderRadius = "50%";
      el.style.border = "1.5px solid rgba(63,58,52,.55)";
      el.style.background = "rgba(63,58,52,.08)";
    } else if(inkTool==="highlighter"){
      el.style.borderRadius = "3px";
      el.style.border = "1px solid rgba(63,58,52,.35)";
      el.style.background = inkColor;
      el.style.opacity = "0.5";
    } else {
      el.style.borderRadius = "50%";
      el.style.border = "1px solid rgba(255,255,255,.65)";
      el.style.background = inkColor;
      el.style.opacity = "0.55";
    }
  }
  function hideInkCursor(){ if(inkCursorEl) inkCursorEl.style.display = "none"; }

  function wireInkPointerEvents(){
    inkCanvas.addEventListener("pointerdown", (e)=>{
      if(!penMode) return;
      // Palm rejection: while (or just after) a stylus is in contact, ignore
      // touch input entirely so a resting palm doesn't leave stray marks.
      if(e.pointerType==="touch"){
        const recentPen = Date.now()-inkLastPenActivityTs < 700;
        if(inkActiveStylusId!==null || recentPen) return;
      }
      if(e.pointerType==="pen"){ inkActiveStylusId = e.pointerId; inkLastPenActivityTs = Date.now(); }
      e.preventDefault();
      inkActivePointerId = e.pointerId;
      try{ inkCanvas.setPointerCapture(e.pointerId); }catch(err){}
      const width = strokeWidthFor(e);
      updateInkCursor(e, width);
      inkDrawing = { tool:inkTool, color:inkColor, width, points:[pointerToNorm(e)] };
    });
    inkCanvas.addEventListener("pointermove", (e)=>{
      if(!penMode) return;
      if(e.pointerType==="pen") inkLastPenActivityTs = Date.now();
      updateInkCursor(e, strokeWidthFor(e));
      if(!inkDrawing || e.pointerId !== inkActivePointerId) return;
      e.preventDefault();
      const w = readInner.clientWidth, h = readInner.scrollHeight;
      const pt = pointerToNorm(e);
      const prev = inkDrawing.points[inkDrawing.points.length-1];
      inkDrawing.points.push(pt);
      const ctx = ctxForTool(inkDrawing.tool);
      ctx.save();
      applyStrokeStyle(ctx, inkDrawing.tool, inkDrawing.color, inkDrawing.width);
      ctx.beginPath();
      ctx.moveTo(prev[0]*w, prev[1]*h);
      ctx.lineTo(pt[0]*w, pt[1]*h);
      ctx.stroke();
      ctx.restore();
    });
    const endStroke = (e)=>{
      if(e && e.pointerType==="pen" && e.pointerId===inkActiveStylusId) inkActiveStylusId = null;
      if(!inkDrawing || (e && e.pointerId!==undefined && e.pointerId!==inkActivePointerId)) return;
      if(inkDrawing.points.length>1){
        inkStrokes.push(inkDrawing);
        inkRedoStack = [];
        saveInkForChapter();
        updateInkUndoButtons();
        // the live preview drew plain segments for low-latency feedback;
        // redraw now so the committed stroke gets the smoothed curve treatment
        redrawInk();
      }
      inkDrawing = null;
      inkActivePointerId = null;
    };
    inkCanvas.addEventListener("pointerup", endStroke);
    inkCanvas.addEventListener("pointercancel", endStroke);
    inkCanvas.addEventListener("pointerleave", (e)=>{
      if(e.pointerId===inkActivePointerId) endStroke(e);
      hideInkCursor();
    });
  }

  function setPenMode(on){
    penMode = on;
    $("penBtn").classList.toggle("active", on);
    if(inkCanvas) inkCanvas.classList.toggle("inactive", !penMode);
    if(on){ closeSettings(); openInkPop(); } else { closeInkPop(); hideInkCursor(); }
  }
  // no shared #overlay here on purpose: it sits above the ink canvas
  // (z-index 50 vs 5) and would silently block every drawing gesture
  // while the toolbar is open, since pen mode keeps the toolbar open
  // the whole time you're drawing.
  function openInkPop(){ $("inkPop").classList.add("show"); }
  function closeInkPop(){ $("inkPop").classList.remove("show"); }
  $("penBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    if(!penMode){ setPenMode(true); return; }
    // pen is already selected: if the toolbar is showing, this tap means
    // "I'm done" (turn drawing off); if it was already dismissed by an
    // outside tap, just bring the tool options back without losing the
    // selected pen/color.
    if($("inkPop").classList.contains("show")) setPenMode(false);
    else openInkPop();
  });
  // Tapping anywhere outside the toolbar dismisses just the toolbar — the
  // pen stays selected and ready to draw, it just gets out of the way.
  document.addEventListener("pointerdown", (e)=>{
    if(!penMode) return;
    const pop = $("inkPop");
    if(!pop.classList.contains("show")) return;
    if(pop.contains(e.target) || e.target.closest("#penBtn")) return;
    closeInkPop();
  });

  document.querySelectorAll(".ink-swatch[data-ink-color]").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      inkTool = "pen"; inkColor = sw.dataset.inkColor;
      document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
      sw.classList.add("active");
    });
  });
  document.querySelectorAll(".ink-swatch[data-ink-highlight]").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      inkTool = "highlighter"; inkColor = sw.dataset.inkHighlight;
      document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
      sw.classList.add("active");
    });
  });
  $("inkEraserBtn").addEventListener("click", ()=>{
    inkTool = "eraser";
    document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
    $("inkEraserBtn").classList.add("active");
  });
  document.querySelectorAll(".ink-size-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      inkSize = parseFloat(b.dataset.inkSize);
      document.querySelectorAll(".ink-size-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    });
  });
  $("inkUndoBtn").addEventListener("click", undoLastStroke);
  $("inkRedoBtn").addEventListener("click", redoLastStroke);
  $("inkClearBtn").addEventListener("click", ()=>{
    inkStrokes = [];
    inkRedoStack = [];
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
  });

  window.addEventListener("resize", ()=>{
    if(readerScreenVisible()) resizeInkCanvas();
  });
  // tablet: the TOC panel's width animates (open/close), which reflows how
  // much room the reading column actually has — resync the ink canvas once
  // that animation settles rather than mid-transition.
  drawer.addEventListener("transitionend", (e)=>{
    if(e.propertyName === "width" && readerScreenVisible()) resizeInkCanvas();
  });

  /* ---------------- PWA: service worker registration ---------------- */
  // GitHub Pages serves sw.js with Cache-Control: max-age=600, so a plain
  // "./sw.js" registration can keep re-checking a stale cached copy for up
  // to 10 minutes after a deploy and never notice the update. Bumping this
  // query string on every deploy (alongside the cache names in sw.js) forces
  // a genuine network fetch every time, since the browser has never cached
  // that exact URL before.
  const SW_VERSION = "31";
  if("serviceWorker" in navigator){
    // Only reload when an *update* replaces an already-controlling worker.
    // sw.js calls clients.claim(), which makes navigator.serviceWorker.controller
    // become non-null right after activation even on a brand-new install — so
    // without this check every first-ever visit would trigger a surprise reload.
    const hadControllerBeforeRegister = !!navigator.serviceWorker.controller;
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js?v="+SW_VERSION).then(reg=>{
        // once a new shell takes over, reload once so the user gets it immediately
        let reloaded = false;
        reg.addEventListener("updatefound", ()=>{
          const installing = reg.installing;
          if(!installing) return;
          installing.addEventListener("statechange", ()=>{
            if(installing.state === "activated" && hadControllerBeforeRegister && !reloaded){
              reloaded = true;
              location.reload();
            }
          });
        });
      }).catch(()=>{});
    });
  }

  /* ---------------- init ---------------- */
  (async function init(){
    await loadLibrary();
    await loadPrefs();
    markLibraryReady();
    sortSelect.value = sortMode;
    updateDensityButtons();
    $("customBgInput").value = customBg;
    $("customTextInput").value = customText;
    $("customThemeSwatch").style.setProperty("--sw-custom-bg", customBg);
    $("customThemeSwatch").style.setProperty("--sw-custom-text", customText);
    renderAll();

    // cloud sync loads in the background — never blocks the local-first
    // startup above, and just leaves the "로그인" button in place if it
    // can't load (offline, blocked, etc.)
    renderAccount();
    ensureFirebase();
    prepareGis();
    window.addEventListener("focus", ()=>{ if(fb && fb.currentUser) syncNow(); });
    setInterval(()=>{ if(fb && fb.currentUser) syncNow(); }, 5*60*1000);
  })();

})();
</script>
</body>
</html>
