<style>
  :root{
    --bg-app:#F7F5F2;
    --bg-sunken:#F1ECE5;
    --bg-sunken-2:#E9E0D2;
    --surface:#FFFFFF;
    --line:#EAE3DA;
    --line-strong:#DCD1C0;
    --text-900:#3F3A34;
    --text-700:#57524D;
    --text-500:#8B8177;
    --text-400:#B6ABA0;
    --accent-300:#E3A576;
    --accent-400:#C97A45;
    --accent-500:#A85F30;
    --accent-wash:rgba(201,122,69,0.12);
    --danger:#DB7C72;
    --danger-wash:rgba(219,124,114,0.12);

    --ui-font:'Noto Sans KR', sans-serif;
    --display-font:'Space Grotesk', 'Noto Sans KR', sans-serif;
    --read-font-serif:'Noto Serif KR', serif;
    --read-font:'Noto Serif KR', serif;
    --read-line:1.85;
    --read-size:18px;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:40px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow-sm:0 1px 2px rgba(63,58,52,.08);
    --shadow-md:0 8px 24px rgba(63,58,52,.10);
    --shadow-lg:0 20px 50px rgba(63,58,52,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    margin:0; font-family:var(--ui-font); background:var(--bg-app); color:var(--text-700); overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-400); color:#fff9f4;}
  svg{display:block;}
  .icon{width:18px; height:18px; flex:0 0 auto;}

  :focus-visible{outline:2px solid var(--accent-400); outline-offset:2px; border-radius:6px;}

  /* thin scrollbars for desktop */
  .lib-main, .read-scroll, .toc-list, .rail-row{scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;}
  .lib-main::-webkit-scrollbar, .toc-list::-webkit-scrollbar, .rail-row::-webkit-scrollbar{width:7px; height:7px;}
  .lib-main::-webkit-scrollbar-thumb, .toc-list::-webkit-scrollbar-thumb, .rail-row::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
  .lib-main::-webkit-scrollbar-track, .toc-list::-webkit-scrollbar-track, .rail-row::-webkit-scrollbar-track{background:transparent;}

  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* ============ LIBRARY SCREEN ============ */
  #libraryScreen{background:var(--bg-app);}

  .lib-topbar{
    display:flex; align-items:center; gap:var(--sp-2);
    padding:var(--sp-4) var(--sp-4); padding-top:calc(var(--sp-4) + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    flex:0 0 auto; background:var(--surface);
  }
  .lib-brand{font-family:var(--ui-font); font-weight:800; font-size:14px; letter-spacing:.05em; color:var(--accent-500); text-transform:uppercase; line-height:1.15; white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .lib-spacer{flex:1;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; border-radius:var(--r-sm);
    font-size:13px; font-weight:600; padding:10px 13px; white-space:nowrap; flex:0 0 auto;
    transition:background-color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  /* narrow phones (~360px and under is the most common Android width): the
     secondary action collapses to icon-only rather than shrinking every
     button's padding/font, so both buttons keep the same visual weight as
     the rest of the UI instead of looking pinched */
  @media (max-width:719px){
    .lib-topbar{gap:8px;}
    .btn-ghost{padding:10px; gap:0;}
    .btn-ghost .btn-label{display:none;}
  }
  /* At the narrowest common width (360px) the row still cannot seat the
     wordmark alongside three actions and the account button, and a
     truncated "STUDY ..." reads worse than none — the app names itself on
     its launcher icon and tab anyway. The ellipsis above stays as the
     backstop for whatever a substituted font does in between. */
  @media (max-width:520px){
    .lib-brand{font-size:12px; letter-spacing:.03em;}
  }
  @media (max-width:344px){
    .lib-brand{display:none;}
  }
  .btn-primary{background:var(--accent-400); color:#fffaf6; box-shadow:var(--shadow-sm);}
  .btn-primary:active{background:var(--accent-500); transform:translateY(1px); box-shadow:none;}
  .btn-ghost{background:var(--surface); color:var(--text-700); border:1px solid var(--line-strong);}
  .btn-ghost:active{background:var(--bg-sunken); transform:translateY(1px);}
  @media (hover:hover) and (pointer:fine){
    .btn-primary:hover{background:#BD703E; box-shadow:0 4px 14px rgba(201,122,69,.28);}
    .btn-ghost:hover{border-color:var(--text-400); background:var(--bg-sunken);}
  }

  .lib-search-bar{
    position:relative; display:flex; flex-direction:column; gap:8px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); flex:0 0 auto;
  }
  .search-row{display:flex;}
  .controls-row{display:flex; align-items:center; gap:8px;}
  .search-toggle-btn{
    display:none; flex:0 0 auto; width:34px; height:34px; border-radius:var(--r-sm);
    border:1px solid transparent; background:var(--bg-sunken); color:var(--text-500);
    align-items:center; justify-content:center; transition:background-color .15s var(--ease), color .15s var(--ease);
  }
  .search-toggle-btn .icon{width:16px; height:16px;}
  .search-toggle-btn.active{background:var(--accent-wash); color:var(--accent-500);}
  /* phones: the search bar sat above the controls row as its own full row
     every time, permanently spending height on something used occasionally
     — collapse it into a small button that drops the input down as an
     overlay on demand instead. Sort/density controls stay always visible. */
  @media (max-width:719px){
    .search-toggle-btn{display:flex;}
    .search-row{display:none;}
    .search-row.open{
      display:flex; position:absolute; left:16px; right:16px; top:100%;
      margin-top:-8px; padding:10px 0 12px; background:var(--surface);
      border-bottom:1px solid var(--line); box-shadow:var(--shadow-lg); z-index:20;
    }
  }
  .search-field{position:relative; flex:1; display:flex; align-items:center;}
  .search-field .icon{position:absolute; left:10px; width:16px; height:16px; color:var(--text-400); pointer-events:none;}
  .search-field input{
    width:100%; background:var(--bg-sunken); border:1px solid transparent; color:var(--text-900);
    border-radius:var(--r-sm); padding:9px 32px; font-size:13.5px;
    transition:border-color .15s var(--ease), background-color .15s var(--ease);
  }
  .search-field input::placeholder{color:var(--text-400);}
  .search-field input:focus{outline:none; background:var(--surface); border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}
  .search-clear{
    position:absolute; right:6px; width:22px; height:22px; border-radius:50%; border:none; padding:0;
    background:var(--bg-sunken-2); color:var(--text-500); display:flex; align-items:center; justify-content:center;
  }
  .search-clear .icon{width:12px; height:12px;}
  .search-clear.hidden{display:none;}

  .sort-select{
    flex:1; min-width:0; background:var(--bg-sunken); border:1px solid transparent; color:var(--text-700);
    border-radius:var(--r-sm); padding:9px 30px 9px 12px; font-size:12.5px; font-weight:600;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B8177' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 8px center; background-size:14px;
  }
  .sort-select:focus{outline:none; border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}

  .density-toggle{display:flex; gap:2px; background:var(--bg-sunken); border-radius:var(--r-sm); padding:2px; flex:0 0 auto;}
  .density-btn{width:30px; height:30px; border-radius:6px; border:none; background:transparent; color:var(--text-500); display:flex; align-items:center; justify-content:center;}
  .density-btn .icon{width:16px; height:16px;}
  .density-btn.active{background:var(--surface); color:var(--accent-500); box-shadow:var(--shadow-sm);}

  .file-grid.compact .file-card{padding:8px 10px; gap:10px;}
  .file-grid.compact .file-card .doc-icon{width:30px; height:30px;}
  .file-grid.compact .file-card .doc-icon .icon{width:15px; height:15px;}
  .file-grid.compact .file-card .name{font-size:13.5px;}
  .file-grid.compact .file-card .meta{margin-top:2px;}
  .file-grid.compact .file-card .progress-bar{margin-top:6px; height:3px;}
  /* below the desktop breakpoint (960px+) that turns "compact" into an
     actual multi-column grid, the two density modes only differed by a
     few px of padding — barely visible. Give compact a genuinely
     different shape here too: a flat divided list instead of bordered
     cards, so switching modes reads as a real change on phones/tablets. */
  @media (max-width:959px){
    .file-grid.compact{gap:0;}
    .file-grid.compact .file-card{
      border-radius:0; border:none; border-bottom:1px solid var(--line);
      box-shadow:none; padding:10px 4px;
    }
    .file-grid.compact .file-card:last-child{border-bottom:none;}
  }
  @media (max-width:959px) and (hover:hover) and (pointer:fine){
    .file-grid.compact .file-card:hover{transform:none; box-shadow:none;}
  }

  .lib-body{flex:1; display:flex; flex-direction:column; min-height:0; position:relative;}

  .folder-rail{
    flex:0 0 auto; display:flex; flex-direction:column; gap:10px;
    padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  #railDynamic{display:flex; flex-direction:column; gap:10px; min-width:0;}
  /* account control lives in the top bar as a small icon/avatar next to the
     other header actions, not as a full row competing with folder chips for
     space — full name/sync-state text only appears in the popup on tap. */
  .lib-account{position:relative; flex:0 0 auto;}
  .account-signin-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    background:var(--bg-sunken); border:1px solid var(--line-strong); color:var(--text-700);
    border-radius:50%; transition:background-color .15s var(--ease), border-color .15s var(--ease);
  }
  @media (hover:hover) and (pointer:fine){ .account-signin-btn:hover{background:var(--bg-sunken-2); border-color:var(--text-400);} }
  .account-signin-btn .icon{width:17px; height:17px;}
  .account-error-dot{position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:2px solid var(--surface);}
  .account-avatar-wrap{position:relative; display:block; width:36px; height:36px; border-radius:50%; border:none; background:none; padding:0;}
  .account-avatar{width:36px; height:36px; border-radius:50%; display:block; background:var(--bg-sunken-2); object-fit:cover;}
  .account-sync-dot{position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:var(--text-400); border:2px solid var(--surface);}
  .account-sync-dot.synced{background:#67a782;}
  .account-sync-dot.syncing{background:var(--accent-400); animation:sync-pulse 1s ease-in-out infinite;}
  .account-sync-dot.error{background:var(--danger);}
  .account-sync-dot.offline{background:var(--text-400);}
  @keyframes sync-pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .menu-account-id{font-size:11.5px; color:var(--text-500); padding:6px 10px 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-sync-line{font-size:11px; color:var(--text-400); padding:0 10px 8px; border-bottom:1px solid var(--line); margin-bottom:2px; line-height:1.4;}
  .menu-sync-line.error{color:var(--danger);}
  .rail-row{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; white-space:nowrap; -webkit-overflow-scrolling:touch;}
  .rail-crumbs{display:flex; align-items:center; gap:3px; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch;}
  .crumb-item{background:none; border:none; padding:3px 3px; font-size:12px; font-weight:600; color:var(--text-500); border-radius:6px; flex:0 0 auto; transition:color .15s var(--ease);}
  .crumb-item.active{color:var(--text-900);}
  .crumb-sep{color:var(--text-400); font-size:11px; flex:0 0 auto;}
  @media (hover:hover) and (pointer:fine){ .crumb-item:not(.active):hover{color:var(--text-700);} }
  .crumb-kebab-btn{
    width:22px; height:22px; border-radius:6px; border:none; background:transparent; color:var(--text-400);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-left:1px;
  }
  .crumb-kebab-btn .icon{width:14px; height:14px;}
  .crumb-kebab-btn:active{background:var(--bg-sunken-2); color:var(--text-700);}
  @media (hover:hover) and (pointer:fine){ .crumb-kebab-btn:hover{background:var(--bg-sunken-2); color:var(--text-700);} }

  .folder-chip{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--bg-sunken); border:1px solid transparent; color:var(--text-500);
    border-radius:var(--r-sm); padding:8px 14px; font-size:13px; font-weight:600; flex:0 0 auto;
    transition:background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
  }
  .folder-chip .count{color:var(--text-400); font-weight:500; font-variant-numeric:tabular-nums;}
  .folder-chip.active{background:var(--accent-400); border-color:var(--accent-400); color:#fffaf6;}
  .folder-chip.active .count{color:rgba(255,250,246,.7);}
  .folder-chip.new{color:var(--accent-500); background:transparent; border-style:dashed; border-color:var(--line-strong);}
  @media (hover:hover) and (pointer:fine){
    .folder-chip:not(.active):hover{border-color:var(--line-strong); color:var(--text-900); background:var(--bg-sunken-2);}
  }
  .folder-chip.drag-over{border-color:var(--accent-400); background:var(--accent-wash); color:var(--accent-500);}

  /* folder tree (tablet/desktop rail) — see renderFolderTree() */
  .folder-tree{display:flex; flex-direction:column; gap:1px; margin-top:2px;}
  .tree-item{
    display:flex; align-items:center; gap:6px; width:100%; text-align:left; cursor:pointer;
    padding:7px 8px; padding-left:calc(8px + var(--depth, 0) * 14px);
    border-radius:var(--r-sm); border:1px solid transparent; background:transparent;
    color:var(--text-700); font-size:13px; transition:background-color .15s var(--ease), border-color .15s var(--ease);
  }
  .tree-item .count{margin-left:auto; padding-left:4px; color:var(--text-400); font-size:11px; font-variant-numeric:tabular-nums; flex:0 0 auto;}
  .tree-item.active{background:var(--accent-wash); color:var(--accent-500); font-weight:600;}
  .tree-item.drag-over{border-color:var(--accent-400); background:var(--accent-wash);}
  @media (hover:hover) and (pointer:fine){ .tree-item:not(.active):hover{background:var(--bg-sunken);} }
  .tree-kebab-btn{
    width:22px; height:22px; border-radius:6px; border:none; background:transparent; color:var(--text-400);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; margin-left:2px;
  }
  .tree-kebab-btn .icon{width:14px; height:14px;}
  .tree-kebab-btn:active{background:var(--bg-sunken-2); color:var(--text-700);}
  @media (hover:hover) and (pointer:fine){ .tree-kebab-btn:hover{background:var(--bg-sunken-2); color:var(--text-700);} }
  .tree-caret{width:16px; height:16px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--text-400); transition:transform .15s var(--ease);}
  .tree-caret.empty{visibility:hidden;}
  .tree-caret.open{transform:rotate(90deg);}
  .tree-caret .icon{width:13px; height:13px;}
  .tree-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .lib-main{flex:1; overflow-y:auto; padding:var(--sp-4) var(--sp-4) 100px;}

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:70px 20px; color:var(--text-500); gap:var(--sp-2); max-width:340px; margin:0 auto;
  }
  .empty-state .icon-lg{width:38px; height:38px; color:var(--line-strong); margin-bottom:8px;}
  .empty-state strong{color:var(--text-900); font-size:15px; font-weight:600; letter-spacing:-.01em;}
  .empty-state span{font-size:13px; line-height:1.55; color:var(--text-500);}
  .empty-state--sub{padding:36px 20px; color:var(--text-400); font-size:13px; max-width:280px;}

  .file-grid{display:flex; flex-direction:column; gap:var(--sp-3);}

  .file-card{
    display:flex; align-items:center; gap:var(--sp-3);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--sp-3); position:relative; box-shadow:var(--shadow-sm);
    transition:border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  @media (hover:hover) and (pointer:fine){
    .file-card:hover{border-color:var(--line-strong); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  }
  .file-card .doc-icon{
    width:38px; height:38px; border-radius:var(--r-sm); background:var(--bg-sunken); color:var(--accent-500);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; border:1px solid var(--line);
  }
  .file-card .info{flex:1; min-width:0;}
  .file-card .name{font-size:14.5px; font-weight:600; color:var(--text-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.005em;}
  .file-card .meta{font-size:12px; color:var(--text-500); margin-top:4px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .file-card .meta .tag{background:var(--bg-sunken); color:var(--text-500); padding:2.5px 9px; border-radius:999px; font-size:10.5px; font-weight:600; letter-spacing:.01em;}
  .file-card .meta .dot{width:3px; height:3px; border-radius:50%; background:var(--text-400); flex:0 0 auto;}
  .file-card .progress-bar{height:4px; border-radius:99px; background:var(--bg-sunken); margin-top:10px; overflow:hidden;}
  .file-card .progress-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--accent-500), var(--accent-300)); border-radius:99px;}
  .file-card .more-btn{
    width:32px; height:32px; border-radius:var(--r-sm); background:transparent; border:none; color:var(--text-500);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:background-color .15s var(--ease), color .15s var(--ease);
  }
  .file-card .more-btn:active{background:var(--bg-sunken);}

  .read-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--read-bg, var(--bg-app)); scroll-behavior:smooth;}
  .read-inner{
    position:relative; max-width:min(680px, 92vw); margin:0 auto; padding:44px 6px 96px;
    font-family:var(--read-font); font-size:var(--read-size); line-height:var(--read-line); color:var(--read-text, #1d1e21);

  /* code keeps its own horizontal scroll box instead of wrapping mid-token */
  .read-inner pre{overflow-wrap:normal;}
  .read-inner h1,.read-inner h2,.read-inner h3{font-weight:700; line-height:1.35; margin:1.4em 0 .6em; color:inherit; letter-spacing:-.01em;}
  .read-inner h1{font-size:1.55em; border-bottom:1px solid currentColor; padding-bottom:.35em; opacity:1;}
  .read-inner h2{font-size:1.28em;}

  .read-inner li{margin-bottom:.4em;}
  .read-inner blockquote{margin:0 0 1.1em; padding:.5em 1.1em; border-left:3px solid var(--accent-500); background:rgba(201,122,69,0.08); font-style:italic; border-radius:0 6px 6px 0;}
  .read-inner code{font-family:'SFMono-Regular',Consolas,monospace; font-size:.85em; background:rgba(0,0,0,0.06); padding:.15em .4em; border-radius:5px;}
  .read-inner pre{background:rgba(0,0,0,0.06); padding:16px; border-radius:var(--r-md); overflow-x:auto; margin:0 0 1.2em;}
  .read-inner pre code{background:none; padding:0;}
  .read-inner img{max-width:100%; border-radius:var(--r-sm); display:block; margin:1em auto;}
  /* a diagram squeezed into a 380px column is unreadable on a phone, and the
     page itself cannot be pinched while the app owns the whole viewport */
  @media (hover:hover) and (pointer:fine){ .read-inner img{cursor:zoom-in;} }
  .img-zoom{
    position:fixed; inset:0; z-index:70; background:rgba(18,16,15,.95);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    touch-action:none; opacity:0; transition:opacity .18s var(--ease);
  }
  .img-zoom.show{opacity:1;}
  .img-zoom img{
    max-width:100%; max-height:100%; transform-origin:0 0; will-change:transform;
    user-select:none; -webkit-user-drag:none; display:block;
  }
  .img-zoom-close{
    position:absolute; top:calc(8px + env(safe-area-inset-top)); right:8px;
    width:40px; height:40px; border-radius:50%; border:none; color:#fff;
    background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center;
  }
  .img-zoom-close .icon{width:19px; height:19px;}
  .img-zoom-hint{
    position:absolute; left:0; right:0; bottom:calc(12px + env(safe-area-inset-bottom));
    text-align:center; color:rgba(255,255,255,.5); font-size:11.5px; pointer-events:none;
  }
  /* A table wide enough to exceed the column scrolls inside its own box,
     the way pre and .katex-display already do. Without this the table
     dragged the whole reading pane sideways — headings, paragraphs and all
     — and that drag was also what the page-turn swipe was reading. */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; margin:0 0 1.2em;}
  /* width:max-content rather than 100%: at 100% a table with more columns
     than fit does not overflow, it *compresses*, wrapping every cell down to
     roughly one character per line — which is unreadable and gives the
     reader nothing to scroll. Sizing to content lets it stay legible and
     spill into the scroll box above, while min-width keeps a narrow table
     stretched across the column exactly as before. */
  .read-inner table{border-collapse:collapse; width:max-content; min-width:100%; margin:0; font-size:.92em;}
  .read-inner th,.read-inner td{border:1px solid rgba(0,0,0,0.15); padding:8px 10px; text-align:left;}
  .read-inner hr{border:none; border-top:1px solid rgba(0,0,0,0.15); margin:2em 0;}
  .read-inner a{color:var(--accent-500);}

  /* GFM task lists: marked doesn't add a task-list-item class, so target the
     structural shape (li whose first child is the checkbox) directly and
     drop the bullet that would otherwise sit next to it */
  .read-inner li:has(> input[type="checkbox"]:first-child){list-style:none; margin-left:-1.4em;}
  .read-inner input[type="checkbox"]{width:15px; height:15px; margin-right:7px; accent-color:var(--accent-400); vertical-align:-2px;}

  /* math (KaTeX) */
  .read-inner .katex-display{overflow-x:auto; overflow-y:hidden; padding:.3em 0; margin:0 0 1.2em;}
  .read-inner .katex{font-size:1.05em;}

  /* code syntax highlighting (highlight.js), tuned to the app palette */
  .read-inner pre code.hljs{display:block; overflow-x:auto; background:none; padding:0;}
  .hljs-comment,.hljs-quote{color:var(--text-500); font-style:italic;}
  .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-subst{color:var(--accent-500); font-weight:600;}
  .hljs-string,.hljs-doctag,.hljs-regexp{color:#3b7a57;}
  .hljs-number,.hljs-symbol{color:#7c8fa6;}
  .hljs-title,.hljs-title.function_,.hljs-section,.hljs-selector-id{color:#8b5fbf; font-weight:600;}
  .hljs-type,.hljs-class .hljs-title,.hljs-built_in{color:#b4574e;}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#a85f30;}
  .hljs-tag{color:var(--text-500);}
  .hljs-name{color:var(--accent-500);}
  .hljs-meta{color:var(--text-400);}
  .hljs-deletion{background:rgba(219,124,114,.15);}
  .hljs-addition{background:rgba(143,203,138,.18);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}
  [data-theme="night"] .hljs-comment,[data-theme="night"] .hljs-quote{color:#8b93a1;}
  [data-theme="night"] .hljs-keyword,[data-theme="night"] .hljs-selector-tag,[data-theme="night"] .hljs-literal{color:var(--accent-300);}
  [data-theme="night"] .hljs-string,[data-theme="night"] .hljs-doctag{color:#8fcb8a;}
  [data-theme="night"] .hljs-number{color:#8fb6e3;}
  [data-theme="night"] .hljs-title,[data-theme="night"] .hljs-title.function_{color:#c9a3e8;}
  [data-theme="night"] .hljs-type,[data-theme="night"] .hljs-built_in{color:#ee9dbb;}

  .ink-canvas{position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; z-index:5;}

  .editor-body{flex:1; min-height:0; display:flex; position:relative;}
  .editor-body.drag-over::after{
    content:"이미지를 여기에 놓으면 첨부됩니다"; position:absolute; inset:8px; z-index:10;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
    border:2px dashed var(--accent-400); border-radius:var(--r-lg); background:rgba(212,133,74,0.08);
    color:var(--accent-500); font-size:14px; font-weight:600; pointer-events:none;
  }
  .editor-textarea{
    flex:1; width:100%; height:100%; border:none; resize:none; background:var(--bg-app); color:var(--text-900);
    padding:24px; font-family:'SFMono-Regular',Consolas,monospace; font-size:14px; line-height:1.7;
  }
  .editor-textarea:focus{outline:none;}
  .editor-textarea::placeholder{color:var(--text-400);}
  #editorPreviewScroll{flex:1; height:100%;}
  .editor-split-handle{display:none;}
  /* desktop: room for source and rendered preview side by side, updating
     live as you type, instead of a toggle between the two — see
     isEditorSplitView()/applyEditorPreviewState(). The handle between them
     is draggable to change the split ratio (setupEditorSplitDrag). */
  @media (min-width:960px){
    #editorPreviewBtn{display:none;}
    .editor-split-handle{
      display:block; width:9px; margin:0 -4px; flex:0 0 auto; cursor:col-resize;
      position:relative; z-index:2; background:transparent;
    }
    .editor-split-handle::before{
      content:""; position:absolute; left:4px; top:0; bottom:0; width:1px; background:var(--line);
    }
    .editor-split-handle:hover::before, .editor-split-handle.dragging::before{
      background:var(--accent-400); width:2px; left:3.5px;
    }
  }

  /* tablet / desktop: two-column library */
  @media (min-width:720px){
    .lib-body{flex-direction:row;}
    .folder-rail{
      flex-direction:column; width:240px; border-bottom:none; border-right:1px solid var(--line);
      padding:20px 14px; gap:14px;
    }
    .rail-row{flex-direction:column; overflow-x:visible; white-space:normal;}
    .rail-crumbs{flex-wrap:wrap; overflow-x:visible; white-space:normal;}
    .folder-chip{justify-content:flex-start; border-radius:var(--r-sm);}
    .lib-main{padding:26px 34px 100px;}
    .lib-search-bar{flex-direction:row; align-items:center; padding:12px 20px;}
    .search-row{flex:1;}
    .controls-row{flex:0 0 auto;}
    .sort-select{flex:0 0 auto;}

    /* tablet/desktop library cards get a little more breathing room */
    .file-card{padding:16px;}
    .file-card .doc-icon{width:42px; height:42px; border-radius:var(--r-md);}
    .file-card .name{font-size:15.5px;}

    /* reader: TOC becomes a persistent, collapsible side panel instead of a
       full-screen overlay drawer — width animates so opening/closing reads
       as a natural slide rather than a snap. drawer-inner keeps a fixed
       width so its content doesn't reflow mid-transition, just reveals. */
    .drawer{
      position:relative; top:auto; left:auto; height:auto; width:0;
      transform:none; flex:0 0 auto; box-shadow:none;
      transition:width .32s var(--ease);
    }
    .drawer.show{width:300px;}
    .drawer-inner{width:300px;}
    /* mouse-draggable divider on the panel's own right edge — laptops have
       no swipe gesture, so dragging this line is the equivalent of the
       touch drag on phones/tablets. Only shown once the panel is actually
       open (width:300px); while closed the drawer's overflow:hidden clips
       it anyway, and reopening happens via the toc button instead. */
    .drawer-resize-handle{
      display:block; position:absolute; top:0; right:0; bottom:0; width:8px;
      cursor:col-resize; z-index:2; background:transparent;
      transition:background-color .15s var(--ease);
    }
    .drawer-resize-handle:hover, .drawer-resize-handle.dragging{ background:var(--accent-wash); }

    /* settings/ink toolbars sit at the top of the reading column (not the
       whole screen) now that the TOC can occupy the left edge, and get
       roomier touch targets for stylus/finger use */
    .read-inner{padding-top:52px; max-width:min(720px, 88vw);}
    .pop{width:288px; padding:22px;}
    .ink-row{gap:12px;}
    .ink-swatch{width:38px; height:38px;}
    .ink-swatch.ink-highlighter{width:46px; height:28px;}
    .ink-size-btn{height:40px;}
    .font-row button{width:38px; height:38px;}
    .theme-swatch{height:52px;}
  }
  @media (min-width:960px){
    .lib-main{padding:28px 40px 100px;}
    .file-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:var(--sp-3);}
    .file-grid.compact{grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));}
  }

  /* ============ phone chrome ============
     Both top bars were carrying the same hit-target sizes as the desktop
     layout, which at phone width reads as oversized next to 13px labels and
     eats height from the content. Trim the chrome — icons, padding, the
     avatar — while leaving the reading column and every label alone. This
     block sits last on purpose: the sizes it overrides are declared further
     up, and a media query adds no specificity of its own. */
  @media (max-width:719px){
    .lib-topbar{gap:6px; padding:11px var(--sp-3); padding-top:calc(11px + env(safe-area-inset-top));}
    .btn{font-size:12.5px; padding:9px 12px; gap:5px;}
    .btn .icon{width:16px; height:16px;}
    .btn-ghost{padding:8px;}
    .account-signin-btn, .account-avatar-wrap, .account-avatar{width:32px; height:32px;}
    .account-signin-btn .icon{width:15px; height:15px;}
    .account-sync-dot, .account-error-dot{width:9px; height:9px; border-width:1.5px;}

    .topbar{gap:1px; padding:5px 6px; padding-top:calc(5px + env(safe-area-inset-top));}
    .icon-btn{width:34px; height:34px;}
    .icon-btn .icon{width:18px; height:18px;}
    .topbar .title{font-size:13px;}
    .topbar .aa-btn{font-size:13px;}
    .topbar .progress-pct{font-size:11.5px; width:32px;}
  }
</style>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------------- storage: IndexedDB-backed key/value store ----------------
     Keeps the same logical shape as before (folder metadata, file metadata
     with reading progress, and raw file-content text keyed by id) so the rest
     of the app can keep calling S.getJSON/setJSON/getText/setText/del. */
  const DB_NAME = "seojae-db";
  const DB_VERSION = 1;
  const STORE = "kv";
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = ()=>{
        if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  function idbGet(key){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }));
  }
  function idbSet(key, value){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    }));
  }
  function idbDel(key){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    }));
  }

  // Every write swallowed its error, so a full quota — very reachable once
  // books carry images — or storage blocked in a private window produced an
  // upload or an edit that looked saved and was simply gone on the next
  // reload. Say it once, plainly, rather than never.
  let storageWarned = false;
  function storageFailed(e){
    console.warn("storage write failed", e);
    if(storageWarned) return;
    storageWarned = true;
    const name = (e && e.name) || "";
    const full = name === "QuotaExceededError" || /quota|exceed/i.test(String((e && e.message) || ""));
    toast(full ? "기기 저장 공간이 가득 차서 저장하지 못했어요"
               : "이 브라우저에는 저장할 수 없어요 (시크릿 모드인지 확인해주세요)");
  }

  const S = {
    async getJSON(key, fallback){
      try{ const v = await idbGet(key); return v===undefined ? fallback : v; }catch(e){ return fallback; }
    },
    async setJSON(key, val){ try{ await idbSet(key, val); }catch(e){ storageFailed(e); } },
    async getText(key){

  /* ---- oversized payloads: split one string across numbered documents ----
     The base doc holds part 0 plus the part count; parts 1..n-1 live at
     "{id}__{n}". Tail parts are written before the base doc, so a reader
     trusting the base doc's count never chases a part that isn't there. */
  const CHUNK_BYTES = 700000; // well under Firestore's 1 MiB document ceiling
  const utf8Len = (s)=> new TextEncoder().encode(s).length;
  const lastChunkCount = new Map(); // "coll/id" -> parts written, to spot a shrink

  function splitForFirestore(str){
    const total = utf8Len(str);
    if(total <= CHUNK_BYTES) return [str];
    // bytes-per-char is uniform enough within a single payload to size the
    // slices from the measured ratio; the surrogate check keeps a slice
    // from cutting an emoji or CJK-extension pair in half.
    const perChunk = Math.max(2, Math.floor(str.length * CHUNK_BYTES / total));
    const parts = [];
    let i = 0;
    while(i < str.length){
      let end = Math.min(str.length, i + perChunk);
      if(end < str.length){
        const code = str.charCodeAt(end-1);
        if(code >= 0xD800 && code <= 0xDBFF) end--;
      }
      if(end <= i) end = Math.min(str.length, i + perChunk);
      parts.push(str.slice(i, end));
      i = end;
    }
    return parts;
  }

  async function writeChunked(uid, coll, id, payload, meta){
    const { doc, setDoc, deleteDoc } = fb.fsMod;
    const parts = splitForFirestore(payload);
    for(let i=1;i<parts.length;i++){
      await setDoc(doc(fb.db, "users", uid, coll, id+"__"+i), { c: parts[i] });
    }
    await setDoc(doc(fb.db, "users", uid, coll, id), Object.assign({ c: parts[0], chunks: parts.length }, meta||{}));
    // A payload that shrank leaves orphaned tail parts behind. They are
    // never read again (the base doc's count bounds the read), so this is
    // housekeeping, not correctness — only worth spending writes on when we
    // know the document really did have more parts before.
    const key = coll+"/"+id;
    const prev = lastChunkCount.get(key) || 0;
    for(let i=parts.length;i<prev;i++){
      try{ await deleteDoc(doc(fb.db, "users", uid, coll, id+"__"+i)); }catch(e){}
    }
    lastChunkCount.set(key, parts.length);
  }

  }

  /* ---- ink wire format ----
     Firestore rejects an array nested directly inside another array, and an
     ink stroke's point list is exactly that: [[x,y],[x,y],...]. That single
     incompatibility used to abort the whole sync — including the library
     document write — for anyone who had ever written a note, which is why
     nothing synced at all. Strokes now travel as one compact JSON string
     with coordinates flattened and rounded to 4 decimals (sub-pixel at any
     realistic page width), which also roughly halves the payload. */
  function encodeStrokes(strokes){
    return JSON.stringify((strokes||[]).map(s=>{
      const p = [];
      for(const pt of (s.points||[])) p.push(Math.round(pt[0]*1e4)/1e4, Math.round(pt[1]*1e4)/1e4);
      const out = { t:s.tool, c:s.color, w:s.width, p };
      if(s.block != null) out.b = s.block;
      return out;
    }));

  function decodeStrokes(str){
    let raw;

    if(!Array.isArray(raw)) return [];
    return raw.map(s=>{
      const pts = [];
      const flat = s.p || [];
      for(let i=0;i+1<flat.length;i+=2) pts.push([flat[i], flat[i+1]]);
      const st = { tool:s.t, color:s.c, width:s.w, points:pts };
      if(s.b != null) st.block = s.b;
      return st;
    });

      $("signOutBtn").addEventListener("click", async ()=>{ closeAllOverlays(); await signOutOfCloud(); });
    });
  }

  /* ---- scheduling ------------------------------------------------------ */
  // Local edits settle briefly before being pushed, so a burst of typing or
  // a multi-file drop becomes one sync rather than a dozen.
  function scheduleSync(delay){
    if(!fb || !fb.currentUser) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(syncNow, delay || 1500);
  }
  function scheduleRetry(){
    clearTimeout(syncRetryTimer);
    syncRetryDelay = Math.min(syncRetryDelay ? syncRetryDelay * 2 : 5000, 300000);
    syncRetryTimer = setTimeout(syncNow, syncRetryDelay);
  }

  // Live listener on the library document: an upload or edit on another
  // device lands here in about a second instead of waiting out the
  // five-minute poll. Our own writes echo back through the same callback,
  // hence both the pending-writes check and the updatedAt guard.
  function watchCloud(uid){
    stopWatchingCloud();
    try{
      const { doc, onSnapshot } = fb.fsMod;
      unsubLibrary = onSnapshot(doc(fb.db, "users", uid, "library", "main"), (snap)=>{
        if(snap.metadata.hasPendingWrites) return;
        const at = (snap.data() || {}).updatedAt || 0;
        if(at && at === lastPublishedAt) return;
        scheduleSync(400);
      }, (e)=> authDebug("실시간 구독 오류: "+e));
    }catch(e){ authDebug("실시간 구독 실패: "+e); }
  }
  function stopWatchingCloud(){
    if(unsubLibrary){ try{ unsubLibrary(); }catch(e){} unsubLibrary = null; }
  }

  /* ---- per-file payload transfer -------------------------------------- */
  async function pushContentToCloud(uid, f){
    const text = await S.getText("file-content:"+f.id);
    if(text != null) await writeChunked(uid, "content", f.id, text, { updatedAt: fileContentTs(f) });
    // images live in their own IndexedDB entry and used to be left out of
    // sync entirely, so every illustrated book arrived on the second device
    // with its pictures broken
    const assets = await S.getJSON("assets:"+f.id, null);
    if(assets && Object.keys(assets).length){
      await writeChunked(uid, "assets", f.id, JSON.stringify(assets), { updatedAt: fileContentTs(f) });
    }
  }
  async function pullContentFromCloud(uid, f){
    const got = await readChunked(uid, "content", f.id);
    if(!got || got.text == null) throw new Error("본문 없음");
    await S.setText("file-content:"+f.id, got.text);
    // a file may legitimately have no images, so a missing assets doc is
    // not a failure
    const gotAssets = await readChunked(uid, "assets", f.id);
    if(gotAssets && gotAssets.text != null){
      try{ await S.setJSON("assets:"+f.id, JSON.parse(gotAssets.text)); }catch(e){}
    }
  }
  async function pushInkToCloud(uid, f, idx, ts){
    const strokes = await S.getJSON("ink:"+f.id+":"+idx, []);
    await writeChunked(uid, "ink", f.id+"_"+idx, encodeStrokes(strokes), { updatedAt: ts });
  }
  async function pullInkFromCloud(uid, f, idx){
    const got = await readChunked(uid, "ink", f.id+"_"+idx);
    if(!got || got.text == null) throw new Error("필기 없음");
    const strokes = decodeStrokes(got.text);
    await S.setJSON("ink:"+f.id+":"+idx, strokes);
    return strokes.length;
  }

  async function deleteFileFromCloud(uid, f){
    const { doc, getDoc, setDoc } = fb.fsMod;
    try{
      await deleteChunked(uid, "content", f.id);
      await deleteChunked(uid, "assets", f.id);
      const chapters = new Set([...(f.inkChapters||[]), ...Object.keys(inkTsMap(f)).map(Number)]);
      for(const idx of chapters) await deleteChunked(uid, "ink", f.id+"_"+idx);
      const delRef = doc(fb.db, "users", uid, "library", "deleted");
      const snap = await getDoc(delRef);
      const data = snap.exists() ? snap.data() : {};
      const ids = data.ids || {};
      ids[f.id] = { ts: f.updatedTs || Date.now(), at: Date.now() };
      await setDoc(delRef, Object.assign({}, data, { ids }));
    }catch(e){ console.warn("cloud delete failed", e); }
  }
  // Folders used to merge as a plain union, so a folder deleted on one
  // device came straight back from the other, and a rename never travelled
  // at all. They now carry updatedTs and their own tombstones.
  async function deleteFoldersFromCloud(uid, deleted){
    const { doc, getDoc, setDoc } = fb.fsMod;
    try{
      const delRef = doc(fb.db, "users", uid, "library", "deleted");
      const snap = await getDoc(delRef);
      const data = snap.exists() ? snap.data() : {};
      const folderTombs = data.folders || {};
      for(const fo of deleted) folderTombs[fo.id] = { ts: fo.updatedTs || Date.now(), at: Date.now() };
      await setDoc(delRef, Object.assign({}, data, { folders: folderTombs }));
    }catch(e){ console.warn("cloud folder delete failed", e); }
  }

  /* ---- the sync itself ------------------------------------------------- */
  async function syncNow(){
    if(!fb || !fb.currentUser) return;
    if(syncInFlight){ syncQueued = true; return; }
    if(!navigator.onLine){ setSyncStatus("offline"); return; }
    syncInFlight = true;
    clearTimeout(syncRetryTimer);
    setSyncStatus("syncing");
    const uid = fb.currentUser.uid;
    const openFileId = activeFile ? activeFile.id : null;
    let openContentChanged = false;
    let failures = 0;
    let firstFailure = null;
    try{
      const { doc, getDoc, setDoc } = fb.fsMod;
      const revAtStart = libraryRev;
      const libRef = doc(fb.db, "users", uid, "library", "main");

      const [libSnap, delSnap] = await Promise.all([
        getDoc(libRef),
        getDoc(doc(fb.db, "users", uid, "library", "deleted")),
      ]);
      const cloud = libSnap.exists() ? libSnap.data() : {};
      const cloudFiles = cloud.files || [];
      const cloudFolders = cloud.folders || [];
      const delData = delSnap.exists() ? delSnap.data() : {};
      const fileTombs = delData.ids || {};
      const folderTombs = delData.folders || {};

      // ---- folders: newer updatedTs wins, tombstones suppress ----
      const folderMap = new Map();
      folders.forEach(fo=> folderMap.set(fo.id, fo));
      cloudFolders.forEach(c=>{
        const l = folderMap.get(c.id);
        if(!l) folderMap.set(c.id, Object.assign({}, c));
        else if((c.updatedTs||0) > (l.updatedTs||0)) Object.assign(l, c); // in place: keeps references live
      });
      const mergedFolders = Array.from(folderMap.values())
        .filter(fo=> !pendingFolderDeletes.has(fo.id) && !tombstoned(folderTombs[fo.id], fo.updatedTs||0));

      // ---- files ----
      const localById = new Map(files.map(f=>[f.id, f]));
      const cloudById = new Map(cloudFiles.map(f=>[f.id, f]));
      const allIds = new Set([...localById.keys(), ...cloudById.keys()]);

      const pullContent = [], pushContent = [], pullInk = [], pushInk = [];
      const cloudContentTs = {};  // id -> newest body timestamp the cloud holds
      const cloudInkTs = {};      // id -> { chapterIdx: newest ink timestamp the cloud holds }
      const mergedFiles = [];
      const purged = [];

      for(const id of allIds){
        const l = localById.get(id), c = cloudById.get(id);
        // read every clock off both sides *before* merging, since merging
        // overwrites the local record's fields in place
        const lContent = l ? fileContentTs(l) : 0;
        const cContent = c ? fileContentTs(c) : 0;
        const lInk = l ? inkTsMap(l) : {};
        const cInk = c ? inkTsMap(c) : {};

        // Merge into the existing local object whenever there is one, so a
        // book open in the reader (activeFile) keeps pointing at a record
        // that is still part of `files` — replacing the array with fresh
        // cloud objects orphaned it, and every later progress or ink save
        // on that orphan was silently dropped.
        let rec;
        if(l && c){
          if((c.updatedTs||0) > (l.updatedTs||0)) Object.assign(l, c);
          rec = l;
        } else rec = l || Object.assign({}, c);

        if(pendingDeletes.has(id)) continue; // local copy is already gone
        if(tombstoned(fileTombs[id], rec.updatedTs||0)){ purged.push(rec); continue; }

        // content and ink each resolve on their own clock, so reading a
        // book on one device (which bumps updatedTs) cannot roll back an
        // unsynced edit made on another
        rec.contentTs = lContent;
        if(cContent > lContent) pullContent.push({ rec, ts: cContent });
        else if(lContent > cContent) pushContent.push({ rec, ts: lContent });
        cloudContentTs[id] = cContent;

        const chapters = new Set([...Object.keys(lInk), ...Object.keys(cInk)]);
        const localInk = {}, cloudInk = {};
        for(const k of chapters){
          const lt = lInk[k]||0, ct = cInk[k]||0;
          localInk[k] = lt;
          cloudInk[k] = ct;
          if(ct > lt) pullInk.push({ rec, idx:+k, ts:ct });
          else if(lt > ct) pushInk.push({ rec, idx:+k, ts:lt });
        }
        rec.inkTs = localInk;
        cloudInkTs[id] = cloudInk;

        mergedFiles.push(rec);
      }

      // Adopted before the first await below: from here on a file created
      // mid-sync is pushed straight into the array this sync writes back,
      // instead of into one that is about to be replaced.
      folders = mergedFolders;
      files = mergedFiles;

      // the merge can leave cycles and orphans behind — see reconcileFolderTree
      reconcileFolderTree();

      for(const f of purged){
        await S.del("file-content:"+f.id);
        await S.del("assets:"+f.id);
        for(const idx of Object.keys(inkTsMap(f))) await S.del("ink:"+f.id+":"+idx);
      }

      // Every transfer is isolated. One book too large for a document, or a
      // blip on a single request, must not take the rest of the sync down
      // with it — least of all the library write below, whose failure is
      // what used to make the entire library invisible on other devices.
      for(const job of pullContent){
        try{
          await pullContentFromCloud(uid, job.rec);
          job.rec.contentTs = job.ts;
          if(job.rec.id === openFileId) openContentChanged = true;
        }catch(e){ failures++; firstFailure = firstFailure || e; console.warn("content pull failed", job.rec.id, e); }
      }
      for(const job of pushContent){
        try{
          await pushContentToCloud(uid, job.rec);
          cloudContentTs[job.rec.id] = job.ts;
        }catch(e){ failures++; firstFailure = firstFailure || e; console.warn("content push failed", job.rec.id, e); }
      }
      for(const job of pullInk){
        try{
          const n = await pullInkFromCloud(uid, job.rec, job.idx);
          job.rec.inkTs[job.idx] = job.ts;
          const set = new Set(job.rec.inkChapters || []);
          if(n > 0) set.add(job.idx); else set.delete(job.idx);
          job.rec.inkChapters = Array.from(set).sort((a,b)=>a-b);
        }catch(e){ failures++; firstFailure = firstFailure || e; console.warn("ink pull failed", job.rec.id, job.idx, e); }
      }
      for(const job of pushInk){
        try{
          await pushInkToCloud(uid, job.rec, job.idx, job.ts);
          if(cloudInkTs[job.rec.id]) cloudInkTs[job.rec.id][job.idx] = job.ts;
        }catch(e){ failures++; firstFailure = firstFailure || e; console.warn("ink push failed", job.rec.id, job.idx, e); }
      }

      // `files` *is* mergedFiles, so anything created while the transfers
      // ran is already in the payload — but its body has not been uploaded,
      // so a follow-up pass is still owed.
      if(libraryRev !== revAtStart) syncQueued = true;

      await S.setJSON("app:folders", folders);
      await S.setJSON("app:files", files);

      // The published record advertises what the *cloud* holds, which stays
      // newer than the local copy whenever a pull failed — publishing the
      // local timestamp there would tell every device the cloud had rolled
      // back, and the newer body would be lost.
      // A record that joined mid-sync has no cloud-side entry at all, so it
      // publishes 0 and the next pass sees local > cloud and uploads it.
      const payloadFiles = mergedFiles.map(f=> Object.assign({}, f, {
        contentTs: cloudContentTs[f.id] || 0,
        inkTs: cloudInkTs[f.id] || {},
      }));
      const payload = { folders: mergedFolders, files: payloadFiles };

      // Skip a no-op write. Besides saving quota on the periodic poll, this
      // is what keeps the live listener from ping-ponging: two devices that
      // already agree stop rewriting the document at each other.
      if(librarySig(mergedFolders, payloadFiles) !== librarySig(cloudFolders, cloudFiles)){
        lastPublishedAt = Date.now();
        await setDoc(libRef, Object.assign({}, payload, { updatedAt: lastPublishedAt }));
      }

      // prefs: last-writer-wins by timestamp
      const prefsRef = doc(fb.db, "users", uid, "prefs", "main");
      const prefsSnap = await getDoc(prefsRef);
      const cloudPrefs = prefsSnap.exists() ? prefsSnap.data() : null;
      if(cloudPrefs && (cloudPrefs.updatedTs||0) > prefsUpdatedTs){
        sortMode = cloudPrefs.sortMode || sortMode;
        density = cloudPrefs.density || density;
        customBg = cloudPrefs.customBg || customBg;
        customText = cloudPrefs.customText || customText;
        readLine = Number(cloudPrefs.readLine) || readLine;
        readFamily = cloudPrefs.readFamily === "sans" ? "sans" : (cloudPrefs.readFamily === "serif" ? "serif" : readFamily);
        prefsUpdatedTs = cloudPrefs.updatedTs;
        await S.setJSON("app:prefs", {sortMode, density, customBg, customText, readLine, readFamily, updatedTs: prefsUpdatedTs});
        sortSelect.value = sortMode;
        updateDensityButtons();
        applyReadStyle();
      } else if(!cloudPrefs || (cloudPrefs.updatedTs||0) < prefsUpdatedTs){
        await setDoc(prefsRef, {sortMode, density, customBg, customText, readLine, readFamily, updatedTs: prefsUpdatedTs});
      }

      // the reader holds a direct reference to its file; if the merge
      // dropped that record entirely, send the user back to the library
      // rather than leave a book open on a record that no longer exists
      if(activeFile){
        const still = files.find(x=> x.id === activeFile.id);
        if(still) activeFile = still;
        else if(!readerScreen.classList.contains("hidden")) $("backBtn").click();
      }

      renderAll();
      lastSyncTs = Date.now();
      syncRetryDelay = 0;
      setSyncStatus(failures ? "error" : "synced",
        failures ? (friendlySyncError(firstFailure) || (failures+"개 항목 실패")) + " (" + failures + "개)" : null);
      if(failures) scheduleRetry();

      // don't yank the page out from under someone mid-paragraph: offer the
      // refresh instead of forcing it
      if(openContentChanged && !readerScreen.classList.contains("hidden")){
        toast("이 책이 다른 기기에서 수정됐어요", "새로고침", ()=> openBook(openFileId));
      }
    }catch(e){
      console.warn("sync failed", e);
      setSyncStatus("error", friendlySyncError(e));
      scheduleRetry();
    }finally{
      syncInFlight = false;
      if(syncQueued){ syncQueued = false; scheduleSync(600); }
    }
  }

  function sortFiles(arr){
    const a = arr.slice();
    if(sortMode==="name") return a.sort((x,y)=> String(x.title||"").localeCompare(String(y.title||""), "ko"));
    if(sortMode==="added") return a.sort((x,y)=> (y.createdTs||y.updatedTs) - (x.createdTs||x.updatedTs));
    if(sortMode==="progress") return a.sort((x,y)=> (((y.progress&&y.progress.pct)||0)) - (((x.progress&&x.progress.pct)||0)));
    return a.sort((x,y)=> y.updatedTs - x.updatedTs); // 'recent'
  }

  function overlayIsNeeded(){
    return settingsPop.classList.contains("show")
      || (drawer.classList.contains("show") && !isTabletUp())
      || !!document.querySelector(".menu-pop")
      || !!$("modalLayer").firstChild;
  }
  function syncOverlay(){ $("overlay").classList.toggle("show", overlayIsNeeded()); }

  function closeAllOverlays(){
    $("modalLayer").innerHTML = "";
    document.querySelectorAll(".menu-pop").forEach(n=>n.remove());
    syncOverlay();
  }

  // Anchors a already-appended pop-up menu, clamped to the viewport on both
  // axes. Positioning it purely from the anchor's rect put the menu partly
  // off-screen whenever the anchor itself sat near (or past) an edge — which
  // on a phone is exactly where the account avatar ends up.
  const MENU_EDGE = 8;
  function placeMenu(menu, anchor){
    const rect = anchor.getBoundingClientRect();
    const m = menu.getBoundingClientRect();
    let left = rect.right - m.width;                       // right-aligned to the anchor
    left = Math.min(left, window.innerWidth - m.width - MENU_EDGE);
    left = Math.max(MENU_EDGE, left);
    menu.style.left = left + "px";
    menu.style.right = "";
    // flip above the anchor rather than run off the bottom
    if(rect.bottom + 6 + m.height > window.innerHeight && rect.top - 6 - m.height > 0){
      menu.style.top = "";
      menu.style.bottom = (window.innerHeight - rect.top + 6) + "px";
    } else {
      menu.style.bottom = "";
      menu.style.top = Math.max(MENU_EDGE, Math.min(rect.bottom + 6, window.innerHeight - m.height - MENU_EDGE)) + "px";
    }
  }

  // Brief non-blocking message, optionally with one action. Used for things
  // the user should know about but must not be interrupted by mid-read —
  // native alert() would steal focus and block the reader entirely.
  let toastTimer = null;
  function toast(msg, actionLabel, onAction){
    const host = $("toastHost");
    if(!host) return;
    host.innerHTML = "";
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = '<span class="toast-msg"></span>';
    el.querySelector(".toast-msg").textContent = msg;
    if(actionLabel){
      const b = document.createElement("button");
      b.className = "toast-action";
      b.textContent = actionLabel;
      b.addEventListener("click", ()=>{ host.innerHTML = ""; if(onAction) onAction(); });
      el.appendChild(b);
    }
    const close = document.createElement("button");
    close.className = "toast-close";
    close.setAttribute("aria-label", "닫기");
    close.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    close.addEventListener("click", ()=>{ host.innerHTML = ""; });
    el.appendChild(close);
    host.appendChild(el);
    requestAnimationFrame(()=> el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>{ if(el.parentNode) el.remove(); }, 250); }, actionLabel ? 12000 : 5000);
  }
  $("overlay").addEventListener("click", closeAllOverlays);
  $("newFolderBtn").addEventListener("click", ()=> openNewFolderModal());

  /* ---------------- folder tree helpers ---------------- */
  function currentParentId(){ return folderPath.length ? folderPath[folderPath.length-1] : null; }
  function folderById(id){ return folders.find(f=>f.id===id); }
  function childFolders(parentId){ return folders.filter(f=>(f.parentId||null)===(parentId||null)); }

  /* The tree is walked recursively in several places (the sidebar render,
     descendantFolderIds, folderPathLabel), all of which assume it really is
     a tree. Merging two libraries can break that assumption in two ways, and
     neither device did anything wrong on its own:

       - a cycle: A moves 가 into 나 while B moves 나 into 가. Each move is
         legal where it was made, and each device's own guard sees nothing
         to refuse. Merged, the walks never terminate — the sidebar render
         recurses until the stack dies, and the library will not open again
         after a reload either, because the data is still that shape.
       - an orphan: A deletes a folder while B is putting things inside it.
         The tombstone removes the folder everywhere, but the subfolder and
         the files that pointed at it survive with a parent that is gone, so
         they render nowhere at all — a book still counted under 전체 but
         reachable from no folder.

     Repairing costs one pass and only touches records that are already
     broken. Timestamps are bumped so the repair itself propagates instead
     of being overwritten by the copy that caused it. */
  function reconcileFolderTree(){
    const byId = new Map(folders.map(fo=> [fo.id, fo]));
    let changed = false;
    const now = Date.now();

    for(const fo of folders){
      if(!fo.parentId) continue;
      // parent gone: bring it up to the root rather than lose it
      if(!byId.has(fo.parentId)){
        fo.parentId = null; fo.updatedTs = now; changed = true;
        continue;
      }
      // walk up; anything that comes back to itself is a cycle
      const seen = new Set([fo.id]);
      let cur = byId.get(fo.parentId);
      while(cur){
        if(seen.has(cur.id)){ fo.parentId = null; fo.updatedTs = now; changed = true; break; }
        seen.add(cur.id);
        cur = cur.parentId ? byId.get(cur.parentId) : null;
      }
    }
    for(const f of files){
      if(f.folderId && !byId.has(f.folderId)){ f.folderId = null; f.updatedTs = now; changed = true; }
    }
    // and don't leave the breadcrumb standing somewhere that no longer exists
    const stranded = folderPath.findIndex(id=> !byId.has(id));
    if(stranded !== -1) folderPath = folderPath.slice(0, stranded);
    expandedFolders.forEach(id=>{ if(!byId.has(id)) expandedFolders.delete(id); });
    return changed;
  }
  function descendantFolderIds(id){
    const out=[id];
    childFolders(id).forEach(c=> out.push(...descendantFolderIds(c.id)));
    return out;
  }
  function folderFileCount(id){
    const ids = new Set(descendantFolderIds(id));
    return files.filter(f=> f.folderId && ids.has(f.folderId)).length;
  }
  function folderPathLabel(id){
    const parts=[];
    let cur = folderById(id);
    while(cur){ parts.unshift(cur.name); cur = cur.parentId ? folderById(cur.parentId) : null; }
    return parts.join(" › ");
  }
  function folderAncestorPath(id){
    const path=[];
    let cur = folderById(id);
    while(cur){ path.unshift(cur.id); cur = cur.parentId ? folderById(cur.parentId) : null; }
    return path;
  }
  function moveFileToFolder(f, folderId){
    f.folderId = folderId || null;
    f.updatedTs = Date.now();
    persistFiles();
  }
  function moveFolderToParent(folderId, newParentId){
    const fo = folderById(folderId);
    if(!fo || folderId === newParentId) return;
    if(newParentId && descendantFolderIds(folderId).includes(newParentId)) return; // no cycles
    fo.parentId = newParentId || null;
    fo.updatedTs = Date.now();
    persistFolders();
  }
  // shared drop handler for both the tree and the 미분류 chip — reads
  // whichever payload type dragstart attached (see file-card / tree-item
  // dragstart handlers) and routes to the matching move function
  function handleTreeDrop(e, targetFolderId){
    const fileId = e.dataTransfer.getData("application/x-ss-file");
    const folderId = e.dataTransfer.getData("application/x-ss-folder");
    if(fileId){
      const f = files.find(x=>x.id===fileId);
      if(f) moveFileToFolder(f, targetFolderId);
    } else if(folderId){
      moveFolderToParent(folderId, targetFolderId);
    }
    if(targetFolderId) expandedFolders.add(targetFolderId); // reveal what just landed there
    renderAll();
  }

  /* ---------------- folder rail ---------------- */
  function renderFolderRail(){
    const rail = $("railDynamic");
    rail.innerHTML = "";

    const pinned = document.createElement("div");
    pinned.className = "rail-row";
    const all = document.createElement("button");
    all.className = "folder-chip" + (libView==="all" ? " active":"");
    all.innerHTML = "전체 <span class=\"count\">"+files.length+"</span>";
    all.addEventListener("click", ()=>{ resetSearch(); libView="all"; renderAll(); });
    pinned.appendChild(all);

    const uncatCount = files.filter(f=>!f.folderId).length;
    const uncat = document.createElement("button");
    uncat.className = "folder-chip" + (libView==="uncategorized" ? " active":"");
    uncat.innerHTML = "미분류 <span class=\"count\">"+uncatCount+"</span>";
    uncat.addEventListener("click", ()=>{ resetSearch(); libView="uncategorized"; renderAll(); });
    uncat.addEventListener("dragover", (e)=>{ e.preventDefault(); uncat.classList.add("drag-over"); });
    uncat.addEventListener("dragleave", ()=> uncat.classList.remove("drag-over"));
    uncat.addEventListener("drop", (e)=>{ e.preventDefault(); uncat.classList.remove("drag-over"); handleTreeDrop(e, null); });
    pinned.appendChild(uncat);

    const add = document.createElement("button");
    add.className = "folder-chip new";
    add.textContent = "+ 폴더";
    add.addEventListener("click", ()=> openNewFolderModal());
    pinned.appendChild(add);
    rail.appendChild(pinned);

    if(searchQuery.trim()){
      const note = document.createElement("div");
      note.className = "rail-crumbs";
      const label = document.createElement("button");
      label.className = "crumb-item active";
      label.textContent = "검색 결과 " + visibleFiles().length + "건 · 지우기 ✕";
      label.addEventListener("click", ()=>{ resetSearch(); renderAll(); });
      note.appendChild(label);
      rail.appendChild(note);
      return;
    }

    // Tablet/desktop: the rail is a tall sidebar, so show the whole folder
    // hierarchy as an expandable tree (with drag-and-drop to reorganize).
    // Phones: the rail is a horizontal chip strip, which a nested/indented
    // tree doesn't suit — keep the existing one-level-at-a-time breadcrumb
    // drill-down there instead.
    if(isTabletUp()){
      rail.appendChild(renderFolderTree());
      return;
    }

    // Breadcrumb + subfolder chips stay visible no matter which pinned filter
    // (전체/미분류) is active, so switching to a flat filter never strands you
    // without a way back into the folder tree — clicking any of them jumps
    // straight back into 'browse' mode at that location.
    const crumbs = document.createElement("div");
    crumbs.className = "rail-crumbs";
    const home = document.createElement("button");
    home.className = "crumb-item" + (libView==="browse" && folderPath.length===0 ? " active" : "");
    home.textContent = "서재";
    home.addEventListener("click", ()=>{ libView="browse"; folderPath=[]; renderAll(); });
    crumbs.appendChild(home);
    folderPath.forEach((fid, i)=>{
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      crumbs.appendChild(sep);
      const seg = document.createElement("button");
      seg.className = "crumb-item" + (libView==="browse" && i===folderPath.length-1 ? " active" : "");
      const fo = folderById(fid);
      seg.textContent = fo ? fo.name : "?";
      seg.addEventListener("click", ()=>{ libView="browse"; folderPath = folderPath.slice(0, i+1); renderAll(); });
      crumbs.appendChild(seg);
      // phones have no tree to hang a per-folder menu off of — offer it on
      // the current folder's own breadcrumb segment instead
      if(i===folderPath.length-1 && fo){
        const kebab = document.createElement("button");
        kebab.className = "crumb-kebab-btn";
        kebab.setAttribute("aria-label", "폴더 메뉴");
        kebab.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>';
        kebab.addEventListener("click", (e)=>{ e.stopPropagation(); openFolderMenu(e.currentTarget, fo); });
        crumbs.appendChild(kebab);
      }
    });
    rail.appendChild(crumbs);

    const kids = childFolders(currentParentId());
    if(kids.length){
      const kidsRow = document.createElement("div");
      kidsRow.className = "rail-row";
      kids.forEach(fo=>{
        const chip = document.createElement("button");
        chip.className = "folder-chip";
        chip.innerHTML = escapeHtml(fo.name) + " <span class=\"count\">"+folderFileCount(fo.id)+"</span>";
        chip.addEventListener("click", ()=>{ libView="browse"; folderPath = [...folderPath, fo.id]; renderAll(); });
        kidsRow.appendChild(chip);
      });
      rail.appendChild(kidsRow);
    }
  }

  /* ---------------- folder tree (tablet/desktop) ---------------- */
  function renderFolderTree(){
    const container = document.createElement("div");
    container.className = "folder-tree";

    const rootRow = document.createElement("button");
    rootRow.className = "tree-item" + (libView==="browse" && folderPath.length===0 ? " active" : "");
    rootRow.innerHTML = '<span class="tree-caret empty"></span><span class="tree-name">서재</span>';
    rootRow.addEventListener("click", ()=>{ libView="browse"; folderPath=[]; renderAll(); });
    rootRow.addEventListener("dragover", (e)=>{ e.preventDefault(); rootRow.classList.add("drag-over"); });
    rootRow.addEventListener("dragleave", ()=> rootRow.classList.remove("drag-over"));
    rootRow.addEventListener("drop", (e)=>{ e.preventDefault(); rootRow.classList.remove("drag-over"); handleTreeDrop(e, null); });
    container.appendChild(rootRow);

    childFolders(null).forEach(fo => container.appendChild(renderFolderTreeNode(fo, 1)));
    return container;
  }

  function renderFolderTreeNode(fo, depth){
    const wrap = document.createElement("div");
    const kids = childFolders(fo.id);
    const expanded = expandedFolders.has(fo.id);
    const isActive = libView==="browse" && currentParentId()===fo.id;

    // a <div> here, not a <button> — it needs to contain its own kebab
    // button for rename/delete, and buttons can't nest inside buttons
    const item = document.createElement("div");
    item.className = "tree-item" + (isActive ? " active" : "");
    item.setAttribute("role", "button");
    item.tabIndex = 0;
    item.style.setProperty("--depth", depth);
    item.innerHTML =
      (kids.length
        ? '<span class="tree-caret'+(expanded ? ' open' : '')+'"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span>'
        : '<span class="tree-caret empty"></span>') +
      '<span class="tree-name">'+escapeHtml(fo.name)+'</span>'+
      '<span class="count">'+folderFileCount(fo.id)+'</span>'+
      '<button class="tree-kebab-btn" aria-label="폴더 메뉴"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>';
    function navigateOrToggle(e){
      if(kids.length && e.target.closest(".tree-caret")){
        expandedFolders.has(fo.id) ? expandedFolders.delete(fo.id) : expandedFolders.add(fo.id);
        renderFolderRail();
        return;
      }
      libView="browse";
      folderPath = folderAncestorPath(fo.id);
      if(kids.length) expandedFolders.add(fo.id);
      renderAll();
    }
    item.addEventListener("click", (e)=>{
      if(e.target.closest(".tree-kebab-btn")) return;
      navigateOrToggle(e);
    });
    item.addEventListener("keydown", (e)=>{
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); navigateOrToggle(e); }
    });
    item.querySelector(".tree-kebab-btn").addEventListener("click", (e)=>{
      e.stopPropagation();
      openFolderMenu(e.currentTarget, fo);
    });

    // drag source: pick this folder up to move it elsewhere
    item.draggable = true;
    item.addEventListener("dragstart", (e)=>{
      e.stopPropagation();
      e.dataTransfer.setData("application/x-ss-folder", fo.id);
      e.dataTransfer.effectAllowed = "move";
    });
    // drop target: files or other folders dropped here move into this folder
    item.addEventListener("dragover", (e)=>{ e.preventDefault(); item.classList.add("drag-over"); });
    item.addEventListener("dragleave", ()=> item.classList.remove("drag-over"));
    item.addEventListener("drop", (e)=>{
      e.preventDefault(); e.stopPropagation();
      item.classList.remove("drag-over");
      handleTreeDrop(e, fo.id);
    });

    wrap.appendChild(item);
    if(kids.length && expanded){
      kids.forEach(k => wrap.appendChild(renderFolderTreeNode(k, depth+1)));
    }
    return wrap;
  }

  /* ---------------- file list ---------------- */
  function visibleFiles(){
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      return sortFiles(files.filter(f=> String(f.title||"").toLowerCase().includes(q)));
    }
    if(libView==="all") return sortFiles(files);
    if(libView==="uncategorized") return sortFiles(files.filter(f=>!f.folderId));
    const pid = currentParentId();
    return sortFiles(files.filter(f=>(f.folderId||null) === pid));
  }

  function renderFileList(){
    const list = $("fileList");
    const vis = visibleFiles();
    list.innerHTML = "";
    if(vis.length===0){
      if(searchQuery.trim()){
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML =
          '<svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
          '<strong>검색 결과가 없어요</strong>'+
          '<span>"'+escapeHtml(searchQuery.trim())+'"와 일치하는 제목을 찾지 못했어요.</span>';
        list.appendChild(empty);
        return;
      }
      const hasKids = libView==="browse" && childFolders(currentParentId()).length>0;
      if(hasKids){
        const atRoot = folderPath.length===0;
        const hint = document.createElement("div");
        hint.className = "empty-state empty-state--sub";
        hint.innerHTML = '<span>'+(atRoot ? "위 폴더를 눌러 안에 있는 파일을 확인해보세요." : "이 폴더에는 하위 폴더만 있고 파일은 없어요. 위에서 폴더를 눌러 들어가보세요.")+'</span>';
        list.appendChild(hint);
        return;
      }
      const empty = document.createElement("div");
      empty.className = "empty-state";
      const noFilesAtAll = files.length===0;
      empty.innerHTML =
        '<svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>'+
        '<strong>'+(noFilesAtAll ? "아직 올린 파일이 없어요" : (libView==="browse" ? "이 폴더는 비어 있어요" : "여기엔 파일이 없어요"))+'</strong>'+
        '<span>오른쪽 위 "파일 업로드" 버튼을 누르거나, md 파일을 화면에 끌어다 놓으면 서재에 추가돼요.</span>';
      list.appendChild(empty);
      return;
    }
    const grid = document.createElement("div");
    grid.className = "file-grid" + (density==="compact" ? " compact" : "");
    vis.forEach(f=>{
      const prog = f.progress || {};
      const pct = typeof prog.pct === "number" ? Math.round(prog.pct*100) : 0;
      const card = document.createElement("div");
      card.className = "file-card";
      const d = new Date(f.updatedTs);
      const dateStr = d.toLocaleDateString("ko-KR", {month:"short", day:"numeric"});
      const fPath = f.folderId ? folderPathLabel(f.folderId) : null;
      card.innerHTML =
        '<div class="doc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg></div>'+
        '<div class="info">'+
          '<div class="name">'+escapeHtml(f.title)+'</div>'+
          '<div class="meta">'+
            (fPath ? '<span class="tag">'+escapeHtml(fPath)+'</span>' : '')+
            '<span>'+f.chapterCount+'개 챕터</span><span class="dot"></span><span>'+dateStr+'</span>'+
            (pct>0 ? '<span class="dot"></span><span>'+pct+'% 읽음</span>' : '')+
          '</div>'+
          '<div class="progress-bar"><i style="width:'+pct+'%"></i></div>'+
        '</div>'+
        '<button class="more-btn" aria-label="더보기"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
        '<button class="hit" aria-label="열기"></button>';
      card.querySelector(".hit").addEventListener("click", ()=> openBook(f.id));
      card.querySelector(".more-btn").addEventListener("click", (e)=>{ e.stopPropagation(); openFileMenu(e.currentTarget, f); });
      // drag-to-reorganize onto the folder tree — tablet/desktop only (the
      // tree itself, its only drop target, is also scoped to that width)
      if(isTabletUp()){
        card.draggable = true;
        card.addEventListener("dragstart", (e)=>{
          e.dataTransfer.setData("application/x-ss-file", f.id);
          e.dataTransfer.effectAllowed = "move";
        });
      }
      grid.appendChild(card);
    });
    list.appendChild(grid);
  }

  function renderAll(){ renderFolderRail(); renderFileList(); }

  /* ---------------- search / sort / density controls ---------------- */
  const searchInput = $("searchInput");
  const searchClearBtn = $("searchClear");
  function resetSearch(){
    if(!searchQuery) return;
    searchQuery = "";
    searchInput.value = "";
    searchClearBtn.classList.add("hidden");
    searchToggleBtn.classList.toggle("active", searchRow.classList.contains("open"));
  }
  searchInput.addEventListener("input", ()=>{
    searchQuery = searchInput.value;
    searchClearBtn.classList.toggle("hidden", !searchQuery);
    markSearchActive(searchRow.classList.contains("open"));
    renderAll();
  });
  searchClearBtn.addEventListener("click", ()=>{
    resetSearch();
    renderAll();
    searchInput.focus();
  });

  // phones only (see .search-toggle-btn CSS): search collapses into this
  // button, dropping the input down as an overlay instead of always
  // spending a full row on it
  const searchRow = document.querySelector(".search-row");
  const searchToggleBtn = $("searchToggleBtn");
  function markSearchActive(rowOpen){
    searchToggleBtn.classList.toggle("active", rowOpen || !!searchQuery.trim());
  }
  searchToggleBtn.addEventListener("click", ()=>{
    const isOpen = searchRow.classList.toggle("open");
    markSearchActive(isOpen);
    if(isOpen) searchInput.focus();
  });
  document.addEventListener("click", (e)=>{
    if(!searchRow.classList.contains("open")) return;
    if(e.target.closest(".lib-search-bar")) return;
    searchRow.classList.remove("open");
    markSearchActive(false);
  });

  const sortSelect = $("sortSelect");
  sortSelect.addEventListener("change", ()=>{
    sortMode = sortSelect.value;
    persistPrefs();
    renderAll();
  });

  function updateDensityButtons(){
    document.querySelectorAll(".density-btn").forEach(b=> b.classList.toggle("active", b.dataset.density===density));
  }
  document.querySelectorAll(".density-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      density = b.dataset.density;
      updateDensityButtons();
      persistPrefs();
      renderFileList();
    });
  });

  /* ---------------- new folder modal ---------------- */
  function openNewFolderModal(){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const parentId = currentParentId();
    const parentLabel = parentId ? folderPathLabel(parentId) : null;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>새 폴더 만들기'+(parentLabel ? ' <span class="modal-hint">· '+escapeHtml(parentLabel)+' 안에</span>' : '')+'</h4>'+
      '<input type="text" id="folderNameInput" placeholder="예: 전공 서적, 자격증 공부">'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelFolder">취소</button>'+
        '<button class="btn btn-primary" id="confirmFolder">만들기</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);
    const input = $("folderNameInput");
    input.focus();
    $("cancelFolder").addEventListener("click", closeAllOverlays);
    const confirm = ()=>{
      const name = input.value.trim();
      if(!name) return;
      folders.push({id:genId(), name, parentId, updatedTs: Date.now()});
      persistFolders();
      if(parentId) expandedFolders.add(parentId); // reveal it in the tree immediately, not just after a manual expand
      closeAllOverlays();
      renderAll();
    };
    $("confirmFolder").addEventListener("click", confirm);
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") confirm(); });
  }

  /* ---------------- file kebab menu ---------------- */

    $("overlay").classList.add("show");
    const menu = document.createElement("div");
    menu.className = "menu-pop";
    menu.innerHTML =
      '<button class="menu-item" data-act="edit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>편집</button>'+
      '<button class="menu-item" data-act="rename"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>이름 변경</button>'+
      '<div class="menu-sub-label">폴더로 이동</div>'+
      '<button class="menu-item" data-act="move" data-folder="">미분류</button>'+
      folders.map(fo=>'<button class="menu-item" data-act="move" data-folder="'+fo.id+'">'+escapeHtml(folderPathLabel(fo.id))+'</button>').join("")+
      '<div class="menu-divider"></div>'+
      '<button class="menu-item danger" data-act="delete"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>삭제</button>';
    document.body.appendChild(menu);

  function openRenameModal(f){

      '<div class="modal-actions">'+
