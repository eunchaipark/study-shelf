<style>
  :root{
    --bg-app:#F7F5F2;
    --bg-sunken:#F1ECE5;
    --bg-sunken-2:#E9E0D2;
    --surface:#FFFFFF;
    --line:#EAE3DA;
    --line-strong:#DCD1C0;
    --text-900:#3F3A34;
    --text-700:#57524D;
    --text-500:#8B8177;
    --text-400:#B6ABA0;
    --accent-300:#E3A576;
    --accent-400:#C97A45;
    --accent-500:#A85F30;
    --accent-wash:rgba(201,122,69,0.12);
    --danger:#DB7C72;
    --danger-wash:rgba(219,124,114,0.12);

    --ui-font:'Noto Sans KR', sans-serif;
    --display-font:'Space Grotesk', 'Noto Sans KR', sans-serif;
    --read-font:'Noto Serif KR', serif;
    --read-size:18px;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:40px;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow-sm:0 1px 2px rgba(63,58,52,.08);
    --shadow-md:0 8px 24px rgba(63,58,52,.10);
    --shadow-lg:0 20px 50px rgba(63,58,52,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--ui-font); background:var(--bg-app); color:var(--text-700); overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-400); color:#fff9f4;}
  svg{display:block;}
  .icon{width:18px; height:18px; flex:0 0 auto;}

  :focus-visible{outline:2px solid var(--accent-400); outline-offset:2px; border-radius:6px;}

  /* thin scrollbars for desktop */
  .lib-main, .read-scroll, .toc-list, .rail-row{scrollbar-width:thin; scrollbar-color:var(--line-strong) transparent;}
  .lib-main::-webkit-scrollbar, .toc-list::-webkit-scrollbar, .rail-row::-webkit-scrollbar{width:7px; height:7px;}
  .lib-main::-webkit-scrollbar-thumb, .toc-list::-webkit-scrollbar-thumb, .rail-row::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
  .lib-main::-webkit-scrollbar-track, .toc-list::-webkit-scrollbar-track, .rail-row::-webkit-scrollbar-track{background:transparent;}

  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* ============ LIBRARY SCREEN ============ */
  #libraryScreen{background:var(--bg-app);}

  .lib-topbar{
    display:flex; align-items:center; gap:var(--sp-2);
    padding:var(--sp-4) var(--sp-4); padding-top:calc(var(--sp-4) + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);
    flex:0 0 auto; background:var(--surface);
  }
  .lib-brand{font-family:var(--ui-font); font-weight:800; font-size:14px; letter-spacing:.05em; color:var(--accent-500); text-transform:uppercase; line-height:1.15; white-space:nowrap; flex:0 0 auto;}
  .lib-spacer{flex:1;}
  .btn{
    display:inline-flex; align-items:center; gap:6px; border:none; border-radius:var(--r-sm);
    font-size:13px; font-weight:600; padding:10px 13px; white-space:nowrap; flex:0 0 auto;
    transition:background-color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  /* narrow phones (~360px and under is the most common Android width): the
     secondary action collapses to icon-only rather than shrinking every
     button's padding/font, so both buttons keep the same visual weight as
     the rest of the UI instead of looking pinched */
  @media (max-width:400px){
    .lib-topbar{gap:8px;}
    .lib-brand{font-size:12px; letter-spacing:.03em;}
    .btn-ghost{padding:10px; gap:0;}
    .btn-ghost .btn-label{display:none;}
  }
  .btn-primary{background:var(--accent-400); color:#fffaf6; box-shadow:var(--shadow-sm);}
  .btn-primary:active{background:var(--accent-500); transform:translateY(1px); box-shadow:none;}
  .btn-ghost{background:var(--surface); color:var(--text-700); border:1px solid var(--line-strong);}
  .btn-ghost:active{background:var(--bg-sunken); transform:translateY(1px);}
  @media (hover:hover) and (pointer:fine){
    .btn-primary:hover{background:#BD703E; box-shadow:0 4px 14px rgba(201,122,69,.28);}
    .btn-ghost:hover{border-color:var(--text-400); background:var(--bg-sunken);}
  }

  .lib-search-bar{
    position:relative; display:flex; flex-direction:column; gap:8px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--surface); flex:0 0 auto;
  }
  .search-row{display:flex;}
  .controls-row{display:flex; align-items:center; gap:8px;}
  .search-toggle-btn{
    display:none; flex:0 0 auto; width:34px; height:34px; border-radius:var(--r-sm);
    border:1px solid transparent; background:var(--bg-sunken); color:var(--text-500);
    align-items:center; justify-content:center; transition:background-color .15s var(--ease), color .15s var(--ease);
  }
  .search-toggle-btn .icon{width:16px; height:16px;}
  .search-toggle-btn.active{background:var(--accent-wash); color:var(--accent-500);}
  /* phones: the search bar sat above the controls row as its own full row
     every time, permanently spending height on something used occasionally
     — collapse it into a small button that drops the input down as an
     overlay on demand instead. Sort/density controls stay always visible. */
  @media (max-width:719px){
    .search-toggle-btn{display:flex;}
    .search-row{display:none;}
    .search-row.open{
      display:flex; position:absolute; left:16px; right:16px; top:100%;
      margin-top:-8px; padding:10px 0 12px; background:var(--surface);
      border-bottom:1px solid var(--line); box-shadow:var(--shadow-lg); z-index:20;
    }
  }
  .search-field{position:relative; flex:1; display:flex; align-items:center;}
  .search-field .icon{position:absolute; left:10px; width:16px; height:16px; color:var(--text-400); pointer-events:none;}
  .search-field input{
    width:100%; background:var(--bg-sunken); border:1px solid transparent; color:var(--text-900);
    border-radius:var(--r-sm); padding:9px 32px; font-size:13.5px;
    transition:border-color .15s var(--ease), background-color .15s var(--ease);
  }
  .search-field input::placeholder{color:var(--text-400);}
  .search-field input:focus{outline:none; background:var(--surface); border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}
  .search-clear{
    position:absolute; right:6px; width:22px; height:22px; border-radius:50%; border:none; padding:0;
    background:var(--bg-sunken-2); color:var(--text-500); display:flex; align-items:center; justify-content:center;
  }
  .search-clear .icon{width:12px; height:12px;}
  .search-clear.hidden{display:none;}

  .sort-select{
    flex:1; min-width:0; background:var(--bg-sunken); border:1px solid transparent; color:var(--text-700);
    border-radius:var(--r-sm); padding:9px 30px 9px 12px; font-size:12.5px; font-weight:600;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B8177' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 8px center; background-size:14px;
  }
  .sort-select:focus{outline:none; border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}

  .density-toggle{display:flex; gap:2px; background:var(--bg-sunken); border-radius:var(--r-sm); padding:2px; flex:0 0 auto;}
  .density-btn{width:30px; height:30px; border-radius:6px; border:none; background:transparent; color:var(--text-500); display:flex; align-items:center; justify-content:center;}
  .density-btn .icon{width:16px; height:16px;}
  .density-btn.active{background:var(--surface); color:var(--accent-500); box-shadow:var(--shadow-sm);}

  .file-grid.compact .file-card{padding:8px 10px; gap:10px;}
  .file-grid.compact .file-card .doc-icon{width:30px; height:30px;}
  .file-grid.compact .file-card .doc-icon .icon{width:15px; height:15px;}
  .file-grid.compact .file-card .name{font-size:13.5px;}
  .file-grid.compact .file-card .meta{margin-top:2px;}
  .file-grid.compact .file-card .progress-bar{margin-top:6px; height:3px;}
  /* below the desktop breakpoint (960px+) that turns "compact" into an
     actual multi-column grid, the two density modes only differed by a
     few px of padding — barely visible. Give compact a genuinely
     different shape here too: a flat divided list instead of bordered
     cards, so switching modes reads as a real change on phones/tablets. */
  @media (max-width:959px){
    .file-grid.compact{gap:0;}
    .file-grid.compact .file-card{
      border-radius:0; border:none; border-bottom:1px solid var(--line);
      box-shadow:none; padding:10px 4px;
    }
    .file-grid.compact .file-card:last-child{border-bottom:none;}
  }
  @media (max-width:959px) and (hover:hover) and (pointer:fine){
    .file-grid.compact .file-card:hover{transform:none; box-shadow:none;}
  }

  .lib-body{flex:1; display:flex; flex-direction:column; min-height:0; position:relative;}

  .folder-rail{
    flex:0 0 auto; display:flex; flex-direction:column; gap:10px;
    padding:var(--sp-3) var(--sp-4); border-bottom:1px solid var(--line);
    background:var(--surface);
  }
  #railDynamic{display:flex; flex-direction:column; gap:10px; min-width:0;}
  /* account control lives in the top bar as a small icon/avatar next to the
     other header actions, not as a full row competing with folder chips for
     space — full name/sync-state text only appears in the popup on tap. */
  .lib-account{position:relative; flex:0 0 auto;}
  .account-signin-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    background:var(--bg-sunken); border:1px solid var(--line-strong); color:var(--text-700);
    border-radius:50%; transition:background-color .15s var(--ease), border-color .15s var(--ease);
  }
  @media (hover:hover) and (pointer:fine){ .account-signin-btn:hover{background:var(--bg-sunken-2); border-color:var(--text-400);} }
  .account-signin-btn .icon{width:17px; height:17px;}
  .account-error-dot{position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:2px solid var(--surface);}
  .account-avatar-wrap{position:relative; display:block; width:36px; height:36px; border-radius:50%; border:none; background:none; padding:0;}
  .account-avatar{width:36px; height:36px; border-radius:50%; display:block; background:var(--bg-sunken-2); object-fit:cover;}
  .account-sync-dot{position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:var(--text-400); border:2px solid var(--surface);}
  .account-sync-dot.synced{background:#67a782;}
  .account-sync-dot.syncing{background:var(--accent-400); animation:sync-pulse 1s ease-in-out infinite;}
  .account-sync-dot.error{background:var(--danger);}
  @keyframes sync-pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .menu-account-id{font-size:11.5px; color:var(--text-500); padding:6px 10px 8px; border-bottom:1px solid var(--line); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px;}
  .rail-row{display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; white-space:nowrap; -webkit-overflow-scrolling:touch;}
  .rail-crumbs{display:flex; align-items:center; gap:3px; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch;}
  .crumb-item{background:none; border:none; padding:3px 3px; font-size:12px; font-weight:600; color:var(--text-500); border-radius:6px; flex:0 0 auto; transition:color .15s var(--ease);}
  .crumb-item.active{color:var(--text-900);}
  .crumb-sep{color:var(--text-400); font-size:11px; flex:0 0 auto;}
  @media (hover:hover) and (pointer:fine){ .crumb-item:not(.active):hover{color:var(--text-700);} }

  .folder-chip{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--bg-sunken); border:1px solid transparent; color:var(--text-500);
    border-radius:var(--r-sm); padding:8px 14px; font-size:13px; font-weight:600; flex:0 0 auto;
    transition:background-color .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
  }
  .folder-chip .count{color:var(--text-400); font-weight:500; font-variant-numeric:tabular-nums;}
  .folder-chip.active{background:var(--accent-400); border-color:var(--accent-400); color:#fffaf6;}
  .folder-chip.active .count{color:rgba(255,250,246,.7);}
  .folder-chip.new{color:var(--accent-500); background:transparent; border-style:dashed; border-color:var(--line-strong);}
  @media (hover:hover) and (pointer:fine){
    .folder-chip:not(.active):hover{border-color:var(--line-strong); color:var(--text-900); background:var(--bg-sunken-2);}
  }
  .folder-chip.drag-over{border-color:var(--accent-400); background:var(--accent-wash); color:var(--accent-500);}

  /* folder tree (tablet/desktop rail) — see renderFolderTree() */
  .folder-tree{display:flex; flex-direction:column; gap:1px; margin-top:2px;}
  .tree-item{
    display:flex; align-items:center; gap:6px; width:100%; text-align:left;
    padding:7px 8px; padding-left:calc(8px + var(--depth, 0) * 14px);
    border-radius:var(--r-sm); border:1px solid transparent; background:transparent;
    color:var(--text-700); font-size:13px; transition:background-color .15s var(--ease), border-color .15s var(--ease);
  }
  .tree-item .count{margin-left:auto; padding-left:8px; color:var(--text-400); font-size:11px; font-variant-numeric:tabular-nums; flex:0 0 auto;}
  .tree-item.active{background:var(--accent-wash); color:var(--accent-500); font-weight:600;}
  .tree-item.drag-over{border-color:var(--accent-400); background:var(--accent-wash);}
  @media (hover:hover) and (pointer:fine){ .tree-item:not(.active):hover{background:var(--bg-sunken);} }
  .tree-caret{width:16px; height:16px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:var(--text-400); transition:transform .15s var(--ease);}
  .tree-caret.empty{visibility:hidden;}
  .tree-caret.open{transform:rotate(90deg);}
  .tree-caret .icon{width:13px; height:13px;}
  .tree-name{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .lib-main{flex:1; overflow-y:auto; padding:var(--sp-4) var(--sp-4) 100px;}

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:70px 20px; color:var(--text-500); gap:var(--sp-2); max-width:340px; margin:0 auto;
  }
  .empty-state .icon-lg{width:38px; height:38px; color:var(--line-strong); margin-bottom:8px;}
  .empty-state strong{color:var(--text-900); font-size:15px; font-weight:600; letter-spacing:-.01em;}
  .empty-state span{font-size:13px; line-height:1.55; color:var(--text-500);}
  .empty-state--sub{padding:36px 20px; color:var(--text-400); font-size:13px; max-width:280px;}

  .file-grid{display:flex; flex-direction:column; gap:var(--sp-3);}

  .file-card{
    display:flex; align-items:center; gap:var(--sp-3);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:var(--sp-3); position:relative; box-shadow:var(--shadow-sm);
    transition:border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  @media (hover:hover) and (pointer:fine){
    .file-card:hover{border-color:var(--line-strong); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  }
  .file-card .doc-icon{
    width:38px; height:38px; border-radius:var(--r-sm); background:var(--bg-sunken); color:var(--accent-500);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; border:1px solid var(--line);
  }
  .file-card .info{flex:1; min-width:0;}
  .file-card .name{font-size:14.5px; font-weight:600; color:var(--text-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.005em;}
  .file-card .meta{font-size:12px; color:var(--text-500); margin-top:4px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .file-card .meta .tag{background:var(--bg-sunken); color:var(--text-500); padding:2.5px 9px; border-radius:999px; font-size:10.5px; font-weight:600; letter-spacing:.01em;}
  .file-card .meta .dot{width:3px; height:3px; border-radius:50%; background:var(--text-400); flex:0 0 auto;}
  .file-card .progress-bar{height:4px; border-radius:99px; background:var(--bg-sunken); margin-top:10px; overflow:hidden;}
  .file-card .progress-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--accent-500), var(--accent-300)); border-radius:99px;}
  .file-card .more-btn{
    width:32px; height:32px; border-radius:var(--r-sm); background:transparent; border:none; color:var(--text-500);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; transition:background-color .15s var(--ease), color .15s var(--ease);
  }
  .file-card .more-btn:active{background:var(--bg-sunken);}
  @media (hover:hover) and (pointer:fine){ .file-card .more-btn:hover{background:var(--bg-sunken); color:var(--text-900);} }
  .file-card .hit{position:absolute; inset:0; right:44px; background:transparent; border:none;}

  .drag-overlay{
    position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(247,245,242,0.94); border:2px dashed var(--accent-400); margin:10px; border-radius:var(--r-lg);
    backdrop-filter:blur(3px);
  }
  .drag-overlay.show{display:flex;}
  .drag-overlay .msg{text-align:center; color:var(--accent-500); font-size:15px; font-weight:600;}

  #fileInput{display:none;}

  /* ============ Popovers / Modals (shared) ============ */
  .overlay{position:absolute; inset:0; background:rgba(63,58,52,0.28); backdrop-filter:blur(2px); z-index:50; opacity:0; pointer-events:none; transition:opacity .15s var(--ease);}
  .overlay.show{opacity:1; pointer-events:auto;}

  .menu-pop{
    position:absolute; z-index:51; min-width:180px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:6px;
    box-shadow:var(--shadow-lg);
  }
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--text-700); padding:10px 12px; border-radius:var(--r-sm); font-size:13.5px;
    transition:background-color .12s var(--ease);
  }
  .menu-item:active{background:var(--bg-sunken);}
  @media (hover:hover) and (pointer:fine){ .menu-item:hover{background:var(--bg-sunken);} }
  .menu-item.danger{color:var(--danger);}
  .menu-divider{height:1px; background:var(--line); margin:5px 4px;}
  .menu-sub-label{font-size:10.5px; color:var(--text-400); padding:8px 12px 4px; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}

  .modal{
    position:absolute; z-index:52; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(320px, 86vw); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:22px; box-shadow:var(--shadow-lg);
  }
  .modal h4{margin:0 0 14px; font-size:15px; font-family:var(--display-font); font-weight:600; color:var(--text-900); letter-spacing:-.01em;}
  .modal h4 .modal-hint{font-family:var(--ui-font); font-weight:500; font-size:12.5px; color:var(--text-500);}
  .modal p{margin:0 0 18px; font-size:13.5px; color:var(--text-500); line-height:1.55;}
  .modal input[type="text"]{
    width:100%; background:var(--bg-app); border:1px solid var(--line-strong); color:var(--text-900);
    border-radius:var(--r-sm); padding:11px 12px; font-size:14px; margin-bottom:18px; transition:border-color .15s var(--ease);
  }
  .modal input[type="text"]:focus{outline:none; border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-actions .btn{padding:9px 16px;}

  /* ============ READER SCREEN ============ */
  #readerScreen{ background:var(--bg-app); }
  .topbar{
    display:flex; align-items:center; gap:2px;
    padding:8px 8px; padding-top:calc(8px + env(safe-area-inset-top));
    background:var(--surface); border-bottom:1px solid var(--line); z-index:20;
  }
  .icon-btn{
    background:transparent; border:none; color:var(--text-700);
    width:38px; height:38px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    transition:background-color .15s var(--ease), color .15s var(--ease);
  }
  .icon-btn:active{background:var(--bg-sunken);}
  @media (hover:hover) and (pointer:fine){ .icon-btn:hover{background:var(--bg-sunken);} }
  .icon-btn.active{background:var(--accent-wash); color:var(--accent-500);}
  .icon-btn .icon{width:20px; height:20px;}
  .topbar .title{
    flex:1; min-width:0; text-align:center; font-size:13.5px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-900); font-family:var(--display-font); letter-spacing:-.005em;
  }
  .topbar .progress-pct{font-size:12px; color:var(--accent-500); font-variant-numeric:tabular-nums; width:36px; text-align:right; font-weight:600;}
  .topbar .aa-btn{font-family:var(--display-font); font-weight:600; font-size:14px;}

  .read-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--read-bg, var(--bg-app)); scroll-behavior:smooth;}
  .read-inner{
    position:relative; max-width:min(680px, 92vw); margin:0 auto; padding:44px 6px 96px;
    font-family:var(--read-font); font-size:var(--read-size); line-height:1.85; color:var(--read-text, #1d1e21);
  }
  .read-inner h1,.read-inner h2,.read-inner h3{font-weight:700; line-height:1.35; margin:1.4em 0 .6em; color:inherit; letter-spacing:-.01em;}
  .read-inner h1{font-size:1.55em; border-bottom:1px solid currentColor; padding-bottom:.35em; opacity:1;}
  .read-inner h2{font-size:1.28em;}
  .read-inner h3{font-size:1.1em;}
  .read-inner p{margin:0 0 1.1em;}
  .read-inner ul,.read-inner ol{margin:0 0 1.1em; padding-left:1.4em;}
  .read-inner li{margin-bottom:.4em;}
  .read-inner blockquote{margin:0 0 1.1em; padding:.5em 1.1em; border-left:3px solid var(--accent-500); background:rgba(201,122,69,0.08); font-style:italic; border-radius:0 6px 6px 0;}
  .read-inner code{font-family:'SFMono-Regular',Consolas,monospace; font-size:.85em; background:rgba(0,0,0,0.06); padding:.15em .4em; border-radius:5px;}
  .read-inner pre{background:rgba(0,0,0,0.06); padding:16px; border-radius:var(--r-md); overflow-x:auto; margin:0 0 1.2em;}
  .read-inner pre code{background:none; padding:0;}
  .read-inner img{max-width:100%; border-radius:var(--r-sm); display:block; margin:1em auto;}
  .read-inner table{border-collapse:collapse; width:100%; margin:0 0 1.2em; font-size:.92em;}
  .read-inner th,.read-inner td{border:1px solid rgba(0,0,0,0.15); padding:8px 10px; text-align:left;}
  .read-inner hr{border:none; border-top:1px solid rgba(0,0,0,0.15); margin:2em 0;}
  .read-inner a{color:var(--accent-500);}

  /* GFM task lists: marked doesn't add a task-list-item class, so target the
     structural shape (li whose first child is the checkbox) directly and
     drop the bullet that would otherwise sit next to it */
  .read-inner li:has(> input[type="checkbox"]:first-child){list-style:none; margin-left:-1.4em;}
  .read-inner input[type="checkbox"]{width:15px; height:15px; margin-right:7px; accent-color:var(--accent-400); vertical-align:-2px;}

  /* math (KaTeX) */
  .read-inner .katex-display{overflow-x:auto; overflow-y:hidden; padding:.3em 0; margin:0 0 1.2em;}
  .read-inner .katex{font-size:1.05em;}

  /* code syntax highlighting (highlight.js), tuned to the app palette */
  .read-inner pre code.hljs{display:block; overflow-x:auto; background:none; padding:0;}
  .hljs-comment,.hljs-quote{color:var(--text-500); font-style:italic;}
  .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-subst{color:var(--accent-500); font-weight:600;}
  .hljs-string,.hljs-doctag,.hljs-regexp{color:#3b7a57;}
  .hljs-number,.hljs-symbol{color:#7c8fa6;}
  .hljs-title,.hljs-title.function_,.hljs-section,.hljs-selector-id{color:#8b5fbf; font-weight:600;}
  .hljs-type,.hljs-class .hljs-title,.hljs-built_in{color:#b4574e;}
  .hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#a85f30;}
  .hljs-tag{color:var(--text-500);}
  .hljs-name{color:var(--accent-500);}
  .hljs-meta{color:var(--text-400);}
  .hljs-deletion{background:rgba(219,124,114,.15);}
  .hljs-addition{background:rgba(143,203,138,.18);}
  .hljs-emphasis{font-style:italic;}
  .hljs-strong{font-weight:700;}
  [data-theme="night"] .hljs-comment,[data-theme="night"] .hljs-quote{color:#8b93a1;}
  [data-theme="night"] .hljs-keyword,[data-theme="night"] .hljs-selector-tag,[data-theme="night"] .hljs-literal{color:var(--accent-300);}
  [data-theme="night"] .hljs-string,[data-theme="night"] .hljs-doctag{color:#8fcb8a;}
  [data-theme="night"] .hljs-number{color:#8fb6e3;}
  [data-theme="night"] .hljs-title,[data-theme="night"] .hljs-title.function_{color:#c9a3e8;}
  [data-theme="night"] .hljs-type,[data-theme="night"] .hljs-built_in{color:#ee9dbb;}

  .ink-canvas{position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; z-index:5;}
  .ink-canvas.inactive{pointer-events:none;}
  .ink-canvas.highlight-layer{z-index:4; pointer-events:none; mix-blend-mode:multiply;}
  .ink-cursor{position:fixed; top:0; left:0; pointer-events:none; border-radius:50%; transform:translate(-50%,-50%); z-index:200; display:none; box-sizing:border-box;}

  [data-theme="light"] .read-scroll{ --read-bg:#faf9f6; --read-text:#1d1e21; }
  [data-theme="sepia"] .read-scroll{ --read-bg:#f1e6d3; --read-text:#3b3226; }
  [data-theme="night"] .read-scroll{ --read-bg:#111318; --read-text:#e6e6e2; }
  [data-theme="night"] .read-inner code, [data-theme="night"] .read-inner pre{background:rgba(255,255,255,0.08);}
  [data-theme="night"] .read-inner blockquote{background:rgba(227,165,118,0.12);}
  [data-theme="night"] .read-inner th,[data-theme="night"] .read-inner td{border-color:rgba(255,255,255,0.15);}
  [data-theme="night"] .read-inner hr{border-color:rgba(255,255,255,0.15);}

  .chapternav{
    display:flex; align-items:center; gap:10px; padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--surface); border-top:1px solid var(--line); z-index:20;
  }
  .navbtn{flex:0 0 auto; background:var(--bg-sunken); color:var(--text-700); border:none; border-radius:var(--r-sm); padding:9px 15px; font-size:13px; font-weight:600; transition:background-color .15s var(--ease);}
  .navbtn:disabled{opacity:.4;}
  .navbtn:active:not(:disabled){background:var(--bg-sunken-2);}
  @media (hover:hover) and (pointer:fine){ .navbtn:not(:disabled):hover{background:var(--bg-sunken-2);} }
  .chapter-indicator{flex:1; text-align:center; font-size:12px; color:var(--text-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}

  .ribbon-track{position:absolute; top:0; right:0; width:12px; height:100%; background:var(--bg-sunken-2); z-index:15; pointer-events:none;}
  .ribbon-fill{
    position:absolute; top:0; left:0; width:100%; height:0%;
    background:linear-gradient(180deg, var(--accent-300), var(--accent-500));
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px));
    transition:height .3s var(--ease);
    box-shadow:0 0 12px rgba(168,95,48,.35);
  }

  .reader-body{display:flex; flex:1; min-height:0; position:relative;}
  .reader-main{flex:1; min-width:0; display:flex; flex-direction:column; position:relative;}

  .drawer{
    position:absolute; top:0; left:0; height:100%; width:min(300px, 82vw);
    background:var(--surface); z-index:55; transform:translateX(-100%); transition:transform .28s var(--ease);
    box-shadow:2px 0 30px rgba(63,58,52,0.18); border-right:1px solid var(--line); overflow:hidden;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-inner{display:flex; flex-direction:column; height:100%; width:100%;}
  .drawer-resize-handle{display:none;}
  .drawer-head{padding:20px 18px 14px; border-bottom:1px solid var(--line);}
  .drawer-head .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-400); font-weight:600;}
  .drawer-head .book-title{font-family:var(--display-font); font-weight:600; font-size:17px; margin-top:5px; color:var(--text-900); letter-spacing:-.01em;}
  .toc-list{flex:1; overflow-y:auto; padding:8px;}
  .toc-item{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:transparent; border:none; color:var(--text-700); padding:11px 10px; border-radius:var(--r-sm); font-size:14px; border-left:2px solid transparent; transition:background-color .15s var(--ease), border-color .15s var(--ease);}
  .toc-item .n{color:var(--text-400); font-size:11.5px; font-variant-numeric:tabular-nums; flex:0 0 20px;}
  .toc-item .toc-title{flex:1; min-width:0;}
  .toc-item .toc-ink-dot{width:6px; height:6px; border-radius:50%; background:var(--accent-400); flex:0 0 auto; align-self:center; margin-left:2px;}
  .toc-item.active{background:var(--accent-wash); color:var(--accent-500); border-left-color:var(--accent-400);}
  @media (hover:hover) and (pointer:fine){ .toc-item:not(.active):hover{background:var(--bg-sunken);} }

  .pop{
    position:absolute; top:8px; right:10px; z-index:55;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; width:226px;
    box-shadow:var(--shadow-lg); opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:all .15s var(--ease);
  }
  .pop.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .pop h5{margin:0 0 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-400); font-weight:600;}
  .font-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .font-row button{width:34px; height:34px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--bg-sunken); color:var(--text-700); font-size:16px; font-weight:700; transition:background-color .15s var(--ease);}
  .font-row button:active{background:var(--bg-sunken-2);}
  @media (hover:hover) and (pointer:fine){ .font-row button:hover{background:var(--bg-sunken-2); border-color:var(--text-400);} }
  .font-row .val{font-size:13px; color:var(--text-900); font-variant-numeric:tabular-nums; font-weight:600;}
  .theme-row{display:flex; gap:6px;}
  .theme-swatch{position:relative; flex:1; height:44px; border-radius:var(--r-sm); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; transition:border-color .15s var(--ease);}
  .theme-swatch.active{border-color:var(--accent-400); box-shadow:0 0 0 3px var(--accent-wash);}
  .sw-light{background:#faf9f6; color:#1d1e21;}
  .sw-sepia{background:#f1e6d3; color:#3b3226;}
  .sw-night{background:#131418; color:#e6e6e2;}
  .sw-custom{background:var(--sw-custom-bg, #faf9f6); color:var(--sw-custom-text, #1d1e21);}
  .custom-theme-row{display:flex; gap:18px; margin-top:12px;}
  .color-pick-label{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-500); font-weight:600;}
  .color-pick-label input[type="color"]{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--line-strong); padding:0; background:none; cursor:pointer;
  }
  .color-pick-label input[type="color"]::-webkit-color-swatch-wrapper{padding:2px;}
  .color-pick-label input[type="color"]::-webkit-color-swatch{border:none; border-radius:5px;}

  .ink-pop{left:10px; right:auto;}
  .ink-row{display:flex; align-items:center; gap:9px; margin-bottom:18px; flex-wrap:wrap;}
  .ink-swatch{width:30px; height:30px; border-radius:50%; border:2px solid transparent; background:var(--sw); position:relative; flex:0 0 auto; padding:0;}
  .ink-swatch.active{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text-700);}
  .ink-swatch.ink-eraser{background:var(--bg-sunken); color:var(--text-500); display:flex; align-items:center; justify-content:center; border-color:var(--line-strong);}
  .ink-swatch.ink-eraser .icon{width:15px; height:15px;}
  .ink-swatch.ink-eraser.active{background:var(--bg-sunken-2); color:var(--text-900); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text-700);}
  .ink-swatch.ink-highlighter{width:34px; height:22px; border-radius:6px;}
  .ink-swatch.ink-highlighter.active{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--text-700);}
  .ink-size-row{display:flex; gap:8px; margin-bottom:18px;}
  .ink-size-btn{flex:1; height:34px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); color:var(--text-500); font-size:14px; display:flex; align-items:center; justify-content:center; transition:all .15s var(--ease);}
  .ink-size-btn .dot{border-radius:50%; background:currentColor;}
  .ink-actions-row{display:flex; gap:8px;}
  .ink-actions-row .btn{flex:1; justify-content:center; padding:9px 10px; font-size:12.5px;}
  .ink-actions-row .btn .icon{width:15px; height:15px;}
  .ink-actions-row .btn:disabled{opacity:.4; pointer-events:none;}
  .ink-size-btn.active{border-color:var(--accent-400); color:var(--accent-500); background:var(--accent-wash);}
  .ink-clear-btn{width:100%; justify-content:center; margin-top:8px;}

  /* ============ EDITOR SCREEN ============ */
  #editorScreen{background:var(--bg-app);}
  .editor-title-input{
    flex:0 1 340px; min-width:0; background:transparent; border:none; color:var(--text-900);
    font-size:14px; font-weight:600; font-family:var(--display-font); padding:8px 10px; border-radius:var(--r-sm);
    transition:background-color .15s var(--ease);
  }
  .editor-title-input:focus{outline:none; background:var(--bg-sunken);}
  .editor-title-input::placeholder{color:var(--text-400); font-weight:500;}
  .editor-body{flex:1; min-height:0; display:flex; position:relative;}
  .editor-textarea{
    flex:1; width:100%; height:100%; border:none; resize:none; background:var(--bg-app); color:var(--text-900);
    padding:24px; font-family:'SFMono-Regular',Consolas,monospace; font-size:14px; line-height:1.7;
  }
  .editor-textarea:focus{outline:none;}
  .editor-textarea::placeholder{color:var(--text-400);}
  #editorPreviewScroll{flex:1; height:100%;}

  /* tablet / desktop: two-column library */
  @media (min-width:720px){
    .lib-body{flex-direction:row;}
    .folder-rail{
      flex-direction:column; width:240px; border-bottom:none; border-right:1px solid var(--line);
      padding:20px 14px; gap:14px;
    }
    .rail-row{flex-direction:column; overflow-x:visible; white-space:normal;}
    .rail-crumbs{flex-wrap:wrap; overflow-x:visible; white-space:normal;}
    .folder-chip{justify-content:flex-start; border-radius:var(--r-sm);}
    .lib-main{padding:26px 34px 100px;}
    .lib-search-bar{flex-direction:row; align-items:center; padding:12px 20px;}
    .search-row{flex:1;}
    .controls-row{flex:0 0 auto;}
    .sort-select{flex:0 0 auto;}

    /* tablet/desktop library cards get a little more breathing room */
    .file-card{padding:16px;}
    .file-card .doc-icon{width:42px; height:42px; border-radius:var(--r-md);}
    .file-card .name{font-size:15.5px;}

    /* reader: TOC becomes a persistent, collapsible side panel instead of a
       full-screen overlay drawer — width animates so opening/closing reads
       as a natural slide rather than a snap. drawer-inner keeps a fixed
       width so its content doesn't reflow mid-transition, just reveals. */
    .drawer{
      position:relative; top:auto; left:auto; height:auto; width:0;
      transform:none; flex:0 0 auto; box-shadow:none;
      transition:width .32s var(--ease);
    }
    .drawer.show{width:300px;}
    .drawer-inner{width:300px;}
    /* mouse-draggable divider on the panel's own right edge — laptops have
       no swipe gesture, so dragging this line is the equivalent of the
       touch drag on phones/tablets. Only shown once the panel is actually
       open (width:300px); while closed the drawer's overflow:hidden clips
       it anyway, and reopening happens via the toc button instead. */
    .drawer-resize-handle{
      display:block; position:absolute; top:0; right:0; bottom:0; width:8px;
      cursor:col-resize; z-index:2; background:transparent;
      transition:background-color .15s var(--ease);
    }
    .drawer-resize-handle:hover, .drawer-resize-handle.dragging{ background:var(--accent-wash); }

    /* settings/ink toolbars sit at the top of the reading column (not the
       whole screen) now that the TOC can occupy the left edge, and get
       roomier touch targets for stylus/finger use */
    .read-inner{padding-top:52px; max-width:min(720px, 88vw);}
    .pop{width:288px; padding:22px;}
    .ink-row{gap:12px;}
    .ink-swatch{width:38px; height:38px;}
    .ink-swatch.ink-highlighter{width:46px; height:28px;}
    .ink-size-btn{height:40px;}
    .font-row button{width:38px; height:38px;}
    .theme-swatch{height:52px;}
  }
  @media (min-width:960px){
    .lib-main{padding:28px 40px 100px;}
    .file-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:var(--sp-3);}
    .file-grid.compact{grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ LIBRARY SCREEN ============ -->
  <section id="libraryScreen" class="screen">
    <div class="lib-topbar">
      <div class="lib-brand">Study Shelf</div>
      <div class="lib-spacer"></div>
      <button class="btn btn-ghost" id="newFolderBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>
        <span class="btn-label">새 폴더</span>
      </button>
      <button class="btn btn-ghost" id="newFileBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9.5 14.5h5M12 12v5"/></svg>
        <span class="btn-label">새 파일</span>
      </button>
      <button class="btn btn-primary" id="uploadBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 8l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span class="btn-label">파일 업로드</span>
      </button>
      <div class="lib-account" id="railAccount"></div>
    </div>

    <div class="lib-search-bar">
      <div class="search-row">
        <div class="search-field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="제목으로 검색" autocomplete="off">
          <button class="search-clear hidden" id="searchClear" aria-label="검색어 지우기">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------------- storage: IndexedDB-backed key/value store ----------------
     Keeps the same logical shape as before (folder metadata, file metadata
     with reading progress, and raw file-content text keyed by id) so the rest
     of the app can keep calling S.getJSON/setJSON/getText/setText/del. */
  const DB_NAME = "seojae-db";
  const DB_VERSION = 1;
  const STORE = "kv";
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = ()=>{
        if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  function idbGet(key){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(key);
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }));
  }
  function idbSet(key, value){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(value, key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    }));
  }
  function idbDel(key){
    return openDB().then(db => new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = ()=> resolve();
      tx.onerror = ()=> reject(tx.error);
    }));
  }

  const S = {
    async getJSON(key, fallback){
      try{ const v = await idbGet(key); return v===undefined ? fallback : v; }catch(e){ return fallback; }
    },
    async setJSON(key, val){ try{ await idbSet(key, val); }catch(e){} },
    async getText(key){
      try{ const v = await idbGet(key); return v===undefined ? null : v; }catch(e){ return null; }
    },
    async setText(key, val){ try{ await idbSet(key, val); }catch(e){} },
    async del(key){ try{ await idbDel(key); }catch(e){} }
  };
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const escapeHtml = (s) => String(s).replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));

  /* ---------------- library state ---------------- */
  let folders = [];   // [{id, name, parentId}]  parentId=null -> root-level folder
  let files = [];     // [{id, name, title, folderId, chapterCount, createdTs, updatedTs, progress:{chapterIdx,fontSize,theme}}]
  let libView = "browse"; // 'browse' | 'all' | 'uncategorized'
  let folderPath = [];    // folder id trail for the drill-down view; [] = library root
  let expandedFolders = new Set(); // tablet/desktop tree view: which folder ids are expanded
  let searchQuery = "";   // when non-empty, overrides libView with a flat title search
  let sortMode = "recent"; // 'recent' | 'name' | 'added' | 'progress'
  let density = "comfortable"; // 'comfortable' | 'compact'
  let customBg = "#faf9f6";   // reader "직접" theme colors — global, shared across books
  let customText = "#1d1e21";

  // IndexedDB's initial open+read is async, so a file dropped/uploaded in the
  // first instant after page load could otherwise race loadLibrary()'s
  // reassignment of `files` and get silently overwritten. Anything that
  // pushes into `files`/`folders` awaits this first.
  let markLibraryReady;
  const libraryReady = new Promise(resolve => { markLibraryReady = resolve; });

  async function loadLibrary(){
    folders = await S.getJSON("app:folders", []);
    files = await S.getJSON("app:files", []);
  }
  async function persistFolders(){ await S.setJSON("app:folders", folders); scheduleSync(); }
  async function persistFiles(){ await S.setJSON("app:files", files); scheduleSync(); }

  async function loadPrefs(){
    const prefs = await S.getJSON("app:prefs", {});
    sortMode = prefs.sortMode || "recent";
    density = prefs.density || "comfortable";
    customBg = prefs.customBg || "#faf9f6";
    customText = prefs.customText || "#1d1e21";
    prefsUpdatedTs = prefs.updatedTs || 0;
  }
  async function persistPrefs(){
    prefsUpdatedTs = Date.now();
    await S.setJSON("app:prefs", {sortMode, density, customBg, customText, updatedTs: prefsUpdatedTs});
    scheduleSync();
  }

  /* ---------------- cloud sync (Firebase) ----------------
     Optional enhancement layered on top of the local-first IndexedDB store:
     if Firebase fails to load (offline, blocked, etc.) the app just runs in
     local-only mode, same as before this feature existed. Firestore layout,
     all scoped under users/{uid}/:
       library/main    -> { folders, files, updatedAt }
       library/deleted -> { ids: { [fileId]: deletedAtMs } }  (tombstones)
       prefs/main       -> { sortMode, density, customBg, customText, updatedTs }
       content/{fileId} -> { text, updatedAt }
       ink/{fileId}_{chapterIdx} -> { strokes, updatedAt }
     Merge rule for files/folders: union by id, higher updatedTs wins;
     tombstones in library/deleted suppress resurrection of files deleted on
     another device. */
  const firebaseConfig = {
    apiKey: "AIzaSyB6wHcqUil-hvoQAuD-XcDUFETYeP0AXwM",
    authDomain: "study-shelf-f3e2b.firebaseapp.com",
    projectId: "study-shelf-f3e2b",
    storageBucket: "study-shelf-f3e2b.firebasestorage.app",
    messagingSenderId: "777592814595",
    appId: "1:777592814595:web:2528d75d24b7a3ed3d2236"
  };
  const FB_SDK = "https://www.gstatic.com/firebasejs/12.16.0/";
  let fb = null; // { auth, db, authMod, fsMod, currentUser } once loaded; null if unavailable
  let prefsUpdatedTs = 0;
  let syncDebounceTimer = null;
  let syncInFlight = false;

  let lastAuthError = null; // surfaced in the account rail so sign-in failures aren't silent

  function authDebug(msg){
    console.log("[auth]", msg);
  }

  // Firebase's own auth state takes a moment to load/restore on every fresh
  // page load, so rendering the "로그인" button first (the honest state of
  // `fb` at that instant) then swapping to the signed-in avatar once
  // onAuthStateChanged catches up produces a visible flash on every refresh
  // or reopen. Cache the last-known signed-in user's display info so the
  // signed-in-looking UI can render immediately, before Firebase has even
  // loaded, and be reconciled (or reverted) once the real state is known.
  let cachedAuthUser = null;
  try{ cachedAuthUser = JSON.parse(localStorage.getItem("lastAuthUser") || "null"); }catch(e){}
  function cacheAuthUser(u){
    try{
      if(u) localStorage.setItem("lastAuthUser", JSON.stringify({ displayName: u.displayName, email: u.email, photoURL: u.photoURL }));
      else localStorage.removeItem("lastAuthUser");
    }catch(e){}
  }

  // True only once the *real* onAuthStateChanged has fired. `fb` itself
  // turns non-null earlier than that (as soon as the SDK loads, with
  // currentUser initialized to a null placeholder) — using `fb` alone to
  // decide "resolved vs. still pending" was flashing the sign-in button
  // during that gap, exactly the bug this whole cache was meant to avoid.
  let authResolved = false;
  let firebaseLoadingPromise = null;
  async function ensureFirebase(){
    if(fb) return fb;
    if(firebaseLoadingPromise) return firebaseLoadingPromise;
    firebaseLoadingPromise = (async ()=>{
      try{
        const [appMod, authMod, fsMod] = await Promise.all([
          import(FB_SDK + "firebase-app.js"),
          import(FB_SDK + "firebase-auth.js"),
          import(FB_SDK + "firebase-firestore.js"),
        ]);
        const app = appMod.initializeApp(firebaseConfig);
        const auth = authMod.getAuth(app);
        const db = fsMod.getFirestore(app);
        fb = { app, auth, db, authMod, fsMod, currentUser: null };
        try{
          await authMod.setPersistence(auth, authMod.browserLocalPersistence);
        }catch(e){ authDebug("지속성 설정 실패: "+e); }
        authMod.onAuthStateChanged(auth, (user)=>{
          fb.currentUser = user;
          authResolved = true;
          cacheAuthUser(user);
          renderAccount();
          if(user) syncNow();
        });
        return fb;
      }catch(e){
        authDebug("Firebase 로드 자체 실패: "+e);
        return null;
      }
    })();
    return firebaseLoadingPromise;
  }

  // --- Google Identity Services (GIS) sign-in -----------------------------
  // Firebase's own signInWithRedirect (used previously for mobile) sends the
  // whole page away to accounts.google.com and back, relying on an
  // IndexedDB marker surviving that multi-origin round trip to resume the
  // sign-in on return. That never completed reliably on mobile (confirmed
  // on both Samsung Internet and Chrome). GIS's token client instead opens
  // its own popup and hands the access token back via a JS callback — the
  // page itself never navigates away, so there's nothing that needs to
  // survive a round trip. Same code path works for desktop and mobile.
  const GOOGLE_CLIENT_ID = "777592814595-ngj3pemkrukeh95csua9ev0hdam5ip09.apps.googleusercontent.com";
  let gisTokenClient = null;
  let gisLoadingPromise = null;

  function loadGisScript(){
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if(gisLoadingPromise) return gisLoadingPromise;
    gisLoadingPromise = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://accounts.google.com/gsi/client";
      s.async = true;
      s.onload = ()=> resolve();
      s.onerror = ()=> reject(new Error("GIS 스크립트 로드 실패"));
      document.head.appendChild(s);
    });
    return gisLoadingPromise;
  }

  // Loaded proactively at startup (not on click) so that by the time the
  // user actually taps the button, requestAccessToken() below runs
  // synchronously in direct response to that tap — some mobile browsers
  // block the popup if it's opened after an `await`, since it no longer
  // looks like a direct continuation of the user gesture.
  async function prepareGis(){
    try{
      await loadGisScript();
      if(!gisTokenClient){
        gisTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: "openid email profile",
          callback: onGisToken,
          error_callback: (err)=>{ authDebug("GIS 팝업 에러: "+(err && (err.type||err.message) || err)); },
        });
      }
    }catch(e){
      authDebug("GIS 준비 실패: "+e);
    }
  }

  async function onGisToken(resp){
    if(!resp || resp.error){ authDebug("GIS 토큰 에러: "+(resp && resp.error)); return; }
    authDebug("액세스 토큰 수신, Firebase 로그인 중...");
    const inst = await ensureFirebase();
    if(!inst){ authDebug("Firebase 미준비로 로그인 중단"); return; }
    try{
      const credential = inst.authMod.GoogleAuthProvider.credential(null, resp.access_token);
      await inst.authMod.signInWithCredential(inst.auth, credential);
      lastAuthError = null;
      authDebug("Firebase 로그인 성공");
    }catch(e){
      authDebug("signInWithCredential 실패: "+((e&&e.code)||e));
      lastAuthError = (e && e.code) || String(e);
      renderAccount();
    }
  }

  async function signInWithGoogle(){
    authDebug("로그인 버튼 클릭");
    if(!gisTokenClient) await prepareGis();
    if(!gisTokenClient){ alert("로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요."); return; }
    gisTokenClient.requestAccessToken();
  }
  async function signOutOfCloud(){
    if(!fb) return;
    await fb.authMod.signOut(fb.auth);
  }

  function setSyncStatus(state){
    const label = state==="syncing" ? "동기화 중" : state==="error" ? "동기화 실패" : state==="synced" ? "동기화됨" : "";
    const dotEl = document.querySelector(".account-sync-dot");
    if(dotEl){
      dotEl.className = "account-sync-dot" + (state ? " " + state : "");
      dotEl.title = label;
    }
  }

  function renderAccount(){
    const el = $("railAccount");
    if(!el) return;
    // Confirmed by Firebase (fb loaded and reported a real user) vs. an
    // optimistic guess from last session (fb not loaded/decided yet, but we
    // remember who was signed in) — the optimistic case shows the same
    // avatar UI so there's nothing to flash away from, just a "연결 중"
    // status until the real state arrives and either confirms or reverts it.
    const confirmed = authResolved && fb && fb.currentUser;
    const pending = !authResolved && cachedAuthUser;
    if(!confirmed && !pending){
      el.innerHTML =
        '<button class="account-signin-btn" id="signInBtn" title="'+(lastAuthError ? "로그인 실패: "+escapeHtml(lastAuthError) : "Google로 로그인")+'">'+
          '<svg class="icon" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.2 14.7 2.2 12 2.2 6.9 2.2 2.8 6.4 2.8 11.6S6.9 21 12 21c6.9 0 8.9-4.9 8.9-8.9 0-.6-.1-1.1-.2-1.6H12z"/></svg>'+
        '</button>'+
        (lastAuthError ? '<span class="account-error-dot"></span>' : '');
      $("signInBtn").addEventListener("click", signInWithGoogle);

  function scheduleSync(){
    if(!fb || !fb.currentUser) return;
    clearTimeout(syncDebounceTimer);
    syncDebounceTimer = setTimeout(syncNow, 4000);
  }

  async function pushFileToCloud(uid, f){
    const { doc, setDoc } = fb.fsMod;
    const text = await S.getText("file-content:"+f.id);
    if(text != null) await setDoc(doc(fb.db, "users", uid, "content", f.id), { text, updatedAt: f.updatedTs });
    for(const idx of (f.inkChapters||[])){
      const strokes = await S.getJSON("ink:"+f.id+":"+idx, []);
      await setDoc(doc(fb.db, "users", uid, "ink", f.id+"_"+idx), { strokes, updatedAt: f.updatedTs });
    }
  }
  async function pullFileFromCloud(uid, f){
    const { doc, getDoc } = fb.fsMod;
    const snap = await getDoc(doc(fb.db, "users", uid, "content", f.id));
    if(snap.exists()) await S.setText("file-content:"+f.id, snap.data().text);
    for(const idx of (f.inkChapters||[])){
      const inkSnap = await getDoc(doc(fb.db, "users", uid, "ink", f.id+"_"+idx));
      if(inkSnap.exists()) await S.setJSON("ink:"+f.id+":"+idx, inkSnap.data().strokes);
    }
  }
  async function deleteFileFromCloud(uid, f){
    const { doc, deleteDoc, getDoc, setDoc } = fb.fsMod;
    try{
      await deleteDoc(doc(fb.db, "users", uid, "content", f.id));
      for(const idx of (f.inkChapters||[])) await deleteDoc(doc(fb.db, "users", uid, "ink", f.id+"_"+idx));
      const delRef = doc(fb.db, "users", uid, "library", "deleted");
      const snap = await getDoc(delRef);
      const ids = snap.exists() ? (snap.data().ids||{}) : {};
      ids[f.id] = Date.now();
      await setDoc(delRef, { ids });
    }catch(e){ console.warn("cloud delete failed", e); }
  }

  async function syncNow(){
    if(!fb || !fb.currentUser || syncInFlight) return;
    syncInFlight = true;
    setSyncStatus("syncing");
    try{
      const uid = fb.currentUser.uid;
      const { doc, getDoc, setDoc } = fb.fsMod;
      const libRef = doc(fb.db, "users", uid, "library", "main");
      const libSnap = await getDoc(libRef);
      const cloud = libSnap.exists() ? libSnap.data() : { folders: [], files: [], updatedAt: 0 };
      const cloudFiles = cloud.files || [];
      const cloudFolders = cloud.folders || [];

      const delSnap = await getDoc(doc(fb.db, "users", uid, "library", "deleted"));
      const deletedMap = delSnap.exists() ? (delSnap.data().ids||{}) : {};

      // folders: union by id (no rename/delete feature yet, so no conflicts to resolve)
      const folderMap = new Map();
      folders.forEach(f=> folderMap.set(f.id, f));
      cloudFolders.forEach(f=> { if(!folderMap.has(f.id)) folderMap.set(f.id, f); });
      const mergedFolders = Array.from(folderMap.values());

      // files: newer updatedTs wins per id; union of ids from both sides
      const localById = new Map(files.map(f=>[f.id, f]));
      const cloudById = new Map(cloudFiles.map(f=>[f.id, f]));
      const allIds = new Set([...localById.keys(), ...cloudById.keys()]);
      const toPush = [], toPull = [];
      let mergedFiles = [];
      for(const id of allIds){
        const l = localById.get(id), c = cloudById.get(id);
        let winner;
        if(l && !c){ winner = l; toPush.push(l); }
        else if(c && !l){ winner = c; toPull.push(c); }
        else if(l.updatedTs >= c.updatedTs){ winner = l; if(l.updatedTs > c.updatedTs) toPush.push(l); }
        else { winner = c; toPull.push(c); }
        mergedFiles.push(winner);
      }

      // tombstones: drop files deleted (on any device) after their last edit
      const purged = [];
      mergedFiles = mergedFiles.filter(f=>{
        const delAt = deletedMap[f.id];
        if(delAt && delAt >= f.updatedTs){ purged.push(f); return false; }
        return true;
      });
      for(const f of purged){
        await S.del("file-content:"+f.id);
        for(const idx of (f.inkChapters||[])) await S.del("ink:"+f.id+":"+idx);
      }

      folders = mergedFolders;
      files = mergedFiles;
      await S.setJSON("app:folders", folders);
      await S.setJSON("app:files", files);

      for(const f of toPull) if(!purged.includes(f)) await pullFileFromCloud(uid, f);
      for(const f of toPush) if(!purged.includes(f)) await pushFileToCloud(uid, f);

      await setDoc(libRef, { folders: mergedFolders, files: mergedFiles, updatedAt: Date.now() });

      // prefs: last-writer-wins by timestamp
      const prefsRef = doc(fb.db, "users", uid, "prefs", "main");
      const prefsSnap = await getDoc(prefsRef);
      const cloudPrefs = prefsSnap.exists() ? prefsSnap.data() : null;
      if(cloudPrefs && (cloudPrefs.updatedTs||0) > prefsUpdatedTs){
        sortMode = cloudPrefs.sortMode || sortMode;
        density = cloudPrefs.density || density;
        customBg = cloudPrefs.customBg || customBg;
        customText = cloudPrefs.customText || customText;
        prefsUpdatedTs = cloudPrefs.updatedTs;
        await S.setJSON("app:prefs", {sortMode, density, customBg, customText, updatedTs: prefsUpdatedTs});
        sortSelect.value = sortMode;
        updateDensityButtons();
      } else {
        await setDoc(prefsRef, {sortMode, density, customBg, customText, updatedTs: prefsUpdatedTs});
      }

      renderAll();
      setSyncStatus("synced");
    }catch(e){
      console.warn("sync failed", e);
      setSyncStatus("error");
    }finally{
      syncInFlight = false;
    }
  }

  function sortFiles(arr){
    const a = arr.slice();
    if(sortMode==="name") return a.sort((x,y)=> x.title.localeCompare(y.title, "ko"));
    if(sortMode==="added") return a.sort((x,y)=> (y.createdTs||y.updatedTs) - (x.createdTs||x.updatedTs));
    if(sortMode==="progress") return a.sort((x,y)=> (((y.progress&&y.progress.pct)||0)) - (((x.progress&&x.progress.pct)||0)));
    return a.sort((x,y)=> y.updatedTs - x.updatedTs); // 'recent'
  }

    $("overlay").classList.remove("show");

  /* ---------------- folder tree helpers ---------------- */
  function currentParentId(){ return folderPath.length ? folderPath[folderPath.length-1] : null; }
  function folderById(id){ return folders.find(f=>f.id===id); }
  function childFolders(parentId){ return folders.filter(f=>(f.parentId||null)===(parentId||null)); }
  function descendantFolderIds(id){
    const out=[id];
    childFolders(id).forEach(c=> out.push(...descendantFolderIds(c.id)));
    return out;
  }
  function folderFileCount(id){
    const ids = new Set(descendantFolderIds(id));
    return files.filter(f=> f.folderId && ids.has(f.folderId)).length;
  }
  function folderPathLabel(id){
    const parts=[];
    let cur = folderById(id);
    while(cur){ parts.unshift(cur.name); cur = cur.parentId ? folderById(cur.parentId) : null; }
    return parts.join(" › ");
  }
  function folderAncestorPath(id){
    const path=[];
    let cur = folderById(id);
    while(cur){ path.unshift(cur.id); cur = cur.parentId ? folderById(cur.parentId) : null; }
    return path;
  }
  function moveFileToFolder(f, folderId){
    f.folderId = folderId || null;
    f.updatedTs = Date.now();
    persistFiles();
  }
  function moveFolderToParent(folderId, newParentId){
    const fo = folderById(folderId);
    if(!fo || folderId === newParentId) return;
    if(newParentId && descendantFolderIds(folderId).includes(newParentId)) return; // no cycles
    fo.parentId = newParentId || null;
    persistFolders();
  }
  // shared drop handler for both the tree and the 미분류 chip — reads
  // whichever payload type dragstart attached (see file-card / tree-item
  // dragstart handlers) and routes to the matching move function
  function handleTreeDrop(e, targetFolderId){
    const fileId = e.dataTransfer.getData("application/x-ss-file");
    const folderId = e.dataTransfer.getData("application/x-ss-folder");
    if(fileId){
      const f = files.find(x=>x.id===fileId);
      if(f) moveFileToFolder(f, targetFolderId);
    } else if(folderId){
      moveFolderToParent(folderId, targetFolderId);
    }
    if(targetFolderId) expandedFolders.add(targetFolderId); // reveal what just landed there
    renderAll();
  }

  /* ---------------- folder rail ---------------- */
  function renderFolderRail(){
    const rail = $("railDynamic");
    rail.innerHTML = "";

    const pinned = document.createElement("div");
    pinned.className = "rail-row";
    const all = document.createElement("button");
    all.className = "folder-chip" + (libView==="all" ? " active":"");
    all.innerHTML = "전체 <span class=\"count\">"+files.length+"</span>";
    all.addEventListener("click", ()=>{ resetSearch(); libView="all"; renderAll(); });
    pinned.appendChild(all);

    const uncatCount = files.filter(f=>!f.folderId).length;
    const uncat = document.createElement("button");
    uncat.className = "folder-chip" + (libView==="uncategorized" ? " active":"");
    uncat.innerHTML = "미분류 <span class=\"count\">"+uncatCount+"</span>";
    uncat.addEventListener("click", ()=>{ resetSearch(); libView="uncategorized"; renderAll(); });
    uncat.addEventListener("dragover", (e)=>{ e.preventDefault(); uncat.classList.add("drag-over"); });
    uncat.addEventListener("dragleave", ()=> uncat.classList.remove("drag-over"));
    uncat.addEventListener("drop", (e)=>{ e.preventDefault(); uncat.classList.remove("drag-over"); handleTreeDrop(e, null); });
    pinned.appendChild(uncat);

    const add = document.createElement("button");
    add.className = "folder-chip new";
    add.textContent = "+ 폴더";
    add.addEventListener("click", ()=> openNewFolderModal());
    pinned.appendChild(add);
    rail.appendChild(pinned);

    if(searchQuery.trim()){
      const note = document.createElement("div");
      note.className = "rail-crumbs";
      const label = document.createElement("span");
      label.className = "crumb-item active";
      label.textContent = "검색 결과";
      note.appendChild(label);
      rail.appendChild(note);
      return;
    }

    // Tablet/desktop: the rail is a tall sidebar, so show the whole folder
    // hierarchy as an expandable tree (with drag-and-drop to reorganize).
    // Phones: the rail is a horizontal chip strip, which a nested/indented
    // tree doesn't suit — keep the existing one-level-at-a-time breadcrumb
    // drill-down there instead.
    if(isTabletUp()){
      rail.appendChild(renderFolderTree());
      return;
    }

    // Breadcrumb + subfolder chips stay visible no matter which pinned filter
    // (전체/미분류) is active, so switching to a flat filter never strands you
    // without a way back into the folder tree — clicking any of them jumps
    // straight back into 'browse' mode at that location.
    const crumbs = document.createElement("div");
    crumbs.className = "rail-crumbs";
    const home = document.createElement("button");
    home.className = "crumb-item" + (libView==="browse" && folderPath.length===0 ? " active" : "");
    home.textContent = "서재";
    home.addEventListener("click", ()=>{ libView="browse"; folderPath=[]; renderAll(); });
    crumbs.appendChild(home);
    folderPath.forEach((fid, i)=>{
      const sep = document.createElement("span");
      sep.className = "crumb-sep";
      sep.textContent = "›";
      crumbs.appendChild(sep);
      const seg = document.createElement("button");
      seg.className = "crumb-item" + (libView==="browse" && i===folderPath.length-1 ? " active" : "");
      const fo = folderById(fid);
      seg.textContent = fo ? fo.name : "?";
      seg.addEventListener("click", ()=>{ libView="browse"; folderPath = folderPath.slice(0, i+1); renderAll(); });
      crumbs.appendChild(seg);
    });
    rail.appendChild(crumbs);

    const kids = childFolders(currentParentId());
    if(kids.length){
      const kidsRow = document.createElement("div");
      kidsRow.className = "rail-row";
      kids.forEach(fo=>{
        const chip = document.createElement("button");
        chip.className = "folder-chip";
        chip.innerHTML = escapeHtml(fo.name) + " <span class=\"count\">"+folderFileCount(fo.id)+"</span>";
        chip.addEventListener("click", ()=>{ libView="browse"; folderPath = [...folderPath, fo.id]; renderAll(); });
        kidsRow.appendChild(chip);
      });
      rail.appendChild(kidsRow);
    }
  }

  /* ---------------- folder tree (tablet/desktop) ---------------- */
  function renderFolderTree(){
    const container = document.createElement("div");
    container.className = "folder-tree";

    const rootRow = document.createElement("button");
    rootRow.className = "tree-item" + (libView==="browse" && folderPath.length===0 ? " active" : "");
    rootRow.innerHTML = '<span class="tree-caret empty"></span><span class="tree-name">서재</span>';
    rootRow.addEventListener("click", ()=>{ libView="browse"; folderPath=[]; renderAll(); });
    rootRow.addEventListener("dragover", (e)=>{ e.preventDefault(); rootRow.classList.add("drag-over"); });
    rootRow.addEventListener("dragleave", ()=> rootRow.classList.remove("drag-over"));
    rootRow.addEventListener("drop", (e)=>{ e.preventDefault(); rootRow.classList.remove("drag-over"); handleTreeDrop(e, null); });
    container.appendChild(rootRow);

    childFolders(null).forEach(fo => container.appendChild(renderFolderTreeNode(fo, 1)));
    return container;
  }

  function renderFolderTreeNode(fo, depth){
    const wrap = document.createElement("div");
    const kids = childFolders(fo.id);
    const expanded = expandedFolders.has(fo.id);
    const isActive = libView==="browse" && currentParentId()===fo.id;

    const item = document.createElement("button");
    item.className = "tree-item" + (isActive ? " active" : "");
    item.style.setProperty("--depth", depth);
    item.innerHTML =
      (kids.length
        ? '<span class="tree-caret'+(expanded ? ' open' : '')+'"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></span>'
        : '<span class="tree-caret empty"></span>') +
      '<span class="tree-name">'+escapeHtml(fo.name)+'</span>'+
      '<span class="count">'+folderFileCount(fo.id)+'</span>';
    item.addEventListener("click", (e)=>{
      if(kids.length && e.target.closest(".tree-caret")){
        expandedFolders.has(fo.id) ? expandedFolders.delete(fo.id) : expandedFolders.add(fo.id);
        renderFolderRail();
        return;
      }
      libView="browse";
      folderPath = folderAncestorPath(fo.id);
      if(kids.length) expandedFolders.add(fo.id);
      renderAll();
    });

    // drag source: pick this folder up to move it elsewhere
    item.draggable = true;
    item.addEventListener("dragstart", (e)=>{
      e.stopPropagation();
      e.dataTransfer.setData("application/x-ss-folder", fo.id);
      e.dataTransfer.effectAllowed = "move";
    });
    // drop target: files or other folders dropped here move into this folder
    item.addEventListener("dragover", (e)=>{ e.preventDefault(); item.classList.add("drag-over"); });
    item.addEventListener("dragleave", ()=> item.classList.remove("drag-over"));
    item.addEventListener("drop", (e)=>{
      e.preventDefault(); e.stopPropagation();
      item.classList.remove("drag-over");
      handleTreeDrop(e, fo.id);
    });

    wrap.appendChild(item);
    if(kids.length && expanded){
      kids.forEach(k => wrap.appendChild(renderFolderTreeNode(k, depth+1)));
    }
    return wrap;
  }

  /* ---------------- file list ---------------- */
  function visibleFiles(){
    if(searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      return sortFiles(files.filter(f=> f.title.toLowerCase().includes(q)));
    }
    if(libView==="all") return sortFiles(files);
    if(libView==="uncategorized") return sortFiles(files.filter(f=>!f.folderId));
    const pid = currentParentId();
    return sortFiles(files.filter(f=>(f.folderId||null) === pid));
  }

  function renderFileList(){
    const list = $("fileList");

        list.appendChild(hint);
        return;
      }
      const empty = document.createElement("div");
      empty.className = "empty-state";
      const noFilesAtAll = files.length===0;
      empty.innerHTML =
        '<svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>'+
        '<strong>'+(noFilesAtAll ? "아직 올린 파일이 없어요" : (libView==="browse" ? "이 폴더는 비어 있어요" : "여기엔 파일이 없어요"))+'</strong>'+
        '<span>오른쪽 위 "파일 업로드" 버튼을 누르거나, md 파일을 화면에 끌어다 놓으면 서재에 추가돼요.</span>';
      list.appendChild(empty);

    }
    const grid = document.createElement("div");
    grid.className = "file-grid" + (density==="compact" ? " compact" : "");
    vis.forEach(f=>{
      const prog = f.progress || {};
      const pct = typeof prog.pct === "number" ? Math.round(prog.pct*100) : 0;
      const card = document.createElement("div");
      card.className = "file-card";
      const d = new Date(f.updatedTs);
      const dateStr = d.toLocaleDateString("ko-KR", {month:"short", day:"numeric"});
      const fPath = f.folderId ? folderPathLabel(f.folderId) : null;
      card.innerHTML =
        '<div class="doc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg></div>'+
        '<div class="info">'+
          '<div class="name">'+escapeHtml(f.title)+'</div>'+
          '<div class="meta">'+
            (fPath ? '<span class="tag">'+escapeHtml(fPath)+'</span>' : '')+
            '<span>'+f.chapterCount+'개 챕터</span><span class="dot"></span><span>'+dateStr+'</span>'+
            (pct>0 ? '<span class="dot"></span><span>'+pct+'% 읽음</span>' : '')+
          '</div>'+
          '<div class="progress-bar"><i style="width:'+pct+'%"></i></div>'+
        '</div>'+
        '<button class="more-btn" aria-label="더보기"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
        '<button class="hit" aria-label="열기"></button>';
      card.querySelector(".hit").addEventListener("click", ()=> openBook(f.id));
      card.querySelector(".more-btn").addEventListener("click", (e)=>{ e.stopPropagation(); openFileMenu(e.currentTarget, f); });
      // drag-to-reorganize onto the folder tree — tablet/desktop only (the
      // tree itself, its only drop target, is also scoped to that width)
      if(isTabletUp()){
        card.draggable = true;
        card.addEventListener("dragstart", (e)=>{
          e.dataTransfer.setData("application/x-ss-file", f.id);
          e.dataTransfer.effectAllowed = "move";
        });
      }
      grid.appendChild(card);
    });
    list.appendChild(grid);
  }

  function renderAll(){ renderFolderRail(); renderFileList(); }

  /* ---------------- search / sort / density controls ---------------- */
  const searchInput = $("searchInput");

  const searchRow = document.querySelector(".search-row");
  const searchToggleBtn = $("searchToggleBtn");

    const isOpen = searchRow.classList.toggle("open");

  document.addEventListener("click", (e)=>{

  /* ---------------- upload flow ---------------- */

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = ()=> reject(r.error);
      r.readAsDataURL(file);
    });
  }
  const IMAGE_EXT_RE = /\.(png|jpe?g|gif|webp|svg)$/i;

  // A drop/pick can contain one or more .md files plus the images they
  // reference by relative path (no folder upload, so images just ride along
  // in the same batch) — collect the images first, then thread them through
  // to each .md file so <img src="local.png"> can resolve to a data: URL.
  async function handleFileBatch(fileList){
    const mdFiles = fileList.filter(f=> /\.(md|markdown)$/i.test(f.name));
    const assetFiles = fileList.filter(f=> IMAGE_EXT_RE.test(f.name));
    if(mdFiles.length===0) return;
    let assetMap = {};
    if(assetFiles.length){
      for(const af of assetFiles){
        try{ assetMap[af.name] = await readFileAsDataURL(af); }catch(e){}
      }
    }
    for(const mf of mdFiles) await handleFile(mf, assetMap);
  }

  function handleFile(file, assetMap){
    if(!file) return Promise.resolve();
    if(!/\.(md|markdown)$/i.test(file.name) && file.type !== "text/markdown" && file.type !== "text/plain") return Promise.resolve();
    return new Promise((resolve)=>{
      const reader = new FileReader();
      reader.onload = async (e)=>{
        await libraryReady;
        const text = e.target.result;
        const id = genId();
        const h1 = text.match(/^#\s+(.*)/m);
        const title = h1 ? h1[1].trim() : file.name.replace(/\.(md|markdown)$/i,"");
        const chapters = splitChapters(text, title, null); // count-only; images resolved at read time
        await S.setText("file-content:"+id, text);
        if(assetMap && Object.keys(assetMap).length){
          const used = {};
          Object.keys(assetMap).forEach(name=>{ if(text.includes(name)) used[name] = assetMap[name]; });
          if(Object.keys(used).length) await S.setJSON("assets:"+id, used);
        }
        files.push({
          id, name:file.name, title,
          folderId: currentParentId(),
          chapterCount: chapters.length,
          createdTs: Date.now(),
          updatedTs: Date.now(),
          progress: {chapterIdx:0, pct:0, fontSize:18, theme:"light"}
        });
        await persistFiles();
        renderAll();
        resolve();
      };
      reader.readAsText(file, "utf-8");
    });
  }

  const dragOverlay = $("dragOverlay");
  let dragCounter = 0;
  // Only react to a real OS file drag (dataTransfer carries "Files") — the
  // folder tree's internal drag-to-reorganize uses its own custom MIME
  // types (application/x-ss-file / -folder) and bubbles up through here
  // too, which was incorrectly popping up the "drop files to upload"
  // overlay during an ordinary reorganize drag.
  function isOsFileDrag(e){ return !!(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")); }
  ["dragenter","dragover"].forEach(ev=>{
    document.addEventListener(ev, (e)=>{

  /* ---------------- markdown -> chapters ---------------- */
  // LaTeX math ($...$ inline, $$...$$ block) is pulled out into placeholders
  // before marked sees the text — otherwise marked would mangle underscores/
  // asterisks inside expressions as bold/italic — then KaTeX-rendered back in
  // after parsing. Placeholders use characters marked won't touch.
  function extractMath(md){
    const store = [];
    let text = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr)=>{
      store.push({expr, display:true});
      return "@@MATH"+(store.length-1)+"@@";
    });
    text = text.replace(/\$([^\$\n]+?)\$/g, (m, expr)=>{
      store.push({expr, display:false});
      return "@@MATH"+(store.length-1)+"@@";
    });
    return {text, store};
  }
  function injectMath(html, store){
    if(!store.length || typeof katex === "undefined") return html;
    return html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
      const entry = store[Number(i)];
      if(!entry) return m;
      try{ return katex.renderToString(entry.expr, {throwOnError:false, displayMode:entry.display}); }
      catch(e){ return m; }
    });
  }
  // CommonMark's emphasis rules (which marked correctly implements) refuse
  // to close **bold**/*italic* when the character right before the closing
  // delimiter is punctuation and the character right after is a letter/digit
  // with no space in between — e.g. "**모델(Model)**과" never becomes <strong>,
  // because ")" then "과" trips the rule. That combination is extremely
  // common in Korean, where grammatical particles attach directly to the
  // preceding word with no space, so it silently breaks bold/italic constantly
  // in Korean notes. Pre-convert just that pattern to literal <strong>/<em>
  // before marked ever sees it; normal usage (followed by space/punctuation/
  // end-of-line) already works fine and is left to marked as-is. Code spans
  // and fenced code blocks are skipped so `**` used as an operator (e.g.
  // Python's 2**3) is never touched.
  function fixAttachedEmphasis(md){
    const segments = md.split(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`)/g);
    return segments.map((seg, i)=>{
      if(i % 2 === 1) return seg; // odd = a captured code segment, leave untouched
      let out = seg.replace(/\*\*([^\*\n]+?)\*\*(?=[\p{L}\p{N}])/gu, (m, inner)=>
        "<strong>"+marked.parseInline(inner)+"</strong>");
      out = out.replace(/(^|[^*])\*([^\*\n]+?)\*(?=[\p{L}\p{N}])/gu, (m, before, inner)=>
        before+"<em>"+marked.parseInline(inner)+"</em>");
      return out;
    }).join("");
  }
  // Rewrites <img src="relative-name.png"> to the matching data: URL from an
  // uploaded-alongside-the-md asset map; remote/data URLs pass through untouched.
  function applyLocalImages(html, assetMap){
    if(!assetMap || !Object.keys(assetMap).length) return html;
    return html.replace(/(<img\b[^>]*\bsrc=")([^"]+)(")/gi, (m, pre, src, post)=>{
      if(/^(https?:|data:)/i.test(src)) return m;
      let name = src;
      try{ name = decodeURIComponent(src); }catch(e){}
      const asset = assetMap[src] || assetMap[name] || assetMap[name.split("/").pop()];
      return asset ? (pre + asset + post) : m;
    });
  }
  function splitChapters(md, fallbackTitle, assetMap){
    const lines = md.split("\n");
    const headIdx = [];
    lines.forEach((line,i)=>{ if(/^#{1,2}\s+\S/.test(line)) headIdx.push(i); });
    const chunks = [];
    if(headIdx.length >= 2){
      if(headIdx[0] > 0){
        const intro = lines.slice(0, headIdx[0]).join("\n").trim();
        if(intro) chunks.push({title:"들어가며", text:intro});
      }
      for(let i=0;i<headIdx.length;i++){
        const start = headIdx[i];
        const end = i+1<headIdx.length ? headIdx[i+1] : lines.length;
        const text = lines.slice(start,end).join("\n");
        const m = lines[start].match(/^#{1,2}\s+(.*)/);
        chunks.push({title: m ? m[1].trim() : "챕터 "+(i+1), text});
      }
    } else {
      chunks.push({title: fallbackTitle, text: md});
    }
    return chunks.map(c=>{
      const {text: mathSafeText, store} = extractMath(c.text);
      const safeText = fixAttachedEmphasis(mathSafeText);
      let html = marked.parse(safeText);
      html = injectMath(html, store);
      html = applyLocalImages(html, assetMap);
      html = DOMPurify.sanitize(html);
      return {title:c.title, html};
    });
  }
