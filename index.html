  function openDeleteModal(f){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>파일을 삭제할까요?</h4>'+
      '<p>"'+escapeHtml(f.title)+'"가 서재에서 삭제돼요. 이 작업은 되돌릴 수 없어요.</p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelDelete">취소</button>'+
        '<button class="btn btn-primary" id="confirmDelete" style="background:var(--danger); color:#fff;">삭제</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);
    $("cancelDelete").addEventListener("click", closeAllOverlays);
    $("confirmDelete").addEventListener("click", async ()=>{
      pendingDeletes.add(f.id);
      files = files.filter(x=>x.id!==f.id);
      closeAllOverlays();
      renderAll();
      await persistFiles();
      await S.del("file-content:"+f.id);
      await S.del("assets:"+f.id);
      for(const idx of Object.keys(inkTsMap(f))) await S.del("ink:"+f.id+":"+idx);
      if(fb && fb.currentUser){
        try{ await deleteFileFromCloud(fb.currentUser.uid, f); }
        finally{ pendingDeletes.delete(f.id); }
        syncNow();
      } else pendingDeletes.delete(f.id);
    });
  }

  /* ---------------- folder menu (rename / delete) ---------------- */
  function openFolderMenu(anchor, folder){

  function openFolderDeleteModal(folder){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const descIds = new Set(descendantFolderIds(folder.id));
    const affectedFiles = files.filter(f=> f.folderId && descIds.has(f.folderId)).length;
    const hasSubfolders = descIds.size > 1;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>폴더를 삭제할까요?</h4>'+
      '<p>"'+escapeHtml(folder.name)+'"'+(hasSubfolders ? ' 및 하위 폴더가' : '가')+' 삭제돼요.'+
        (affectedFiles>0 ? ' 안에 있던 파일 '+affectedFiles+'개는 삭제되지 않고 미분류로 이동해요.' : '')+
      '</p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelFolderDelete">취소</button>'+
        '<button class="btn btn-primary" id="confirmFolderDelete" style="background:var(--danger); color:#fff;">삭제</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);

  function readFileAsDataURL(file){

  async function handleFileBatch(fileList){

  /* ---------------- markdown -> chapters ---------------- */
  // LaTeX math ($...$ inline, $$...$$ block) is pulled out into placeholders
  // before marked sees the text — otherwise marked would mangle underscores/
  // asterisks inside expressions as bold/italic — then KaTeX-rendered back in
  // after parsing. Placeholders use characters marked won't touch.
  function extractMath(md){
    const store = [];
    let text = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr)=>{
      store.push({expr, display:true});
      return "@@MATH"+(store.length-1)+"@@";
    });
    text = text.replace(/\$([^\$\n]+?)\$/g, (m, expr)=>{
      store.push({expr, display:false});
      return "@@MATH"+(store.length-1)+"@@";
    });
    return {text, store};
  }
  function injectMath(html, store){
    if(!store.length || typeof katex === "undefined") return html;
    return html.replace(/@@MATH(\d+)@@/g, (m, i)=>{
      const entry = store[Number(i)];
      if(!entry) return m;
      try{ return katex.renderToString(entry.expr, {throwOnError:false, displayMode:entry.display}); }
      catch(e){ return m; }
    });
  }
  // CommonMark's emphasis rules (which marked correctly implements) refuse
  // to close **bold**/*italic* when the character right before the closing
  // delimiter is punctuation and the character right after is a letter/digit
  // with no space in between — e.g. "**모델(Model)**과" never becomes <strong>,
  // because ")" then "과" trips the rule. That combination is extremely
  // common in Korean, where grammatical particles attach directly to the
  // preceding word with no space, so it silently breaks bold/italic constantly
  // in Korean notes. Pre-convert just that pattern to literal <strong>/<em>
  // before marked ever sees it; normal usage (followed by space/punctuation/
  // end-of-line) already works fine and is left to marked as-is. Code spans
  // and fenced code blocks are skipped so `**` used as an operator (e.g.
  // Python's 2**3) is never touched.
  function fixAttachedEmphasis(md){
    const segments = md.split(/(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`)/g);
    return segments.map((seg, i)=>{
      if(i % 2 === 1) return seg; // odd = a captured code segment, leave untouched
      let out = seg.replace(/\*\*([^\*\n]+?)\*\*(?=[\p{L}\p{N}])/gu, (m, inner)=>
        "<strong>"+marked.parseInline(inner)+"</strong>");
      out = out.replace(/(^|[^*])\*([^\*\n]+?)\*(?=[\p{L}\p{N}])/gu, (m, before, inner)=>
        before+"<em>"+marked.parseInline(inner)+"</em>");
      return out;
    }).join("");
  }
  // Rewrites <img src="relative-name.png"> to the matching data: URL from an
  // uploaded-alongside-the-md asset map; remote/data URLs pass through untouched.
  function applyLocalImages(html, assetMap){
    if(!assetMap || !Object.keys(assetMap).length) return html;
    return html.replace(/(<img\b[^>]*\bsrc=")([^"]+)(")/gi, (m, pre, src, post)=>{
      if(/^(https?:|data:)/i.test(src)) return m;
      let name = src;
      try{ name = decodeURIComponent(src); }catch(e){}
      const asset = assetMap[src] || assetMap[name] || assetMap[name.split("/").pop()];
      return asset ? (pre + asset + post) : m;
    });
  }
  function splitChapters(md, fallbackTitle, assetMap){
    const lines = md.split("\n");

    lines.forEach((line,i)=>{ if(/^#{1,2}\s+\S/.test(line)) headIdx.push(i); });
    const chunks = [];
    if(headIdx.length >= 2){

        const intro = lines.slice(0, headIdx[0]).join("\n").trim();
        if(intro) chunks.push({title:"들어가며", text:intro});
      }
      for(let i=0;i<headIdx.length;i++){
        const start = headIdx[i];
        const end = i+1<headIdx.length ? headIdx[i+1] : lines.length;
        const text = lines.slice(start,end).join("\n");
        const m = lines[start].match(/^#{1,2}\s+(.*)/);
        chunks.push({title: m ? m[1].trim() : "챕터 "+(i+1), text});

      html = applyLocalImages(html, assetMap);

  // Tables come out of the markdown renderer bare; give each one its own
  // horizontal scroll box so a wide one scrolls in place instead of
  // displacing the column around it.
  function wrapWideTables(root){
    root.querySelectorAll("table").forEach(t=>{
      if(t.parentElement && t.parentElement.classList.contains("table-scroll")) return;
      const wrap = document.createElement("div");
      wrap.className = "table-scroll";
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
  }

  // Images have no height until they load, so the chapter is shorter at the
  // moment it is first laid out than it will be a beat later: the ink surface
  // gets sized to the wrong height and a restored reading position lands
  // short. Re-apply both once the pictures are actually in — but only if the
  // reader hasn't already moved, so this never yanks the page.
  function settleChapterMedia(startFrac, settledAt){
    const pending = Array.from(readInner.querySelectorAll("img")).filter(im=> !im.complete);
    if(!pending.length) return;
    let left = pending.length;
    const done = ()=>{
      if(--left > 0) return;
      resizeInkCanvas();
      if(startFrac && Math.abs(readScroll.scrollTop - settledAt) < 2){
        const max = Math.max(0, readScroll.scrollHeight - readScroll.clientHeight);
        readScroll.scrollTo({ top: Math.round(startFrac * max), behavior: "instant" });
      }
      updateProgress();
    };
    pending.forEach(im=>{
      im.addEventListener("load", done, { once:true });
      im.addEventListener("error", done, { once:true });
    });
  }

  async function renderChapter(idx, resetScroll, startFrac){
    chapterIdx = Math.max(0, Math.min(idx, activeChapters.length-1));
    readInner.innerHTML = activeChapters[chapterIdx].html;
    wrapWideTables(readInner);
    readInner.querySelectorAll("pre code").forEach(block=>{ try{ hljs.highlightElement(block); }catch(e){} });
    // .read-scroll has scroll-behavior:smooth (for deliberate jumps like
    // this one, in principle) but the content was just replaced wholesale —
    // "smoothly" animating from wherever the old chapter had scrolled to
    // down through the brand-new chapter's content read as the page
    // lurching backwards on every chapter change. Instant here; smooth is
    // still what TOC/other explicit scrollIntoView-style jumps get.
    if(resetScroll !== false){
      // startFrac is only passed when reopening a book: the shelf already
      // says "60% 읽음", so landing at the top of the chapter every time
      // threw away a position the app had gone to the trouble of recording
      const max = Math.max(0, readScroll.scrollHeight - readScroll.clientHeight);
      readScroll.scrollTo({ top: startFrac ? Math.round(startFrac * max) : 0, behavior: "instant" });
    }
    chapterIndicator.textContent = (chapterIdx+1) + " / " + activeChapters.length;
    $("prevBtn").disabled = chapterIdx === 0;
    $("nextBtn").disabled = chapterIdx === activeChapters.length-1;
    Array.from(tocList.children).forEach((el,i)=> el.classList.toggle("active", i===chapterIdx));
    updateProgress();
    saveProgress();
    await loadInkForChapter();
    setupInkCanvas();
    settleChapterMedia(startFrac, readScroll.scrollTop);
  }

  /* ---- full-screen image viewer ------------------------------------------
     A diagram scaled into a ~380px reading column is unreadable on a phone,
     and the page itself cannot be pinched: the app owns the whole viewport
     as a fixed layout, so the browser's own zoom has nothing to work with.
     Tapping a picture opens it on its own, with pinch, drag and double-tap. */
  let imgZoomEl = null;
  function closeImageZoom(){
    if(!imgZoomEl) return;
    const el = imgZoomEl;
    imgZoomEl = null;
    el.classList.remove("show");
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, 200);
  }
  function openImageZoom(src, alt){
    if(!src || imgZoomEl) return;
    const wrap = document.createElement("div");
    wrap.className = "img-zoom";
    wrap.innerHTML =
      '<img alt="">' +
      '<button class="img-zoom-close" aria-label="닫기"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '<div class="img-zoom-hint">두 손가락으로 확대 · 두 번 탭 · 빈 곳을 탭하면 닫혀요</div>';
    const img = wrap.querySelector("img");
    img.src = src;
    img.alt = alt || "";
    document.body.appendChild(wrap);
    imgZoomEl = wrap;
    requestAnimationFrame(()=> wrap.classList.add("show"));

    let scale = 1, tx = 0, ty = 0;
    const pointers = new Map();
    let pinchDist = 0, pinchScale = 1, pinchMid = null, panFrom = null;
    let moved = 0, lastTap = 0;

    // keep the picture from being dragged off into nothing: at 1x it stays
    // centred, and beyond that it may only pan as far as its own overflow
    function clamp(){
      const r = img.getBoundingClientRect();
      const w = r.width / scale, h = r.height / scale;   // laid-out size
      const overX = Math.max(0, (w * scale - window.innerWidth) / 2);
      const overY = Math.max(0, (h * scale - window.innerHeight) / 2);
      tx = Math.min(overX, Math.max(-overX, tx));
      ty = Math.min(overY, Math.max(-overY, ty));
    }
    function apply(){
      clamp();
      img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
      img.style.transformOrigin = "center center";
    }
    function zoomTo(next, cx, cy){
      const prev = scale;
      scale = Math.min(6, Math.max(1, next));
      if(scale === 1){ tx = 0; ty = 0; }
      else if(cx != null){
        // keep the point under the fingers where it is
        const k = scale / prev;
        tx = cx - (cx - tx) * k;
        ty = cy - (cy - ty) * k;
      }
      apply();
    }

    wrap.addEventListener("pointerdown", (e)=>{
      if(e.target.closest(".img-zoom-close")) return;
      try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = 0;
      if(pointers.size === 2){
        const [a, b] = [...pointers.values()];
        pinchDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        pinchScale = scale;
        pinchMid = { x: (a.x + b.x) / 2 - window.innerWidth / 2, y: (a.y + b.y) / 2 - window.innerHeight / 2 };
      } else {
        panFrom = { x: e.clientX - tx, y: e.clientY - ty };
      }
    });
    wrap.addEventListener("pointermove", (e)=>{
      const p = pointers.get(e.pointerId);
      if(!p) return;
      moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
      p.x = e.clientX; p.y = e.clientY;
      if(pointers.size >= 2){
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        zoomTo(pinchScale * (d / pinchDist), pinchMid.x, pinchMid.y);
      } else if(panFrom && scale > 1){
        tx = e.clientX - panFrom.x;
        ty = e.clientY - panFrom.y;
        apply();
      }
    });
    function release(e){
      pointers.delete(e.pointerId);
      if(pointers.size < 2) pinchMid = null;
      if(pointers.size === 1){
        const only = [...pointers.values()][0];
        panFrom = { x: only.x - tx, y: only.y - ty };
      }
      if(pointers.size === 0){
        if(moved < 8){
          const now = Date.now();
          if(now - lastTap < 300){          // double tap toggles
            lastTap = 0;
            zoomTo(scale > 1.2 ? 1 : 2.5,
                   e.clientX - window.innerWidth / 2, e.clientY - window.innerHeight / 2);
          } else {
            lastTap = now;
            // a single tap closes, unless it turns out to be the first half
            // of a double tap
            setTimeout(()=>{ if(lastTap === now && imgZoomEl === wrap) closeImageZoom(); }, 300);
          }
        }
        panFrom = null;
      }
    }
    wrap.addEventListener("pointerup", release);
    wrap.addEventListener("pointercancel", release);
    wrap.querySelector(".img-zoom-close").addEventListener("click", (e)=>{ e.stopPropagation(); closeImageZoom(); });
    apply();
  }
  // the ink canvas sits over the text and takes the taps while drawing, so
  // this only ever fires when the pen is put away
  readInner.addEventListener("click", (e)=>{
    if(penMode || !readerScreenVisible()) return;
    const img = e.target && e.target.closest && e.target.closest("img");
    if(img) openImageZoom(img.currentSrc || img.src, img.alt);
  });

  function updateProgress(){
    const el = readScroll;
    const max = el.scrollHeight - el.clientHeight;
    const frac = max > 0 ? el.scrollTop / max : 1;
    const overall = (chapterIdx + frac) / activeChapters.length;
    ribbonFill.style.height = Math.min(100, Math.max(2, overall*100)) + "%";
    progressPct.textContent = Math.round(overall*100) + "%";
    return overall;
  }
  readScroll.addEventListener("scroll", ()=>{
    updateProgress();
    syncInkWindow();
    clearTimeout(readScroll._t);
    readScroll._t = setTimeout(saveProgress, 500);
  });

  async function saveProgress(){
    if(!activeFile) return;
    const pct = updateProgress();
    const max = readScroll.scrollHeight - readScroll.clientHeight;
    const frac = max > 0 ? Math.min(1, Math.max(0, readScroll.scrollTop / max)) : 0;
    activeFile.progress = {chapterIdx, pct, frac, fontSize, theme};
    activeFile.updatedTs = Date.now();
    await persistFiles();
  }

  function buildTOC(){
    tocList.innerHTML = "";
    const inkChapters = (activeFile && activeFile.inkChapters) || [];
    activeChapters.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "toc-item" + (i===chapterIdx ? " active":"");
      b.innerHTML = '<span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="toc-title">'+escapeHtml(c.title)+'</span>'+
        (inkChapters.includes(i) ? '<span class="toc-ink-dot" aria-label="필기 있음"></span>' : '');
      // phones: the TOC is a full overlay, so picking a chapter should get
      // it out of the way; tablet/desktop: it's a persistent side panel,
      // so it should stay open across chapters like a real sidebar
      b.addEventListener("click", ()=>{ renderChapter(i); if(!isTabletUp()) closeDrawer(); });
      tocList.appendChild(b);
    });
  }

  $("backBtn").addEventListener("click", ()=>{
    setPenMode(false);
    readerScreen.classList.add("hidden");
    libraryScreen.classList.remove("hidden");
    renderAll();
  });
  $("prevBtn").addEventListener("click", ()=> renderChapter(chapterIdx-1));
  $("nextBtn").addEventListener("click", ()=> renderChapter(chapterIdx+1));

  // desktop/laptop: arrow keys flip chapters, same as the prev/next buttons
  document.addEventListener("keydown", (e)=>{
    if(e.key==="Escape" && !readerScreenVisible()){
      if(document.querySelector(".menu-pop") || $("modalLayer").firstChild) closeAllOverlays();
      return;
    }
    if(!readerScreenVisible()) return;
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==="Escape"){
      if(imgZoomEl){ closeImageZoom(); return; }
      closeDrawer(); closeSettings(); setPenMode(false);
      return;
    }
    // left/right only — up/down are left alone so they still scroll within
    // the current chapter instead of jumping chapters unexpectedly
    if(e.key==="ArrowRight"){
      if(chapterIdx < activeChapters.length-1){ e.preventDefault(); renderChapter(chapterIdx+1); }
    } else if(e.key==="ArrowLeft"){
      if(chapterIdx > 0){ e.preventDefault(); renderChapter(chapterIdx-1); }
    }
  });

  // A sideways drag that starts inside something which scrolls sideways —
  // a wide table, a code block, display math — belongs to that box. Turning
  // the chapter out from under it was the most reliable way to lose your
  // place while trying to read the right-hand columns of a table.
  function scrollsHorizontally(el){
    while(el && el !== readScroll){
      if(el.scrollWidth > el.clientWidth + 1){
        const ox = getComputedStyle(el).overflowX;
        if(ox === "auto" || ox === "scroll") return true;
      }
      el = el.parentElement;
    }
    return readScroll.scrollWidth > readScroll.clientWidth + 1;
  }

  // Set by the TOC drawer's own drag (below) as soon as it takes a gesture.
  // readScroll's touchend runs before the drawer's, which is on an ancestor,
  // so the flag is still standing when the page-turn checks it.
  let drawerDragActive = false;
  let touchX = null, touchY = null, swipeBlocked = false;
  readScroll.addEventListener("touchstart", (e)=>{
    if(penMode) return;
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
    swipeBlocked = scrollsHorizontally(e.target);
    drawerDragActive = false;
  }, {passive:true});
  readScroll.addEventListener("touchend", (e)=>{
    if(penMode || touchX===null) return;
    if(swipeBlocked || drawerDragActive){ touchX = null; touchY = null; swipeBlocked = false; return; }
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    // only treat as a page-turn swipe if the drag is clearly horizontal,
    // so normal up/down scrolling on tablets never gets mistaken for it
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0 && chapterIdx < activeChapters.length-1) renderChapter(chapterIdx+1);
      else if(dx > 0 && chapterIdx > 0) renderChapter(chapterIdx-1);
    }
    touchX = null; touchY = null;
  }, {passive:true});

  // At tablet width+ the TOC is an in-flow side panel, not an overlay, so it
  // doesn't need the dimming #overlay (and shouldn't block taps on the reader
  // behind it — there is no "behind" once it's part of the layout).
  function isTabletUp(){ return window.innerWidth >= 720; }
  function openDrawer(){ drawer.classList.add("show"); syncOverlay(); }
  function closeDrawer(){ drawer.classList.remove("show"); syncOverlay(); }
  $("tocBtn").addEventListener("click", ()=>{
    buildTOC();
    if(drawer.classList.contains("show")) closeDrawer(); else openDrawer();
  });
  $("overlay").addEventListener("click", ()=>{ closeDrawer(); closeSettings(); closeInkPop(); });

  // Double-clicking the reading content closes the TOC if it's open — mainly
  // for tablet/desktop, where the panel is persistent (doesn't auto-close on
  // navigation, see buildTOC) and there's no dimming #overlay to tap away.
  // Gated on the drawer actually being open so it never fights normal
  // double-click-to-select-a-word while reading.
  readScroll.addEventListener("dblclick", ()=>{
    if(drawer.classList.contains("show")) closeDrawer();
  });

  // Touch-drag for the TOC drawer (phones + tablets): swipe in from the left
  // screen edge to open it, drag it left to close — not just tap-to-toggle.
  // Mobile animates transform (overlay drawer); tablet animates width (in-
  // flow panel) — see the .drawer CSS. Direction is locked from the first
  // real move so this never steals a vertical scroll inside the TOC list,
  // the same disambiguation the chapter page-turn swipe above already uses.
  (function setupDrawerSwipe(){
    const EDGE_ZONE = 24;
    const VERTICAL_TOLERANCE = 1.5;
    let dragging = false, undecided = false, dragMode = null;
    let startX = 0, startY = 0, maxW = 300;

    function drawerMaxWidth(){ return isTabletUp() ? 300 : Math.min(300, window.innerWidth * 0.82); }
    function setDragPx(px){
      const clamped = Math.max(0, Math.min(maxW, px));
      if(isTabletUp()){
        drawer.style.width = clamped + "px";
      } else {
        drawer.style.transform = "translateX(" + (clamped - maxW) + "px)";
        $("overlay").classList.add("show");
        $("overlay").style.opacity = String(clamped / maxW);
      }
    }
    function finishDrag(open, finalPx){
      drawer.style.transition = "none";
      setDragPx(finalPx);
      // force a paint with transition still off before re-enabling it, so
      // the browser has an actual "before" frame to animate away from
      drawer.getBoundingClientRect();
      requestAnimationFrame(()=>{
        drawer.style.transition = "";
        drawer.style.width = "";
        drawer.style.transform = "";
        $("overlay").style.opacity = "";
        if(open){ buildTOC(); openDrawer(); } else { closeDrawer(); }
      });
    }
    function onStart(e){
      if(!readerScreenVisible() || penMode) return;
      const t = e.touches[0];
      const isOpen = drawer.classList.contains("show");
      if(isOpen){
        if(!drawer.contains(e.target)) return;
        dragMode = "close";
      } else {
        if(t.clientX > EDGE_ZONE) return;
        dragMode = "open";
      }
      undecided = true; dragging = false;
      startX = t.clientX; startY = t.clientY;
      maxW = drawerMaxWidth();
    }
    function onMove(e){
      if(!undecided && !dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if(undecided){
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return; // not enough movement yet to tell
        undecided = false;
        if(Math.abs(dx) < Math.abs(dy) * VERTICAL_TOLERANCE) return; // vertical — leave it to native scroll
        dragging = true;
        drawerDragActive = true; // this gesture is the drawer's; no page turn
        drawer.style.transition = "none";
      }
      if(!dragging) return;
      e.preventDefault();
      const base = dragMode === "close" ? maxW : 0;
      setDragPx(base + dx);
    }
    function onEnd(e){
      undecided = false;
      // cleared after readScroll's touchend has already read it
      setTimeout(()=>{ drawerDragActive = false; }, 0);
      if(!dragging){ return; }
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      const base = dragMode === "close" ? maxW : 0;
      const finalPx = base + dx;
      finishDrag(finalPx > maxW * 0.4, finalPx);
    }
    const body = $("readerBody");
    body.addEventListener("touchstart", onStart, {passive:true});
    body.addEventListener("touchmove", onMove, {passive:false});
    body.addEventListener("touchend", onEnd, {passive:true});
    body.addEventListener("touchcancel", onEnd, {passive:true});

    // Laptops/desktops have no swipe gesture, so the equivalent is dragging
    // the divider on the panel's own right edge (mouse only — touch devices
    // already get the drag above from anywhere in the open drawer).
    const handle = $("drawerResizeHandle");
    function onMouseDown(e){
      if(!readerScreenVisible() || !drawer.classList.contains("show")) return;
      e.preventDefault();
      dragMode = "close";
      dragging = true; undecided = false;
      startX = e.clientX; startY = e.clientY;
      maxW = drawerMaxWidth();
      drawer.style.transition = "none";
      handle.classList.add("dragging");
      document.addEventListener("mousemove", onMouseMoveDoc);
      document.addEventListener("mouseup", onMouseUpDoc);
    }
    function onMouseMoveDoc(e){
      if(!dragging) return;
      setDragPx(maxW + (e.clientX - startX));
    }
    function onMouseUpDoc(e){
      if(!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.removeEventListener("mousemove", onMouseMoveDoc);
      document.removeEventListener("mouseup", onMouseUpDoc);
      const finalPx = maxW + (e.clientX - startX);
      finishDrag(finalPx > maxW * 0.4, finalPx);
    }
    handle.addEventListener("mousedown", onMouseDown);
  })();

  function openSettings(){ settingsPop.classList.add("show"); syncOverlay(); }
  function closeSettings(){ settingsPop.classList.remove("show"); syncOverlay(); }
  $("settingsBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    settingsPop.classList.contains("show") ? closeSettings() : openSettings();
  });

  const READ_SIZE_MIN = 10, READ_SIZE_MAX = 26;
  function applyFont(){
    fontSize = Math.max(READ_SIZE_MIN, Math.min(READ_SIZE_MAX, fontSize));
    document.documentElement.style.setProperty("--read-size", fontSize+"px");
    fontVal.textContent = fontSize+"px";
    $("fontMinus").disabled = fontSize <= READ_SIZE_MIN;
    $("fontPlus").disabled = fontSize >= READ_SIZE_MAX;
    resizeInkCanvas();
  }
  $("fontMinus").addEventListener("click", ()=>{ fontSize -= 1; applyFont(); saveProgress(); });
  $("fontPlus").addEventListener("click", ()=>{ fontSize += 1; applyFont(); saveProgress(); });

  function applyReadStyle(){
    document.documentElement.style.setProperty("--read-line", String(readLine));
    document.documentElement.style.setProperty("--read-font",
      readFamily === "sans" ? "'Noto Sans KR', sans-serif" : "'Noto Serif KR', serif");
    document.querySelectorAll("#lineRow .seg-btn").forEach(b=> b.classList.toggle("active", Number(b.dataset.line) === readLine));
    document.querySelectorAll("#familyRow .seg-btn").forEach(b=> b.classList.toggle("active", b.dataset.family === readFamily));
    // both reflow the text, which is exactly what stroke anchoring is for
    resizeInkCanvas();
  }
  document.querySelectorAll("#lineRow .seg-btn").forEach(b=>{
    b.addEventListener("click", ()=>{ readLine = Number(b.dataset.line); applyReadStyle(); persistPrefs(); saveProgress(); });
  });
  document.querySelectorAll("#familyRow .seg-btn").forEach(b=>{
    b.addEventListener("click", ()=>{ readFamily = b.dataset.family; applyReadStyle(); persistPrefs(); saveProgress(); });
  });

  function applyTheme(){
    readerScreen.setAttribute("data-theme", theme);
    if(theme === "custom"){
      readScroll.style.setProperty("--read-bg", customBg);
      readScroll.style.setProperty("--read-text", customText);
    } else {
      readScroll.style.removeProperty("--read-bg");
      readScroll.style.removeProperty("--read-text");
    }
    $("customThemeSwatch").style.setProperty("--sw-custom-bg", customBg);
    $("customThemeSwatch").style.setProperty("--sw-custom-text", customText);
    document.querySelectorAll(".theme-swatch").forEach(s=> s.classList.toggle("active", s.dataset.themeChoice === theme));
  }
  document.querySelectorAll(".theme-swatch").forEach(s=>{
    s.addEventListener("click", ()=>{ theme = s.dataset.themeChoice; applyTheme(); saveProgress(); });
  });

  // "직접" theme: colors are a global preference (shared across every book),
  // picking either one live-previews and switches the active book to it.
  let customThemeSaveTimer = null;
  function scheduleCustomThemeSave(){
    clearTimeout(customThemeSaveTimer);
    customThemeSaveTimer = setTimeout(()=>{ saveProgress(); persistPrefs(); }, 150);
  }
  $("customBgInput").addEventListener("input", ()=>{
    customBg = $("customBgInput").value;
    theme = "custom";
    applyTheme();
    scheduleCustomThemeSave();
  });
  $("customTextInput").addEventListener("input", ()=>{
    customText = $("customTextInput").value;
    theme = "custom";
    applyTheme();
    scheduleCustomThemeSave();
  });

  /* ---------------- ink (handwriting) layer ----------------
     Two stacked canvases live inside #readInner (so they scroll with the
     chapter's own content): a highlight layer (mix-blend-mode:multiply, so
     marker strokes sit visually behind the text) and an ink layer on top for
     pen/eraser. Strokes are stored per file+chapter, normalized to 0..1 of
     the content box so they rescale when font size / width changes.
     Known limitation: a big font-size change reflows text non-uniformly, so
     ink follows along approximately rather than staying pixel-anchored to a
     specific word. */
  let inkCanvas = null, inkCtx = null;
  let highlightCanvas = null, highlightCtx = null;
  let inkStrokes = [];
  let inkColor = "#3F3A34";
  let inkSize = 4.5;
  let inkTool = "pen"; // 'pen' | 'highlighter' | 'eraser'
  let penMode = false;
  let inkDrawing = null;
  let inkActivePointerId = null;
  let inkActiveStylusId = null;   // palm rejection: pointerId of the stylus currently down
  let inkLastPenActivityTs = 0;   // palm rejection: ignore touch shortly after/around pen use
  let inkRedoStack = [];          // per-chapter; a fresh stroke clears it, like any undo/redo stack
  let inkTouchPointers = new Map(); // touch pointerId -> last clientY, for two-finger-scroll detection
  let inkMultiTouchActive = false;  // sticky until every finger lifts, so 2->1 finger mid-gesture doesn't suddenly draw
  let inkPanLastCentroidY = null;
  let inkLastLoggedButtons = null;  // last-seen button bits, so the log only fires on a change

  function inkKey(){ return activeFile ? "ink:"+activeFile.id+":"+chapterIdx : null; }

  async function loadInkForChapter(){
    const key = inkKey();
    inkStrokes = key ? await S.getJSON(key, []) : [];
    inkRedoStack = [];
    // Strokes made before anchoring existed are still chapter-relative. They
    // are correct at this instant — this is the size they were last seen at
    // — so pinning them to their blocks now is the one moment that freezes
    // them where they belong instead of letting them drift further.
    if(inkStrokes.some(st=> st && st.block == null)){
      const boxes = inkBlockBoxes();
      if(boxes.length){
        inkStrokes.forEach(st=> anchorStroke(st, boxes));
        saveInkForChapter();
      }
    }
    updateInkUndoButtons();
  }
  async function saveInkForChapter(){
    const key = inkKey();
    if(!key || !activeFile) return;
    await S.setJSON(key, inkStrokes);
    const set = new Set(activeFile.inkChapters || []);
    if(inkStrokes.length > 0) set.add(chapterIdx); else set.delete(chapterIdx);
    activeFile.inkChapters = Array.from(set).sort((a,b)=>a-b);
    activeFile.inkTs = Object.assign({}, inkTsMap(activeFile));
    activeFile.inkTs[chapterIdx] = Date.now();
    await persistFiles();
  }

  function setupInkCanvas(){
    if(inkCanvas) inkCanvas.remove();
    if(highlightCanvas) highlightCanvas.remove();
    highlightCanvas = document.createElement("canvas");
    highlightCanvas.className = "ink-canvas highlight-layer";
    readInner.appendChild(highlightCanvas);
    highlightCtx = highlightCanvas.getContext("2d");

    inkCanvas = document.createElement("canvas");
    inkCanvas.className = "ink-canvas" + (penMode ? "" : " inactive");
    readInner.appendChild(inkCanvas);
    inkCtx = inkCanvas.getContext("2d");

    wireInkPointerEvents();
    resizeInkCanvas();
  }

  /* ---- the ink surface is a window onto the chapter, not the whole of it --
     A canvas spanning the entire chapter is what forced the earlier
     resolution clamp: browsers cap a canvas's dimensions and area, and at
     full device pixel ratio a long chapter blew past both — 1137x323889 was
     asked for on a 107,963px chapter, and the canvas came back alive but
     inert, drawing nothing at all. Even well short of the cap it was
     ruinous: ~546MB across the two layers for a 20,000px chapter, and every
     committed stroke repainted all of it.

     Instead the canvases cover the viewport plus a screen's worth of margin
     either side, positioned inside the (natively scrolled) content. They
     only move when the reader scrolls past that margin, so scrolling stays
     free, memory is bounded by the screen rather than the chapter, and the
     backing store is always full resolution however long the chapter is. */
  let inkWinTop = 0;     // window's offset within readInner, in CSS px
  let inkWinH = 0;
  const strokeBounds = new WeakMap(); // stroke -> normalized bbox, for culling

  function inkContentSize(){
    return { w: readInner.clientWidth, h: Math.max(1, readInner.scrollHeight) };
  }

  function layoutInkWindow(force){
    if(!inkCanvas || !highlightCanvas) return false;
    const { w, h } = inkContentSize();
    const viewH = readScroll.clientHeight || 1;
    const margin = Math.max(240, Math.round(viewH));
    const winH = Math.min(h, viewH + margin * 2);
    const visTop = readScroll.scrollTop - readInner.offsetTop;

    // still inside the current window (and nothing resized)? nothing to do —
    // this is the common case on every scroll event
    if(!force && winH === inkWinH && visTop >= inkWinTop && visTop + viewH <= inkWinTop + inkWinH
       && inkCanvas.style.width === w + "px"){
      return false;
    }
    const top = Math.max(0, Math.min(Math.round(visTop - margin), Math.max(0, h - winH)));
    inkWinTop = top;
    inkWinH = winH;

    const dpr = window.devicePixelRatio || 1;
    [inkCanvas, highlightCanvas].forEach(c=>{
      c.width = Math.max(1, Math.round(w * dpr));
      c.height = Math.max(1, Math.round(winH * dpr));
      c.style.width = w + "px";
      c.style.height = winH + "px";
      c.style.top = top + "px";
    });
    // content coordinates in, window pixels out
    inkCtx.setTransform(dpr, 0, 0, dpr, 0, -top * dpr);
    highlightCtx.setTransform(dpr, 0, 0, dpr, 0, -top * dpr);
    return true;
  }

  function resizeInkCanvas(){
    if(layoutInkWindow(true)) redrawInk();
  }
  // Scrolling only costs anything on the rare frame that leaves the margin.
  function syncInkWindow(){
    if(inkDrawing) return;            // never move the surface mid-stroke
    if(layoutInkWindow(false)) redrawInk();
  }

  function ctxForTool(tool){ return tool==="highlighter" ? highlightCtx : inkCtx; }

  function applyStrokeStyle(ctx, tool, color, width){
    ctx.lineJoin = "round";
    if(tool==="eraser"){
      ctx.globalCompositeOperation = "destination-out";
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#000";
      ctx.lineWidth = width;
      ctx.lineCap = "round";
    } else if(tool==="highlighter"){
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "butt";
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
    }
  }

  /* ---- strokes are anchored to the block they were written on ------------
     Coordinates used to be a fraction of the whole chapter, which only holds
     while the chapter stays exactly as tall as it was when the stroke was
     made. Change the reading size and the text reflows — and not uniformly,
     since headings, images and code blocks each grow by different amounts —
     so a line drawn under one sentence ended up somewhere else entirely.

     Each stroke now records which top-level block it was written over and
     stores y as a fraction of that block, so it moves and stretches with the
     paragraph it belongs to. x stays a fraction of the column, which the
     reading size does not change.

     The block index is simply its position among readInner's children: the
     chapter is rebuilt from the same markdown every time, so that order is
     stable. Editing the markdown can shift it — ink drifting after an edit
     is expected either way — and an index past the end falls back to the
     last block that does exist rather than collapsing to the top. */
  function inkBlockBoxes(){
    const out = [];
    for(const el of readInner.children){
      if(el.classList && el.classList.contains("ink-canvas")) continue;
      out.push({ top: el.offsetTop, height: Math.max(1, el.offsetHeight) });
    }
    return out;
  }
  function strokeYMap(stroke, h, boxes){
    if(stroke.block == null || !boxes || !boxes.length) return { off: 0, scale: h };
    const box = boxes[Math.min(stroke.block, boxes.length - 1)];
    return { off: box.top, scale: box.height };
  }
  // Chapter-relative in, block-relative out. Anchors on the stroke's own
  // vertical middle, so a long underline belongs to the line it underlines
  // rather than to whichever block its first point happened to land in.
  function anchorStroke(stroke, boxes){
    if(!stroke || !stroke.points || !stroke.points.length || stroke.block != null) return;
    const h = Math.max(1, readInner.scrollHeight);
    boxes = boxes || inkBlockBoxes();
    if(!boxes.length) return;
    let y0 = Infinity, y1 = -Infinity;
    for(const p of stroke.points){ if(p[1] < y0) y0 = p[1]; if(p[1] > y1) y1 = p[1]; }
    if(y0 === Infinity) return;
    const midPx = ((y0 + y1) / 2) * h;
    let idx = -1;
    for(let i = 0; i < boxes.length; i++){
      if(midPx >= boxes[i].top && midPx < boxes[i].top + boxes[i].height){ idx = i; break; }
    }
    if(idx === -1){
      // written in the margin between two blocks — take the nearer one
      let bestD = Infinity;
      for(let i = 0; i < boxes.length; i++){
        const d = Math.abs(boxes[i].top + boxes[i].height / 2 - midPx);
        if(d < bestD){ bestD = d; idx = i; }
      }
    }
    if(idx < 0) return;
    const box = boxes[idx];
    stroke.block = idx;
    stroke.points = stroke.points.map(p=> [p[0], (p[1] * h - box.top) / box.height]);
    strokeBounds.delete(stroke);
  }

  // Smooths a raw point list into a quadratic-curve path: each real point
  // becomes a curve control point, with the midpoint between consecutive
  // points as the curve's on-path endpoint — the standard freehand-smoothing
  // technique, avoids the faceted look of plain point-to-point lineTo.
  function tracePath(ctx, points, w, yOff, yScale){
    const Y = t => yOff + t * yScale;
    if(points.length === 1){
      const p = points[0];
      ctx.moveTo(p[0]*w, Y(p[1]));
      ctx.lineTo(p[0]*w, Y(p[1]));
      return;
    }
    ctx.moveTo(points[0][0]*w, Y(points[0][1]));
    let i;
    for(i=1;i<points.length-1;i++){
      const cx = (points[i][0]+points[i+1][0])/2*w;
      const cy = Y((points[i][1]+points[i+1][1])/2);
      ctx.quadraticCurveTo(points[i][0]*w, Y(points[i][1]), cx, cy);
    }
    const last = points[points.length-1];
    ctx.lineTo(last[0]*w, Y(last[1]));
  }

  // Cached per stroke so a chapter with hundreds of them only pays for the
  // handful actually on screen. The bounds are in the stroke's own
  // coordinates; where those land depends on its block, so the mapping is
  // applied at the point of use.
  function boundsOf(stroke){
    let b = strokeBounds.get(stroke);
    if(b) return b;
    let y0 = Infinity, y1 = -Infinity;
    for(const p of stroke.points || []){
      if(p[1] < y0) y0 = p[1];
      if(p[1] > y1) y1 = p[1];
    }
    b = { y0, y1 };
    strokeBounds.set(stroke, b);
    return b;
  }
  function strokeInWindow(stroke, h, boxes){
    const b = boundsOf(stroke);
    if(b.y0 === Infinity) return false;
    const m = strokeYMap(stroke, h, boxes);
    const pad = (stroke.width || 8) + 4;
    return m.off + b.y1 * m.scale + pad >= inkWinTop
        && m.off + b.y0 * m.scale - pad <= inkWinTop + inkWinH;
  }

  function paintStroke(stroke, w, h, only, boxes){
    if(!stroke.points || stroke.points.length < 1) return;
    const m = strokeYMap(stroke, h, boxes);
    // An eraser has to reach the highlighter too — it used to be applied
    // only to the pen layer, so marker strokes simply could not be rubbed
    // out. Replayed in order on each layer, so it erases exactly what was
    // laid down before it.
    let targets = stroke.tool === "eraser" ? [inkCtx, highlightCtx] : [ctxForTool(stroke.tool)];
    if(only) targets = targets.filter(c=> c === only);
    for(const ctx of targets){
      ctx.save();
      applyStrokeStyle(ctx, stroke.tool, stroke.color, stroke.width);
      ctx.beginPath();
      tracePath(ctx, stroke.points, w, m.off, m.scale);
      ctx.stroke();
      ctx.restore();
    }
  }

  // clear in device pixels: the contexts carry the window's translate, so
  // clearing in content coordinates would miss part of the surface
  function clearInkSurfaces(){
    [inkCtx, highlightCtx].forEach(ctx=>{
      ctx.save();
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      ctx.restore();
    });
  }

  function redrawInk(){
    if(!inkCtx || !highlightCtx) return;
    const { w, h } = inkContentSize();
    const boxes = inkBlockBoxes();   // measured once for the whole pass
    clearInkSurfaces();
    for(const s of inkStrokes){
      if(strokeInWindow(s, h, boxes)) paintStroke(s, w, h, null, boxes);
    }
    if(inkDrawing) paintStroke(inkDrawing, w, h, null, boxes);
  }

  function pointerToNorm(e){
    const { w, h } = inkContentSize();
    const rect = inkCanvas.getBoundingClientRect();
    // rect.top is the window's top edge on screen, i.e. content y
    // inkWinTop — so the offset within the canvas has to be added back on
    return [ (e.clientX-rect.left)/w, (inkWinTop + (e.clientY-rect.top))/h ];
  }

  // Sub-pixel duplicates add nothing to how a stroke looks and a great deal
  // to what has to be stored and synced, so a sample has to actually move.
  const INK_MIN_STEP = 0.7;
  function appendInkPoint(ev, w, h){
    const pt = pointerToNorm(ev);
    const pts = inkDrawing.points;
    const prev = pts[pts.length-1];
    const dx = (pt[0]-prev[0])*w, dy = (pt[1]-prev[1])*h;
    if(dx*dx + dy*dy < INK_MIN_STEP*INK_MIN_STEP) return null;
    pts.push(pt);
    return prev;
  }

  let highlightPreviewRaf = 0;
  function scheduleHighlightPreview(){
    if(highlightPreviewRaf) return;
    highlightPreviewRaf = requestAnimationFrame(()=>{
      highlightPreviewRaf = 0;
      if(!highlightCtx) return;
      const { w, h } = inkContentSize();
      highlightCtx.save();
      highlightCtx.setTransform(1,0,0,1,0,0);
      highlightCtx.clearRect(0,0,highlightCtx.canvas.width, highlightCtx.canvas.height);
      highlightCtx.restore();
      const boxes = inkBlockBoxes();
      for(const st of inkStrokes){
        if((st.tool === "highlighter" || st.tool === "eraser") && strokeInWindow(st, h, boxes)) paintStroke(st, w, h, highlightCtx, boxes);
      }
      if(inkDrawing && inkDrawing.tool === "highlighter") paintStroke(inkDrawing, w, h, highlightCtx, boxes);
    });
  }

  function strokeWidthFor(e, toolOverride){
    const tool = toolOverride || inkTool;
    if(tool==="eraser") return inkSize*2.4;
    if(tool==="highlighter") return inkSize*3.2;
    const pressure = e.pressure && e.pressure>0 ? e.pressure : 0.5;
    return inkSize*(0.6+pressure*0.8);
  }

  function undoLastStroke(){
    if(inkStrokes.length===0) return;
    inkRedoStack.push(inkStrokes.pop());
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
  }
  function redoLastStroke(){
    if(inkRedoStack.length===0) return;
    inkStrokes.push(inkRedoStack.pop());
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
  }
  function updateInkUndoButtons(){
    const undoBtn = $("inkUndoBtn"), redoBtn = $("inkRedoBtn");
    if(undoBtn) undoBtn.disabled = inkStrokes.length===0;
    if(redoBtn) redoBtn.disabled = inkRedoStack.length===0;
  }

  // Brush-size cursor ring: only for pen/mouse (hover-capable pointers) — a
  // finger already sits exactly where it draws, so a trailing DOM circle
  // would just be visual noise for touch input.
  let inkCursorEl = null;
  function ensureInkCursor(){
    if(!inkCursorEl){
      inkCursorEl = document.createElement("div");
      inkCursorEl.className = "ink-cursor";
      document.body.appendChild(inkCursorEl);
    }
    return inkCursorEl;
  }
  function updateInkCursor(e, width, toolOverride){
    if(e.pointerType === "touch"){ hideInkCursor(); return; }
    const el = ensureInkCursor();
    const w = Math.max(6, width);
    el.style.display = "block";
    el.style.width = w+"px";
    el.style.height = w+"px";
    // transform (not left/top) so this doesn't force a layout recalc on
    // every single pointermove while the canvas is also busy redrawing
    el.style.transform = "translate("+e.clientX+"px,"+e.clientY+"px) translate(-50%,-50%)";
    const tool = toolOverride || inkTool;
    if(tool==="eraser"){
      el.style.borderRadius = "50%";
      el.style.border = "1.5px solid rgba(63,58,52,.55)";
      el.style.background = "rgba(63,58,52,.08)";
    } else if(tool==="highlighter"){
      el.style.borderRadius = "3px";
      el.style.border = "1px solid rgba(63,58,52,.35)";
      el.style.background = inkColor;
      el.style.opacity = "0.5";
    } else {
      el.style.borderRadius = "50%";
      el.style.border = "1px solid rgba(255,255,255,.65)";
      el.style.background = inkColor;
      el.style.opacity = "0.55";
    }
  }
  function hideInkCursor(){ if(inkCursorEl) inkCursorEl.style.display = "none"; }

  function inkTouchCentroidY(){
    let sum=0, n=0;
    inkTouchPointers.forEach(y=>{ sum+=y; n++; });
    return n ? sum/n : null;
  }
  // A second finger landing mid-gesture means "scroll", not "draw" — abort
  // whatever single-finger mark had already started (the brief gap before
  // the second finger arrives can leave a stray dot/short line otherwise)
  // and stay in scroll mode until every finger lifts, so 2->1 finger while
  // panning doesn't suddenly resume drawing.
  function endInkTouch(pointerId){
    inkTouchPointers.delete(pointerId);
    if(inkTouchPointers.size===0){ inkMultiTouchActive = false; inkPanLastCentroidY = null; }
    else if(inkMultiTouchActive){ inkPanLastCentroidY = inkTouchCentroidY(); } // avoid a jump when the touch count changes
  }

  // Pointer Events' button-bit convention for a stylus barrel button is
  // inconsistent across Android/Samsung builds (and some intercept the
  // S Pen button for a system gesture before it reaches the page), so
  // these values stay worth having when something misbehaves. They go to
  // the console only now: this used to paint a black diagnostic panel
  // across the bottom of the screen, and it shipped — so every S Pen user
  // got a debug console over their book the moment the pen touched down.
  function inkDebugLog(msg){ console.log("[ink]", msg); }

  // Stylus side/barrel button switches to eraser while held — Samsung S Pen
  // and most active styluses report this via Pointer Events, but which bit
  // isn't fully consistent across Android/Samsung builds: the W3C
  // convention is buttons bit 2 ("secondary button"), but some
  // implementations instead set bit 32 (the "eraser" bit, normally meant
  // for physically flipping a Wacom-style pen to its eraser end) for a
  // barrel-button press since that's semantically what it's requesting.
  // Checking both costs nothing and covers either convention. (Apple
  // Pencil has no barrel button — its double-tap isn't exposed to web
  // pages at all, only to native code via UIPencilInteraction.)
  function isBarrelHeld(e){ return e.pointerType==="pen" && !!(e.buttons & (2|32)); }
  function wireInkPointerEvents(){
    inkCanvas.addEventListener("pointerdown", (e)=>{
      if(!penMode) return;
      if(e.pointerType==="touch"){
        inkTouchPointers.set(e.pointerId, e.clientY);
        if(inkTouchPointers.size>=2) inkMultiTouchActive = true;
        if(inkMultiTouchActive){
          if(inkDrawing){ inkDrawing = null; inkActivePointerId = null; redrawInk(); }
          inkPanLastCentroidY = inkTouchCentroidY();
          return;
        }
        // Palm rejection: while (or just after) a stylus is in contact,
        // ignore touch input entirely so a resting palm doesn't leave stray marks.
        const recentPen = Date.now()-inkLastPenActivityTs < 700;
        if(inkActiveStylusId!==null || recentPen) return;
      }
      if(e.pointerType==="pen"){ inkActiveStylusId = e.pointerId; inkLastPenActivityTs = Date.now(); }
      e.preventDefault();
      if(layoutInkWindow(false)) redrawInk();
      const barrelHeld = isBarrelHeld(e);
      if(e.pointerType==="pen") inkDebugLog("pen down: button="+e.button+" buttons="+e.buttons+" barrelHeld="+barrelHeld);
      const tool = barrelHeld ? "eraser" : inkTool;
      inkActivePointerId = e.pointerId;
      try{ inkCanvas.setPointerCapture(e.pointerId); }catch(err){}
      const width = strokeWidthFor(e, tool);
      updateInkCursor(e, width, tool);
      inkDrawing = { tool, color:inkColor, width, points:[pointerToNorm(e)] };
    });
    inkCanvas.addEventListener("pointermove", (e)=>{
      if(!penMode) return;
      if(e.pointerType==="touch" && inkTouchPointers.has(e.pointerId)){
        inkTouchPointers.set(e.pointerId, e.clientY);
        if(inkMultiTouchActive){
          e.preventDefault();
          const centroidY = inkTouchCentroidY();
          // .read-scroll has scroll-behavior:smooth for programmatic jumps
          // (chapter change, TOC nav) — that also applies to plain scrollTop
          // writes, so every one of these per-frame drag updates was
          // launching its own catch-up animation and stomping on the last,
          // which is exactly what read as laggy/rubber-bandy. scrollTo with
          // behavior:"instant" bypasses it for just this real-time drag.
          if(inkPanLastCentroidY!==null){
            readScroll.scrollTo({ top: readScroll.scrollTop - (centroidY - inkPanLastCentroidY), behavior: "instant" });
          }
          inkPanLastCentroidY = centroidY;
          return;
        }
      }
      if(e.pointerType==="pen"){
        inkLastPenActivityTs = Date.now();
        if(e.buttons !== inkLastLoggedButtons){ inkDebugLog("pen move: button="+e.button+" buttons="+e.buttons); inkLastLoggedButtons = e.buttons; }
      }
      // Mid-stroke button toggle: pressing/releasing the barrel button
      // *while already drawing* (not just at the moment the tip touches
      // down) commits what's drawn so far as one stroke and starts a fresh
      // one with the new tool, so it isn't locked in only at stroke-start.
      if(inkDrawing && e.pointerType==="pen" && e.pointerId===inkActivePointerId){
        const wantTool = isBarrelHeld(e) ? "eraser" : inkTool;
        if(wantTool !== inkDrawing.tool){
          // read the hand-off point before anchoring rewrites the committed
          // stroke's coordinates — the new stroke is still chapter-relative
          const lastPt = inkDrawing.points[inkDrawing.points.length-1].slice();
          if(inkDrawing.points.length>1){ anchorStroke(inkDrawing); inkStrokes.push(inkDrawing); inkRedoStack = []; }
          inkDrawing = { tool:wantTool, color:inkColor, width:strokeWidthFor(e, wantTool), points:[lastPt] };
        }
      }
      const tool = inkDrawing ? inkDrawing.tool : (isBarrelHeld(e) ? "eraser" : inkTool);
      updateInkCursor(e, strokeWidthFor(e, tool), tool);
      if(!inkDrawing || e.pointerId !== inkActivePointerId) return;
      e.preventDefault();
      const { w, h } = inkContentSize();
      // A stylus samples far faster than the display refreshes and the
      // browser merges those samples into one move event; asking for the
      // coalesced list back recovers the parts of the stroke that were
      // being thrown away, which is most of the detail in a fast flick.
      const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
      const samples = (coalesced && coalesced.length) ? coalesced : [e];
      const isHighlighter = inkDrawing.tool === "highlighter";
      const targets = inkDrawing.tool === "eraser" ? [inkCtx, highlightCtx] : [ctxForTool(inkDrawing.tool)];
      let moved = false;
      for(const ev of samples){
        const prev = appendInkPoint(ev, w, h);
        if(!prev) continue;
        moved = true;
        if(isHighlighter) continue; // repainted as one path below
        const pt = inkDrawing.points[inkDrawing.points.length-1];
        for(const ctx of targets){
          ctx.save();
          applyStrokeStyle(ctx, inkDrawing.tool, inkDrawing.color, inkDrawing.width);
          ctx.beginPath();
          ctx.moveTo(prev[0]*w, prev[1]*h);
          ctx.lineTo(pt[0]*w, pt[1]*h);
          ctx.stroke();
          ctx.restore();
        }
      }
      // A translucent marker drawn segment by segment doubles up at every
      // joint, so the live stroke read as a string of dark blobs until you
      // lifted the pen and it snapped to an even band. Repaint the whole
      // layer as one path instead.
      if(isHighlighter && moved) scheduleHighlightPreview();
    });
    const endStroke = (e)=>{
      if(e && e.pointerType==="touch") endInkTouch(e.pointerId);
      if(e && e.pointerType==="pen"){
        inkDebugLog("pen up ("+e.type+"): button="+e.button+" buttons="+e.buttons+" committedTool="+(inkDrawing&&inkDrawing.tool));
        inkLastLoggedButtons = null;
      }
      if(e && e.pointerType==="pen" && e.pointerId===inkActiveStylusId) inkActiveStylusId = null;
      if(!inkDrawing || (e && e.pointerId!==undefined && e.pointerId!==inkActivePointerId)) return;
      const finished = inkDrawing;
      inkDrawing = null;
      if(finished.points.length>1){
        anchorStroke(finished);
        inkStrokes.push(finished);
        inkRedoStack = [];
        saveInkForChapter();
        updateInkUndoButtons();
        // the live preview drew plain segments for low-latency feedback;
        // redraw now so the committed stroke gets the smoothed curve treatment
        redrawInk();
      }
      inkActivePointerId = null;
    };
    inkCanvas.addEventListener("pointerup", endStroke);
    inkCanvas.addEventListener("pointercancel", endStroke);
    inkCanvas.addEventListener("pointerleave", (e)=>{
      if(e.pointerType==="touch") endInkTouch(e.pointerId);
      if(e.pointerId===inkActivePointerId) endStroke(e);
      hideInkCursor();
    });
    // Some browsers treat a stylus barrel-button press like a right-click
    // and fire a native context menu on/after it — block that while
    // drawing so it can't pop up and swallow the rest of the gesture.
    inkCanvas.addEventListener("contextmenu", (e)=>{ if(penMode) e.preventDefault(); });
  }

  function setPenMode(on){
    penMode = on;
    $("penBtn").classList.toggle("active", on);
    if(inkCanvas) inkCanvas.classList.toggle("inactive", !penMode);
    if(on){ closeSettings(); if(!isTabletUp()) closeDrawer(); openInkPop(); }
    else { closeInkPop(); hideInkCursor(); }
  }
  // no shared #overlay here on purpose: it sits above the ink canvas
  // (z-index 50 vs 5) and would silently block every drawing gesture
  // while the toolbar is open, since pen mode keeps the toolbar open
  // the whole time you're drawing.
  function openInkPop(){ $("inkPop").classList.add("show"); }
  function closeInkPop(){ $("inkPop").classList.remove("show"); }
  $("penBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    if(!penMode){ setPenMode(true); return; }
    // pen is already selected: if the toolbar is showing, this tap means
    // "I'm done" (turn drawing off); if it was already dismissed by an
    // outside tap, just bring the tool options back without losing the
    // selected pen/color.
    if($("inkPop").classList.contains("show")) setPenMode(false);
    else openInkPop();
  });
  // Tapping anywhere outside the toolbar dismisses just the toolbar — the
  // pen stays selected and ready to draw, it just gets out of the way.
  document.addEventListener("pointerdown", (e)=>{
    if(!penMode) return;
    const pop = $("inkPop");
    if(!pop.classList.contains("show")) return;
    if(pop.contains(e.target) || e.target.closest("#penBtn")) return;
    closeInkPop();
  });

  document.querySelectorAll(".ink-swatch[data-ink-color]").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      inkTool = "pen"; inkColor = sw.dataset.inkColor;
      document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
      sw.classList.add("active");
    });
  });
  document.querySelectorAll(".ink-swatch[data-ink-highlight]").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      inkTool = "highlighter"; inkColor = sw.dataset.inkHighlight;
      document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
      sw.classList.add("active");
    });
  });
  $("inkEraserBtn").addEventListener("click", ()=>{
    inkTool = "eraser";
    document.querySelectorAll(".ink-swatch").forEach(s=>s.classList.remove("active"));
    $("inkEraserBtn").classList.add("active");
  });
  document.querySelectorAll(".ink-size-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      inkSize = parseFloat(b.dataset.inkSize);
      document.querySelectorAll(".ink-size-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    });
  });
  $("inkUndoBtn").addEventListener("click", undoLastStroke);
  $("inkRedoBtn").addEventListener("click", redoLastStroke);
  // One tap used to destroy every mark on the chapter with nothing to undo
  // it — and sync then carried that to the other devices. Offer the way back
  // instead of adding a confirm dialog in front of the common case.
  $("inkClearBtn").addEventListener("click", ()=>{
    if(!inkStrokes.length) return;
    const cleared = inkStrokes;
    const fromFile = activeFile && activeFile.id, fromChapter = chapterIdx;
    inkStrokes = [];
    inkRedoStack = [];
    saveInkForChapter();
    redrawInk();
    updateInkUndoButtons();
    toast("이 챕터의 필기를 모두 지웠어요", "되돌리기", ()=>{
      // only if you are still looking at the chapter it came from
      if(!activeFile || activeFile.id !== fromFile || chapterIdx !== fromChapter){
        toast("필기를 지운 챕터를 벗어나서 되돌릴 수 없어요");
        return;
      }
      inkStrokes = cleared;
      saveInkForChapter();
      redrawInk();
      updateInkUndoButtons();
    });
  });

  window.addEventListener("resize", ()=>{
    if(readerScreenVisible()) resizeInkCanvas();
  });
  // tablet: the TOC panel's width animates (open/close), which reflows how
  // much room the reading column actually has — resync the ink canvas once
  // that animation settles rather than mid-transition.
  drawer.addEventListener("transitionend", (e)=>{
    if(e.propertyName === "width" && readerScreenVisible()) resizeInkCanvas();
  });

  /* ---------------- PWA: service worker registration ---------------- */
  // GitHub Pages serves sw.js with Cache-Control: max-age=600, so a plain
  // "./sw.js" registration can keep re-checking a stale cached copy for up
  // to 10 minutes after a deploy and never notice the update. Bumping this
  // query string on every deploy (alongside the cache names in sw.js) forces
  // a genuine network fetch every time, since the browser has never cached
  // that exact URL before.
  const SW_VERSION = "49";
  if("serviceWorker" in navigator){
    // Only reload when an *update* replaces an already-controlling worker.
    // sw.js calls clients.claim(), which makes navigator.serviceWorker.controller
    // become non-null right after activation even on a brand-new install — so
    // without this check every first-ever visit would trigger a surprise reload.
    const hadControllerBeforeRegister = !!navigator.serviceWorker.controller;
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js?v="+SW_VERSION).then(reg=>{
        // once a new shell takes over, reload once so the user gets it immediately
        let reloaded = false;
        reg.addEventListener("updatefound", ()=>{
          const installing = reg.installing;
          if(!installing) return;
          installing.addEventListener("statechange", ()=>{
            if(installing.state === "activated" && hadControllerBeforeRegister && !reloaded){
              reloaded = true;
              location.reload();
            }
          });
        });
      }).catch(()=>{});
    });
  }

  /* ---------------- init ---------------- */
  (async function init(){
    await loadLibrary();
    await loadPrefs();
    markLibraryReady();
    sortSelect.value = sortMode;
    updateDensityButtons();
    $("customBgInput").value = customBg;
    $("customTextInput").value = customText;
    $("customThemeSwatch").style.setProperty("--sw-custom-bg", customBg);
    $("customThemeSwatch").style.setProperty("--sw-custom-text", customText);
    renderAll();

    // cloud sync loads in the background — never blocks the local-first
    // startup above, and just leaves the "로그인" button in place if it
    // can't load (offline, blocked, etc.)
    renderAccount();
    ensureFirebase();
    prepareGis();
    window.addEventListener("focus", ()=>{ if(fb && fb.currentUser) syncNow(); });
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible" && fb && fb.currentUser) syncNow();
    });
    window.addEventListener("online", ()=>{ syncRetryDelay = 0; if(fb && fb.currentUser) syncNow(); });
    window.addEventListener("offline", ()=>{ if(fb && fb.currentUser) setSyncStatus("offline"); });
    // a safety net behind the live listener, not the main path any more
    setInterval(()=>{ if(fb && fb.currentUser) syncNow(); }, 5*60*1000);
    // keep the "동기화됨 · n분 전" line honest while the menu sits open
    setInterval(()=>{ if(syncState === "synced") setSyncStatus("synced"); }, 60*1000);
  })();

})();
</script>
</body>
</html>
