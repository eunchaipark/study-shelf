<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>서재 — 마크다운을 책처럼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --ink-900:#0c0d10;
    --ink-800:#16171b;
    --ink-700:#202227;
    --ink-600:#2b2e35;
    --ink-500:#454952;
    --amber-300:#8fa5ff;
    --amber-400:#5b7cfa;
    --amber-500:#435fdb;
    --muted:#85888f;
    --paper:#f4f4f1;
    --danger:#e2604c;
    --ui-font:'Noto Sans KR', sans-serif;
    --display-font:'Space Grotesk', 'Noto Sans KR', sans-serif;
    --read-font:'Noto Serif KR', serif;
    --read-size:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--ui-font); background:var(--ink-900); color:var(--paper); overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::selection{background:var(--amber-400); color:var(--ink-900);}
  svg{display:block;}
  .icon{width:18px; height:18px; flex:0 0 auto;}

  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;}
  .hidden{display:none !important;}

  /* ============ LIBRARY SCREEN ============ */
  #libraryScreen{background:var(--ink-900);}

  .lib-topbar{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px; padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid var(--ink-700);
    flex:0 0 auto;
  }
  .lib-brand{font-family:var(--display-font); font-weight:600; font-size:19px; color:var(--paper);}
  .lib-brand small{display:block; font-family:var(--ui-font); font-weight:500; font-size:11px; letter-spacing:.1em; color:var(--amber-300); text-transform:uppercase; margin-top:2px;}
  .lib-spacer{flex:1;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; border:none; border-radius:10px;
    font-size:13px; font-weight:600; padding:10px 14px; white-space:nowrap;
  }
  .btn-primary{background:var(--amber-400); color:var(--ink-900);}
  .btn-primary:active{background:var(--amber-500);}
  .btn-ghost{background:var(--ink-800); color:var(--paper); border:1px solid var(--ink-700);}
  .btn-ghost:active{background:var(--ink-700);}

  .lib-body{flex:1; display:flex; min-height:0; position:relative;}

  .folder-rail{
    flex:0 0 auto; overflow-x:auto; overflow-y:hidden; white-space:nowrap;
    display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--ink-700);
    background:var(--ink-900);
  }
  .folder-chip{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--ink-800); border:1px solid var(--ink-700); color:var(--muted);
    border-radius:9px; padding:8px 14px; font-size:13px; font-weight:600; flex:0 0 auto;
  }
  .folder-chip .count{color:var(--ink-500); font-weight:500;}
  .folder-chip.active{background:var(--amber-400); border-color:var(--amber-400); color:var(--ink-900);}
  .folder-chip.active .count{color:rgba(17,21,29,.55);}
  .folder-chip.new{color:var(--amber-300); border-style:dashed;}

  .lib-main{flex:1; overflow-y:auto; padding:16px 16px 100px;}

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px 20px; color:var(--muted); gap:10px;
  }
  .empty-state .icon-lg{width:40px; height:40px; color:var(--ink-600); margin-bottom:6px;}
  .empty-state strong{color:var(--paper); font-size:15px; font-weight:600;}
  .empty-state span{font-size:13px; max-width:280px;}

  .file-card{
    display:flex; align-items:center; gap:12px;
    background:var(--ink-800); border:1px solid var(--ink-700); border-radius:12px;
    padding:14px; margin-bottom:10px; position:relative;
  }
  .file-card .doc-icon{
    width:36px; height:36px; border-radius:9px; background:var(--ink-700); color:var(--amber-300);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .file-card .info{flex:1; min-width:0;}
  .file-card .name{font-size:14.5px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .file-card .meta{font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .file-card .meta .tag{background:var(--ink-700); color:var(--muted); padding:2px 8px; border-radius:999px; font-size:11px;}
  .file-card .progress-bar{height:3px; border-radius:2px; background:var(--ink-700); margin-top:8px; overflow:hidden;}
  .file-card .progress-bar i{display:block; height:100%; background:var(--amber-400);}
  .file-card .more-btn{
    width:32px; height:32px; border-radius:8px; background:transparent; border:none; color:var(--muted);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .file-card .more-btn:active{background:var(--ink-700);}
  .file-card .hit{position:absolute; inset:0; right:44px; background:transparent; border:none;}

  .drag-overlay{
    position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(17,21,29,0.92); border:2px dashed var(--amber-400); margin:10px; border-radius:16px;
  }
  .drag-overlay.show{display:flex;}
  .drag-overlay .msg{text-align:center; color:var(--amber-300); font-size:15px; font-weight:600;}

  #fileInput{display:none;}

  /* ============ Popovers / Modals (shared) ============ */
  .overlay{position:absolute; inset:0; background:rgba(0,0,0,0.5); z-index:50; opacity:0; pointer-events:none; transition:opacity .15s;}
  .overlay.show{opacity:1; pointer-events:auto;}

  .menu-pop{
    position:absolute; z-index:51; min-width:170px;
    background:var(--ink-800); border:1px solid var(--ink-700); border-radius:12px; padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .menu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:none; color:var(--paper); padding:10px 12px; border-radius:8px; font-size:13.5px;
  }
  .menu-item:active{background:var(--ink-700);}
  .menu-item.danger{color:var(--danger);}
  .menu-divider{height:1px; background:var(--ink-700); margin:5px 4px;}
  .menu-sub-label{font-size:11px; color:var(--muted); padding:8px 12px 4px; text-transform:uppercase; letter-spacing:.06em;}

  .modal{
    position:absolute; z-index:52; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(320px, 86vw); background:var(--ink-800); border:1px solid var(--ink-700); border-radius:16px;
    padding:20px; box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h4{margin:0 0 14px; font-size:15px; font-family:var(--display-font); font-weight:600; color:var(--paper);}
  .modal p{margin:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.5;}
  .modal input[type="text"]{
    width:100%; background:var(--ink-900); border:1px solid var(--ink-600); color:var(--paper);
    border-radius:9px; padding:11px 12px; font-size:14px; margin-bottom:16px;
  }
  .modal input[type="text"]:focus{outline:2px solid var(--amber-400); outline-offset:1px;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .modal-actions .btn{padding:9px 16px;}

  /* ============ READER SCREEN ============ */
  #readerScreen{ background:var(--ink-900); }
  .topbar{
    display:flex; align-items:center; gap:4px;
    padding:10px 10px; padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--ink-800); border-bottom:1px solid var(--ink-700); z-index:20;
  }
  .icon-btn{
    background:transparent; border:none; color:var(--paper);
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .icon-btn:active{background:var(--ink-700);}
  .icon-btn .icon{width:20px; height:20px;}
  .topbar .title{
    flex:1; min-width:0; text-align:center; font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--paper); font-family:var(--display-font);
  }
  .topbar .progress-pct{font-size:12px; color:var(--amber-300); font-variant-numeric:tabular-nums; width:34px; text-align:right;}
  .topbar .aa-btn{font-family:var(--display-font); font-weight:600; font-size:14px;}

  .read-scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:var(--read-bg, var(--paper)); scroll-behavior:smooth;}
  .read-inner{
    max-width:min(680px, 92vw); margin:0 auto; padding:40px 6px 90px;
    font-family:var(--read-font); font-size:var(--read-size); line-height:1.85; color:var(--read-text, #1d1e21);
  }
  .read-inner h1,.read-inner h2,.read-inner h3{font-weight:700; line-height:1.35; margin:1.4em 0 .6em; color:inherit;}
  .read-inner h1{font-size:1.55em; border-bottom:1px solid currentColor; padding-bottom:.3em;}
  .read-inner h2{font-size:1.28em;}
  .read-inner h3{font-size:1.1em;}
  .read-inner p{margin:0 0 1.1em;}
  .read-inner ul,.read-inner ol{margin:0 0 1.1em; padding-left:1.4em;}
  .read-inner li{margin-bottom:.4em;}
  .read-inner blockquote{margin:0 0 1.1em; padding:.4em 1em; border-left:3px solid var(--amber-500); background:rgba(201,143,58,0.08); font-style:italic;}
  .read-inner code{font-family:'SFMono-Regular',Consolas,monospace; font-size:.85em; background:rgba(0,0,0,0.06); padding:.15em .4em; border-radius:5px;}
  .read-inner pre{background:rgba(0,0,0,0.06); padding:14px; border-radius:10px; overflow-x:auto; margin:0 0 1.2em;}
  .read-inner pre code{background:none; padding:0;}
  .read-inner img{max-width:100%; border-radius:8px; display:block; margin:1em auto;}
  .read-inner table{border-collapse:collapse; width:100%; margin:0 0 1.2em; font-size:.92em;}
  .read-inner th,.read-inner td{border:1px solid rgba(0,0,0,0.15); padding:8px 10px; text-align:left;}
  .read-inner hr{border:none; border-top:1px solid rgba(0,0,0,0.15); margin:2em 0;}
  .read-inner a{color:var(--amber-500);}

  [data-theme="light"] .read-scroll{ --read-bg:#fafaf8; --read-text:#1d1e21; }
  [data-theme="sepia"] .read-scroll{ --read-bg:#f1e6d3; --read-text:#3b3226; }
  [data-theme="night"] .read-scroll{ --read-bg:#131418; --read-text:#e6e6e2; }
  [data-theme="night"] .read-inner code, [data-theme="night"] .read-inner pre{background:rgba(255,255,255,0.08);}
  [data-theme="night"] .read-inner blockquote{background:rgba(240,199,126,0.08);}
  [data-theme="night"] .read-inner th,[data-theme="night"] .read-inner td{border-color:rgba(255,255,255,0.15);}
  [data-theme="night"] .read-inner hr{border-color:rgba(255,255,255,0.15);}

  .chapternav{
    display:flex; align-items:center; gap:10px; padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--ink-800); border-top:1px solid var(--ink-700); z-index:20;
  }
  .navbtn{flex:0 0 auto; background:var(--ink-700); color:var(--paper); border:none; border-radius:10px; padding:9px 14px; font-size:13px; font-weight:600;}
  .navbtn:disabled{opacity:.35;}
  .navbtn:active:not(:disabled){background:var(--ink-600);}
  .chapter-indicator{flex:1; text-align:center; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .ribbon-track{position:absolute; top:0; right:0; width:12px; height:100%; background:rgba(0,0,0,0.15); z-index:15; pointer-events:none;}
  .ribbon-fill{
    position:absolute; top:0; left:0; width:100%; height:0%;
    background:linear-gradient(180deg, var(--amber-300), var(--amber-500));
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), 50% 100%, 0 calc(100% - 9px));
    transition:height .25s ease;
  }

  .drawer{
    position:absolute; top:0; left:0; height:100%; width:min(300px, 82vw);
    background:var(--ink-800); z-index:55; transform:translateX(-100%); transition:transform .25s ease;
    display:flex; flex-direction:column; box-shadow:2px 0 24px rgba(0,0,0,0.4);
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:18px 16px 12px; border-bottom:1px solid var(--ink-700);}
  .drawer-head .k{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:600;}
  .drawer-head .book-title{font-family:var(--display-font); font-weight:600; font-size:17px; margin-top:4px; color:var(--paper);}
  .toc-list{flex:1; overflow-y:auto; padding:8px;}
  .toc-item{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; background:transparent; border:none; color:var(--paper); padding:11px 10px; border-radius:8px; font-size:14px;}
  .toc-item .n{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; flex:0 0 20px;}
  .toc-item.active{background:var(--ink-700); color:var(--amber-300);}

  .pop{
    position:absolute; top:52px; right:10px; z-index:55;
    background:var(--ink-800); border:1px solid var(--ink-700); border-radius:14px; padding:16px; width:220px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:all .15s ease;
  }
  .pop.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  .pop h5{margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
  .font-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .font-row button{width:34px; height:34px; border-radius:8px; border:1px solid var(--ink-600); background:var(--ink-700); color:var(--paper); font-size:15px; font-weight:700;}
  .font-row .val{font-size:13px; color:var(--paper); font-variant-numeric:tabular-nums;}
  .theme-row{display:flex; gap:8px;}
  .theme-swatch{flex:1; height:44px; border-radius:10px; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
  .theme-swatch.active{border-color:var(--amber-400);}
  .sw-light{background:#fafaf8; color:#1d1e21;}
  .sw-sepia{background:#f1e6d3; color:#3b3226;}
  .sw-night{background:#131418; color:#e6e6e2;}

  /* tablet / desktop: two-column library */
  @media (min-width:720px){
    .lib-body{flex-direction:row;}
    .folder-rail{
      flex-direction:column; overflow-y:auto; overflow-x:hidden; white-space:normal;
      width:220px; border-bottom:none; border-right:1px solid var(--ink-700); padding:16px 12px; align-items:stretch;
    }
    .folder-chip{justify-content:flex-start; border-radius:9px;}
    .lib-main{padding:20px 28px 100px;}
    .read-inner{padding-top:56px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ LIBRARY SCREEN ============ -->
  <section id="libraryScreen" class="screen">
    <div class="lib-topbar">
      <div class="lib-brand">서재<small>Study Shelf</small></div>
      <div class="lib-spacer"></div>
      <button class="btn btn-ghost" id="newFolderBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 11v4M10 13h4"/></svg>
        새 폴더
      </button>
      <button class="btn btn-primary" id="uploadBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7 8l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        파일 업로드
      </button>
    </div>

    <div class="lib-body" id="libBody">
      <div class="folder-rail" id="folderRail"></div>
      <div class="lib-main" id="libMain">
        <div id="fileList"></div>
      </div>

      <div class="drag-overlay" id="dragOverlay">
        <div class="msg">파일을 여기에 놓으면 서재에 추가됩니다</div>
      </div>
    </div>

    <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain" multiple>
  </section>

  <!-- ============ READER SCREEN ============ -->
  <section id="readerScreen" class="screen hidden" data-theme="light">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="서재로">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn" id="tocBtn" aria-label="목차">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="title" id="bookTitleTop">제목</div>
      <div class="progress-pct" id="progressPct">0%</div>
      <button class="icon-btn aa-btn" id="settingsBtn" aria-label="설정">Aa</button>
    </div>

    <div class="read-scroll" id="readScroll">
      <div class="read-inner" id="readInner"></div>
    </div>

    <div class="chapternav">
      <button class="navbtn" id="prevBtn">이전</button>
      <div class="chapter-indicator" id="chapterIndicator">1 / 1</div>
      <button class="navbtn" id="nextBtn">다음</button>
    </div>

    <div class="ribbon-track"><div class="ribbon-fill" id="ribbonFill"></div></div>

    <div class="pop" id="settingsPop">
      <h5>글자 크기</h5>
      <div class="font-row">
        <button id="fontMinus">–</button>
        <span class="val" id="fontVal">18px</span>
        <button id="fontPlus">+</button>
      </div>
      <h5>테마</h5>
      <div class="theme-row">
        <button class="theme-swatch sw-light" data-theme-choice="light">밝게</button>
        <button class="theme-swatch sw-sepia" data-theme-choice="sepia">세피아</button>
        <button class="theme-swatch sw-night" data-theme-choice="night">야간</button>
      </div>
    </div>

    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <div class="k">목차</div>
        <div class="book-title" id="drawerTitle">제목</div>
      </div>
      <div class="toc-list" id="tocList"></div>
    </div>
  </section>

  <!-- ============ shared overlay / modal layer ============ -->
  <div class="overlay" id="overlay"></div>
  <div id="modalLayer"></div>

</div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);

  /* ---------------- storage helpers ---------------- */
  const S = {
    async getJSON(key, fallback){
      try{
        if(!window.storage) return fallback;
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : fallback;
      }catch(e){ return fallback; }
    },
    async setJSON(key, val){
      try{ if(window.storage) await window.storage.set(key, JSON.stringify(val), false); }catch(e){}
    },
    async getText(key){
      try{
        if(!window.storage) return null;
        const r = await window.storage.get(key, false);
        return r ? r.value : null;
      }catch(e){ return null; }
    },
    async setText(key, val){
      try{ if(window.storage) await window.storage.set(key, val, false); }catch(e){}
    },
    async del(key){
      try{ if(window.storage) await window.storage.delete(key, false); }catch(e){}
    }
  };
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const escapeHtml = (s) => String(s).replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));

  /* ---------------- library state ---------------- */
  let folders = [];   // [{id, name}]
  let files = [];     // [{id, name, title, folderId, chapters, updatedTs, progress:{chapterIdx,fontSize,theme}}]
  let currentFilter = "all"; // 'all' | 'uncategorized' | folderId

  async function loadLibrary(){
    folders = await S.getJSON("app:folders", []);
    files = await S.getJSON("app:files", []);
  }
  async function persistFolders(){ await S.setJSON("app:folders", folders); }
  async function persistFiles(){ await S.setJSON("app:files", files); }

  function closeAllOverlays(){
    $("overlay").classList.remove("show");
    $("modalLayer").innerHTML = "";
    document.querySelectorAll(".menu-pop").forEach(n=>n.remove());
  }
  $("overlay").addEventListener("click", closeAllOverlays);
  $("newFolderBtn").addEventListener("click", openNewFolderModal);

  /* ---------------- folder rail ---------------- */
  function renderFolderRail(){
    const rail = $("folderRail");
    rail.innerHTML = "";
    const all = document.createElement("button");
    all.className = "folder-chip" + (currentFilter==="all" ? " active":"");
    all.innerHTML = "전체 <span class=\"count\">"+files.length+"</span>";
    all.addEventListener("click", ()=>{ currentFilter="all"; renderAll(); });
    rail.appendChild(all);

    const uncatCount = files.filter(f=>!f.folderId).length;
    const uncat = document.createElement("button");
    uncat.className = "folder-chip" + (currentFilter==="uncategorized" ? " active":"");
    uncat.innerHTML = "미분류 <span class=\"count\">"+uncatCount+"</span>";
    uncat.addEventListener("click", ()=>{ currentFilter="uncategorized"; renderAll(); });
    rail.appendChild(uncat);

    folders.forEach(f=>{
      const count = files.filter(x=>x.folderId===f.id).length;
      const chip = document.createElement("button");
      chip.className = "folder-chip" + (currentFilter===f.id ? " active":"");
      chip.innerHTML = escapeHtml(f.name) + " <span class=\"count\">"+count+"</span>";
      chip.addEventListener("click", ()=>{ currentFilter=f.id; renderAll(); });
      rail.appendChild(chip);
    });

    const add = document.createElement("button");
    add.className = "folder-chip new";
    add.textContent = "+ 폴더";
    add.addEventListener("click", openNewFolderModal);
    rail.appendChild(add);
  }

  /* ---------------- file list ---------------- */
  function visibleFiles(){
    if(currentFilter==="all") return files.slice().sort((a,b)=>b.updatedTs-a.updatedTs);
    if(currentFilter==="uncategorized") return files.filter(f=>!f.folderId).sort((a,b)=>b.updatedTs-a.updatedTs);
    return files.filter(f=>f.folderId===currentFilter).sort((a,b)=>b.updatedTs-a.updatedTs);
  }

  function folderName(id){
    const f = folders.find(x=>x.id===id);
    return f ? f.name : null;
  }

  function renderFileList(){
    const list = $("fileList");
    const vis = visibleFiles();
    list.innerHTML = "";
    if(vis.length===0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML =
        '<svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>'+
        '<strong>'+(files.length===0 ? "아직 올린 파일이 없어요" : "이 폴더는 비어 있어요")+'</strong>'+
        '<span>오른쪽 위 "파일 업로드" 버튼을 누르거나, md 파일을 화면에 끌어다 놓으면 서재에 추가돼요.</span>';
      list.appendChild(empty);
      return;
    }
    vis.forEach(f=>{
      const prog = f.progress || {};
      const pct = typeof prog.pct === "number" ? Math.round(prog.pct*100) : 0;
      const card = document.createElement("div");
      card.className = "file-card";
      const d = new Date(f.updatedTs);
      const dateStr = d.toLocaleDateString("ko-KR", {month:"short", day:"numeric"});
      const fName = folderName(f.folderId);
      card.innerHTML =
        '<div class="doc-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg></div>'+
        '<div class="info">'+
          '<div class="name">'+escapeHtml(f.title)+'</div>'+
          '<div class="meta">'+
            (fName ? '<span class="tag">'+escapeHtml(fName)+'</span>' : '')+
            '<span>'+f.chapterCount+'개 챕터</span><span>· '+dateStr+'</span>'+
            (pct>0 ? '<span>· '+pct+'% 읽음</span>' : '')+
          '</div>'+
          '<div class="progress-bar"><i style="width:'+pct+'%"></i></div>'+
        '</div>'+
        '<button class="more-btn" aria-label="더보기"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>'+
        '<button class="hit" aria-label="열기"></button>';
      card.querySelector(".hit").addEventListener("click", ()=> openBook(f.id));
      card.querySelector(".more-btn").addEventListener("click", (e)=>{ e.stopPropagation(); openFileMenu(e.currentTarget, f); });
      list.appendChild(card);
    });
  }

  function renderAll(){ renderFolderRail(); renderFileList(); }

  /* ---------------- new folder modal ---------------- */
  function openNewFolderModal(){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>새 폴더 만들기</h4>'+
      '<input type="text" id="folderNameInput" placeholder="예: 전공 서적, 자격증 공부">'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelFolder">취소</button>'+
        '<button class="btn btn-primary" id="confirmFolder">만들기</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);
    const input = $("folderNameInput");
    input.focus();
    $("cancelFolder").addEventListener("click", closeAllOverlays);
    const confirm = ()=>{
      const name = input.value.trim();
      if(!name) return;
      folders.push({id:genId(), name});
      persistFolders();
      closeAllOverlays();
      renderAll();
    };
    $("confirmFolder").addEventListener("click", confirm);
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") confirm(); });
  }

  /* ---------------- file kebab menu ---------------- */
  function openFileMenu(anchor, f){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const rect = anchor.getBoundingClientRect();
    const menu = document.createElement("div");
    menu.className = "menu-pop";
    menu.style.top = (rect.bottom + 6) + "px";
    menu.style.right = (window.innerWidth - rect.right) + "px";
    menu.innerHTML =
      '<button class="menu-item" data-act="rename"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>이름 변경</button>'+
      '<div class="menu-sub-label">폴더로 이동</div>'+
      '<button class="menu-item" data-act="move" data-folder="">미분류</button>'+
      folders.map(fo=>'<button class="menu-item" data-act="move" data-folder="'+fo.id+'">'+escapeHtml(fo.name)+'</button>').join("")+
      '<div class="menu-divider"></div>'+
      '<button class="menu-item danger" data-act="delete"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>삭제</button>';
    document.body.appendChild(menu);

    // keep the menu fully on-screen, flipping above the anchor if it would overflow the bottom
    const menuRect = menu.getBoundingClientRect();
    if(rect.bottom + 6 + menuRect.height > window.innerHeight){
      menu.style.top = "";
      menu.style.bottom = (window.innerHeight - rect.top + 6) + "px";
    }

    menu.querySelectorAll('[data-act="move"]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        f.folderId = btn.dataset.folder || null;
        f.updatedTs = Date.now();
        persistFiles();
        closeAllOverlays();
        renderAll();
      });
    });
    menu.querySelector('[data-act="rename"]').addEventListener("click", ()=> openRenameModal(f));
    menu.querySelector('[data-act="delete"]').addEventListener("click", ()=> openDeleteModal(f));
  }

  function openRenameModal(f){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>이름 변경</h4>'+
      '<input type="text" id="renameInput" value="'+escapeHtml(f.title)+'">'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelRename">취소</button>'+
        '<button class="btn btn-primary" id="confirmRename">저장</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);
    const input = $("renameInput");
    input.focus(); input.select();
    $("cancelRename").addEventListener("click", closeAllOverlays);
    const confirm = ()=>{
      const val = input.value.trim();
      if(!val) return;
      f.title = val;
      f.updatedTs = Date.now();
      persistFiles();
      closeAllOverlays();
      renderAll();
    };
    $("confirmRename").addEventListener("click", confirm);
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") confirm(); });
  }

  function openDeleteModal(f){
    closeAllOverlays();
    $("overlay").classList.add("show");
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML =
      '<h4>파일을 삭제할까요?</h4>'+
      '<p>"'+escapeHtml(f.title)+'"가 서재에서 삭제돼요. 이 작업은 되돌릴 수 없어요.</p>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cancelDelete">취소</button>'+
        '<button class="btn btn-primary" id="confirmDelete" style="background:var(--danger); color:#fff;">삭제</button>'+
      '</div>';
    $("modalLayer").appendChild(modal);
    $("cancelDelete").addEventListener("click", closeAllOverlays);
    $("confirmDelete").addEventListener("click", async ()=>{
      files = files.filter(x=>x.id!==f.id);
      await persistFiles();
      await S.del("file-content:"+f.id);
      closeAllOverlays();
      renderAll();
    });
  }

  /* ---------------- upload flow ---------------- */
  const uploadInput = $("fileInput");
  $("uploadBtn").addEventListener("click", ()=> uploadInput.click());
  uploadInput.addEventListener("change", (e)=>{
    Array.from(e.target.files).forEach(handleFile);
    uploadInput.value = "";
  });

  function handleFile(file){
    if(!file) return;
    if(!/\.(md|markdown)$/i.test(file.name) && file.type !== "text/markdown" && file.type !== "text/plain") return;
    const reader = new FileReader();
    reader.onload = async (e)=>{
      const text = e.target.result;
      const id = genId();
      const h1 = text.match(/^#\s+(.*)/m);
      const title = h1 ? h1[1].trim() : file.name.replace(/\.(md|markdown)$/i,"");
      const chapters = splitChapters(text, title);
      await S.setText("file-content:"+id, text);
      files.push({
        id, name:file.name, title,
        folderId: (currentFilter!=="all" && currentFilter!=="uncategorized") ? currentFilter : null,
        chapterCount: chapters.length,
        updatedTs: Date.now(),
        progress: {chapterIdx:0, pct:0, fontSize:18, theme:"light"}
      });
      await persistFiles();
      renderAll();
    };
    reader.readAsText(file, "utf-8");
  }

  const dragOverlay = $("dragOverlay");
  let dragCounter = 0;
  ["dragenter","dragover"].forEach(ev=>{
    document.addEventListener(ev, (e)=>{
      if(readerScreenVisible()) return;
      e.preventDefault();
      if(ev==="dragenter"){ dragCounter++; dragOverlay.classList.add("show"); }
    });
  });
  ["dragleave"].forEach(ev=>{
    document.addEventListener(ev, (e)=>{
      dragCounter = Math.max(0, dragCounter-1);
      if(dragCounter===0) dragOverlay.classList.remove("show");
    });
  });
  document.addEventListener("drop", (e)=>{
    if(readerScreenVisible()) return;
    e.preventDefault();
    dragCounter = 0;
    dragOverlay.classList.remove("show");
    const dt = e.dataTransfer;
    if(dt && dt.files) Array.from(dt.files).forEach(handleFile);
  });
  function readerScreenVisible(){ return !$("readerScreen").classList.contains("hidden"); }

  /* ---------------- markdown -> chapters ---------------- */
  function splitChapters(md, fallbackTitle){
    const lines = md.split("\n");
    const headIdx = [];
    lines.forEach((line,i)=>{ if(/^#{1,2}\s+\S/.test(line)) headIdx.push(i); });
    const chunks = [];
    if(headIdx.length >= 2){
      if(headIdx[0] > 0){
        const intro = lines.slice(0, headIdx[0]).join("\n").trim();
        if(intro) chunks.push({title:"들어가며", text:intro});
      }
      for(let i=0;i<headIdx.length;i++){
        const start = headIdx[i];
        const end = i+1<headIdx.length ? headIdx[i+1] : lines.length;
        const text = lines.slice(start,end).join("\n");
        const m = lines[start].match(/^#{1,2}\s+(.*)/);
        chunks.push({title: m ? m[1].trim() : "챕터 "+(i+1), text});
      }
    } else {
      chunks.push({title: fallbackTitle, text: md});
    }
    return chunks.map(c=>({title:c.title, html: marked.parse(c.text)}));
  }

  /* ---------------- reader state ---------------- */
  const readerScreen = $("readerScreen");
  const libraryScreen = $("libraryScreen");
  const readScroll = $("readScroll");
  const readInner = $("readInner");
  const ribbonFill = $("ribbonFill");
  const progressPct = $("progressPct");
  const chapterIndicator = $("chapterIndicator");
  const bookTitleTop = $("bookTitleTop");
  const drawerTitle = $("drawerTitle");
  const tocList = $("tocList");
  const drawer = $("drawer");
  const settingsPop = $("settingsPop");
  const fontVal = $("fontVal");

  let activeFile = null;
  let activeChapters = [];
  let chapterIdx = 0;
  let fontSize = 18;
  let theme = "light";

  async function openBook(id){
    const f = files.find(x=>x.id===id);
    if(!f) return;
    const text = await S.getText("file-content:"+id);
    if(text==null) return;
    activeFile = f;
    activeChapters = splitChapters(text, f.title);
    fontSize = (f.progress && f.progress.fontSize) || 18;
    theme = (f.progress && f.progress.theme) || "light";
    applyFont(); applyTheme();

    bookTitleTop.textContent = f.title;
    drawerTitle.textContent = f.title;
    buildTOC();

    libraryScreen.classList.add("hidden");
    readerScreen.classList.remove("hidden");
    renderChapter((f.progress && f.progress.chapterIdx) || 0);
  }

  function renderChapter(idx, resetScroll){
    chapterIdx = Math.max(0, Math.min(idx, activeChapters.length-1));
    readInner.innerHTML = activeChapters[chapterIdx].html;
    if(resetScroll !== false) readScroll.scrollTop = 0;
    chapterIndicator.textContent = (chapterIdx+1) + " / " + activeChapters.length;
    $("prevBtn").disabled = chapterIdx === 0;
    $("nextBtn").disabled = chapterIdx === activeChapters.length-1;
    Array.from(tocList.children).forEach((el,i)=> el.classList.toggle("active", i===chapterIdx));
    updateProgress();
    saveProgress();
  }

  function updateProgress(){
    const el = readScroll;
    const max = el.scrollHeight - el.clientHeight;
    const frac = max > 0 ? el.scrollTop / max : 1;
    const overall = (chapterIdx + frac) / activeChapters.length;
    ribbonFill.style.height = Math.min(100, Math.max(2, overall*100)) + "%";
    progressPct.textContent = Math.round(overall*100) + "%";
    return overall;
  }
  readScroll.addEventListener("scroll", ()=>{
    updateProgress();
    clearTimeout(readScroll._t);
    readScroll._t = setTimeout(saveProgress, 500);
  });

  async function saveProgress(){
    if(!activeFile) return;
    const pct = updateProgress();
    activeFile.progress = {chapterIdx, pct, fontSize, theme};
    activeFile.updatedTs = Date.now();
    await persistFiles();
  }

  function buildTOC(){
    tocList.innerHTML = "";
    activeChapters.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "toc-item" + (i===chapterIdx ? " active":"");
      b.innerHTML = '<span class="n">'+String(i+1).padStart(2,"0")+'</span><span>'+escapeHtml(c.title)+'</span>';
      b.addEventListener("click", ()=>{ renderChapter(i); closeDrawer(); });
      tocList.appendChild(b);
    });
  }

  $("backBtn").addEventListener("click", ()=>{
    readerScreen.classList.add("hidden");
    libraryScreen.classList.remove("hidden");
    renderAll();
  });
  $("prevBtn").addEventListener("click", ()=> renderChapter(chapterIdx-1));
  $("nextBtn").addEventListener("click", ()=> renderChapter(chapterIdx+1));

  let touchX = null, touchY = null;
  readScroll.addEventListener("touchstart", (e)=>{
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, {passive:true});
  readScroll.addEventListener("touchend", (e)=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    // only treat as a page-turn swipe if the drag is clearly horizontal,
    // so normal up/down scrolling on tablets never gets mistaken for it
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0 && chapterIdx < activeChapters.length-1) renderChapter(chapterIdx+1);
      else if(dx > 0 && chapterIdx > 0) renderChapter(chapterIdx-1);
    }
    touchX = null; touchY = null;
  }, {passive:true});

  function openDrawer(){ drawer.classList.add("show"); $("overlay").classList.add("show"); }
  function closeDrawer(){ drawer.classList.remove("show"); $("overlay").classList.remove("show"); }
  $("tocBtn").addEventListener("click", openDrawer);
  $("overlay").addEventListener("click", ()=>{ closeDrawer(); closeSettings(); });

  function openSettings(){ settingsPop.classList.add("show"); $("overlay").classList.add("show"); }
  function closeSettings(){ settingsPop.classList.remove("show"); $("overlay").classList.remove("show"); }
  $("settingsBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    settingsPop.classList.contains("show") ? closeSettings() : openSettings();
  });

  function applyFont(){
    fontSize = Math.max(14, Math.min(26, fontSize));
    document.documentElement.style.setProperty("--read-size", fontSize+"px");
    fontVal.textContent = fontSize+"px";
  }
  $("fontMinus").addEventListener("click", ()=>{ fontSize -= 1; applyFont(); saveProgress(); });
  $("fontPlus").addEventListener("click", ()=>{ fontSize += 1; applyFont(); saveProgress(); });

  function applyTheme(){
    readerScreen.setAttribute("data-theme", theme);
    document.querySelectorAll(".theme-swatch").forEach(s=> s.classList.toggle("active", s.dataset.themeChoice === theme));
  }
  document.querySelectorAll(".theme-swatch").forEach(s=>{
    s.addEventListener("click", ()=>{ theme = s.dataset.themeChoice; applyTheme(); saveProgress(); });
  });

  /* ---------------- init ---------------- */
  (async function init(){
    await loadLibrary();
    renderAll();
  })();

})();
</script>
</body>
</html>
